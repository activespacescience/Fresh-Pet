<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>Freshpet · Completed Service Calls</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Freshpet color system — light only (matches the admin console). Apple system
   rounded font like the handheld field app; SF Mono for aligned numerics. */
:root{
  --bg:#FFF8F0; --sf:#FFFFFF; --sf2:#F6EEE3; --bd:#EEE0CF; --bd2:#DCC8AC;
  --line:rgba(42,37,33,.07);
  --tx:#2A2521; --tx2:#786B5E; --dim:#8A7A66;
  --ac:#E56A15; --ac2:#C85A0E; --gn:#2FA24C; --am:#CF8A17; --rd:#DB4A44;
  --shadow:0 1px 2px rgba(42,37,33,.04),0 4px 16px rgba(191,120,58,.08);
  --font:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Inline SVG icons (Lucide-style) — inherit color + font-size, replace emoji */
.ic-svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;stroke-width:2}
.logo .ic-svg{width:1.15em;height:1.15em;vertical-align:-.18em;color:var(--ac)}
/* Accessibility: visible keyboard focus + honor reduced-motion */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media (max-width:680px){.btn.sm{min-height:40px}}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 70px}
/* Header */
.hd{display:flex;align-items:center;gap:14px;padding:16px 0 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.hd .logo{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.hd .logo .fp{color:var(--ac)}
.hd .sub{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{font-size:.78rem;color:var(--tx2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:.84rem;font-weight:600;background:var(--ac);color:#fff;transition:filter .15s,background .15s,border-color .15s}
.btn:hover{filter:brightness(1.06)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.o:hover{border-color:var(--bd2);background:var(--sf2)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Tabs — clean underline nav (shared look with the admin console) */
.tabs{display:flex;gap:2px;margin:18px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.tab{padding:10px 15px;font-size:.9rem;font-weight:500;color:var(--tx2);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.tab:hover{color:var(--tx)}
.tab .ct{font-size:.7rem;font-weight:600;color:var(--dim);margin-left:5px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .v{font-size:1.7rem;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-top:2px}
/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .fg{display:flex;flex-direction:column;gap:5px}
label.f{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
select,input[type=search]{padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);color:var(--tx);font-size:.88rem;outline:none;min-width:180px}
select:focus,input:focus{border-color:var(--ac)}
/* Group header */
.grp-h{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.grp-h .ct{font-size:.68rem;font-weight:600;color:var(--dim);background:var(--sf2);border:1px solid var(--bd);border-radius:999px;padding:2px 9px}
/* Group-by segmented toggle (sub-control) */
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--sf)}
.seg button{padding:9px 14px;font-size:.84rem;font-weight:500;color:var(--tx2);background:transparent}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.seg button:not(.on):hover{color:var(--tx);background:var(--sf2)}
/* Collapsible invoice sections */
.inv{margin:12px 0}
.inv-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.inv-h.open{border-color:var(--bd2)}
.inv-h:hover{border-color:var(--bd2)}
.inv-h .chev{font-size:.9rem;color:var(--dim);width:14px;flex:none}
.inv-h .inv-t{flex:1;min-width:0}
.inv-h .ttl{font-weight:600;font-size:1rem;letter-spacing:-.01em}
.inv-h .sub{font-size:.78rem;color:var(--tx2);margin-top:1px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.inv-pdf{flex:none;font-size:.78rem;font-weight:600;color:var(--ac);border:1px solid var(--ac);border-radius:9px;padding:7px 11px;background:rgba(229,106,21,.08)}
.inv-pdf:hover{background:rgba(229,106,21,.16)}
.inv-nopdf{flex:none;font-size:.72rem;color:var(--dim)}
/* Call cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.call{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;width:100%}
.call:hover{border-color:var(--bd2);box-shadow:0 2px 6px rgba(42,37,33,.06),0 8px 22px rgba(191,120,58,.12)}
.call .st{font-weight:600;font-size:.98rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .ct{font-size:.78rem;color:var(--tx2);margin-top:1px}
.call .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);color:var(--tx2)}
.pill.gn{color:var(--gn);border-color:var(--gn);background:rgba(47,162,76,.12)}
.pill.ac{color:var(--ac);border-color:var(--ac);background:rgba(229,106,21,.12)}
.pill.iv{color:var(--am);border-color:var(--am);background:rgba(207,138,23,.14)}
.pill.dim{color:var(--dim)}
.pill.rs{color:#155E9B;border-color:#8FC4EA;background:#E2F0FB}
.pill.hold{color:#8A4B00;border-color:#E8B368;background:#FDF1DF}
/* Audit blue — the same blue as the form the technician fills in on the
   re-visit and the report it prints, so one colour means one thing across the
   phone, the PDF and this page. */
.auditbar{border:1px solid #8FC4EA;border-left-width:5px;border-radius:12px;background:#E2EFF9;
  padding:14px 16px;margin:0 0 16px;color:#12405F}
.auditbar .t{font-weight:800;font-size:.9rem;letter-spacing:.04em;color:#155E9B;display:flex;
  align-items:center;gap:7px}
.auditbar p{margin:8px 0 0;font-size:.85rem;line-height:1.55}
.auditbar p+p{margin-top:6px}
.vh{font-weight:800;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
  margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--bd)}
.vh.audit{color:#155E9B;border-bottom-color:#8FC4EA}
.vh .tag{font-weight:700;letter-spacing:.02em;text-transform:none;font-size:.76rem;color:#155E9B;
  background:#fff;border:1px solid #8FC4EA;border-radius:999px;padding:2px 9px;margin-left:6px}
.origwrap{margin-top:26px;border:1px solid var(--bd);border-radius:12px;background:var(--sf2);overflow:hidden}
.origwrap>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:800;font-size:.78rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap}
.origwrap>summary::-webkit-details-marker{display:none}
.origwrap>summary::before{content:'\25B8';font-size:.9rem;color:var(--dim);transition:transform .15s}
.origwrap[open]>summary::before{transform:rotate(90deg)}
.origwrap>summary:hover{background:var(--sf)}
.origwrap>summary .hint{font-weight:600;font-size:.74rem;letter-spacing:0;text-transform:none;
  color:var(--dim);margin-left:auto}
.origbody{padding:0 16px 18px;border-top:1px solid var(--bd)}
.call.audit{border-left:4px solid #155E9B}
.al-h{padding:14px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px 12px 0 0;
  border-bottom:none;box-shadow:var(--shadow)}
.al-h .ttl{font-weight:700;font-size:1.02rem;letter-spacing:-.01em}
.al-h .sub{font-size:.82rem;color:var(--tx2);margin-top:3px;line-height:1.45}
.al-wrap{border:1px solid var(--bd);border-top:none;border-radius:0 0 12px 12px;overflow-x:auto;
  box-shadow:var(--shadow);margin-bottom:18px;background:var(--sf)}
.al-wrap table{margin:0}
.al-wrap td{vertical-align:middle}
.al-store{font-weight:700}
.al-where{font-size:.78rem;color:var(--dim);margin-top:1px}
.al-hint{font-size:.7rem;color:var(--dim);margin-top:3px}
.al-pills{display:flex;flex-wrap:wrap;gap:5px}
.call.hold{border-left:4px solid #E8B368}
.holdbar{border:1px solid #E8B368;border-left-width:5px;border-radius:12px;background:#FDF1DF;
  padding:14px 16px;margin:0 0 16px;color:#5E3400}
.holdbar h4{margin:0 0 6px;font-size:.95rem;font-weight:800;color:#8A4B00;letter-spacing:.02em}
.holdbar .amt{font-size:1.5rem;font-weight:800;color:#8A4B00;line-height:1.1}
.holdbar p{margin:8px 0 0;font-size:.83rem;line-height:1.55}
.holdbar .lines{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.holdbar .lines span{font-size:.78rem;font-weight:700;background:#fff;border:1px solid #E8B368;
  border-radius:999px;padding:4px 10px}
.call.rs{border-left:4px solid #8FC4EA}
.call.sup{opacity:.72}
.call .dt{font-size:.78rem;color:var(--tx2);margin-top:9px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:44px 16px;text-align:center;color:var(--tx2);font-size:.95rem}
/* Tables — airy rows, light rules, hover (shared look with the admin console) */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.87rem}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sf2)}
tbody tr:last-child td{border-bottom:0}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(42,37,33,.45);z-index:800;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:16px;max-width:720px;width:100%;box-shadow:0 24px 60px rgba(42,37,33,.22);margin:auto}
.modal .mh{padding:20px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:12px}
.modal .mh .x{margin-left:auto;font-size:1.3rem;color:var(--tx2);line-height:1}
.modal .mb{padding:20px 22px}
.modal h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.modal .addr{font-size:.85rem;color:var(--tx2);margin-top:3px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:4px 0 18px}
.kv .i .k{font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.kv .i .v{font-size:.9rem;font-weight:600;margin-top:2px}
.sec-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ac);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px}
.chk{font-size:.85rem;display:flex;align-items:center;gap:8px;color:var(--tx)}
.chk .b{color:var(--gn);font-weight:800}
.chk.off{color:var(--dim)}.chk.off .b{color:var(--dim)}
.notes{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:.88rem;line-height:1.5;color:var(--tx);white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in;background:var(--bg)}
/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb .x{position:fixed;top:16px;right:20px;font-size:2rem;color:#fff}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:38px 32px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login .box .logo{font-size:1.7rem;font-weight:800;margin-bottom:6px}
.login .box .sub{font-size:.85rem;color:var(--tx2);margin-bottom:24px;line-height:1.5}
.login input{width:100%;margin-bottom:10px;min-width:0}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.72rem;margin:16px 0;text-transform:uppercase;letter-spacing:.08em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:12px 20px;border-radius:12px;font-weight:700;font-size:.86rem;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.ok{background:var(--gn)}.toast.err{background:var(--rd)}.toast.info{background:var(--ac)}
@media(max-width:680px){ .wrap{padding:14px 14px 70px} .hd .sub{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="lb"></div>
<div id="toast"></div>

function renderByInvoice(list){
  var groups={}, keys=[];
  list.forEach(function(p){
    var k = (p.billed && p.invoice_doc_number) ? p.invoice_doc_number : '__none';
    if(!groups[k]){ groups[k]=[]; keys.push(k); }
    groups[k].push(p);
  });
  // Invoices first (numeric-desc), then "Not yet invoiced" last.
  keys.sort(function(a,b){
    if(a==='__none') return 1; if(b==='__none') return -1;
    var na=Number(a), nb=Number(b);
    if(!isNaN(na)&&!isNaN(nb)) return nb-na;
    return String(b).localeCompare(String(a));
  });
  var touched = Object.keys(expanded).length>0;
  var h='';
  keys.forEach(function(k, idx){
    var rows = groups[k];
    var isNone = k==='__none';
    var total = rows.reduce(function(s,p){ return s + Number(p.bill_amount||0); }, 0);
    var dates = rows.map(function(p){ return p.invoiced_at||p.pm_date; }).filter(Boolean).sort();
    var when = dates.length ? fmtDate((dates[dates.length-1]||'').slice(0,10)) : '';
    var pdf = ''; for(var i=0;i<rows.length;i++){ if(rows[i].invoice_pdf_path){ pdf = invoicePdfUrl(rows[i]); break; } }
    var open = expanded[k] || (!touched && idx===0);
    var title = isNone ? 'Not yet invoiced' : ('Invoice #'+esc(k));
    var gh = holdForInvoice(rows);
    var meta = rows.length+' visit'+(rows.length===1?'':'s') + (isNone?'':' · '+money(total)) + (when&&!isNone?' · '+when:'')
      + (gh.count ? ' · <span style="color:#8A4B00;font-weight:800">'+(isNone
          ? gh.count+' on hold'
          : money(gh.amount)+' on hold — not payable')+'</span>' : '');

    h += '<div class="inv">';
    h += '<div class="inv-h'+(open?' open':'')+'" onclick="toggleSection(\''+esc(String(k)).replace(/'/g,"\\'")+'\')">'
       + '<span class="chev">'+(open?'▾':'▸')+'</span>'
       + '<div class="inv-t"><div class="ttl">'+title+'</div><div class="sub">'+meta+'</div></div>'
       + (pdf ? '<a class="inv-pdf" href="'+esc(pdf)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+icon('file-text')+' Invoice PDF</a>' : (isNone?'':'<span class="inv-nopdf">PDF pending</span>'))
       + '</div>';
    if(open){ h += '<div class="grid" style="margin-top:10px">'; rows.forEach(function(p){ h += callCard(p); }); h += '</div>'; }
    h += '</div>';
  });
  return h;
}

// ── Asset-list reconciliation ───────────────────────────────────────────────
// Two directions, and both are gaps in the asset list Freshpet sends us, not
// problems with our reports:
//   FOUND   a cooler on site that is not on the list. The tech added it in the
//           field, did a full PM on it, and it is documented like any other.
//   MISSING a unit on the list that is not on site, or a store that has closed.
//           Filed as an exception visit with the reason, not as a completed PM.
// Each one is settled by FRESHPET, not by us — a found unit when it goes on
// their books (assets.reported), a missing one when it comes off (assets.active
// false, which their next export does). An asset row we cannot look up counts
// as unsettled: never silently close somebody's open item on a failed lookup.
function assetRow(p){ return assets[p.asset_id] || null; }
function foundAssets(){
  var out = [];
  Object.keys(assets).forEach(function(k){
    var a = assets[k];
    if(a.source !== 'field') return;
    // A unit our own admin has retired must not be presented to the customer as
    // "please add this to your list". The admin console only ever loads active
    // assets, so showing an inactive one here would put a row in front of
    // Freshpet that nobody on our side can even see to answer for.
    if(a.active === false) return;
    // Its own PM if it has had one; otherwise the report it was NOTED on —
    // several of these units were spotted while servicing the unit beside them
    // and have never been serviced themselves, which is a different fact and
    // the page says so rather than showing a blank.
    var own = null, found = null;
    for(var i=0;i<pms.length;i++){
      if(!own && pms[i].asset_id === a.id) own = pms[i];
      if(!found && a.found_on_pm_id && pms[i].id === a.found_on_pm_id) found = pms[i];
    }
    out.push({ kind:'found', asset:a, pm: own || found, serviced: !!own, noted: !own && !!found,
               settled: a.reported === true });
  });
  return out.sort(function(x,y){ return String(y.asset.added_at||'').localeCompare(String(x.asset.added_at||'')); });
}
function missingAssets(){
  return pms.filter(function(p){ return p.visit_type === 'exception'; })
    .map(function(p){ var a = assetRow(p); return { kind:'missing', pm:p, asset:a, settled: !!(a && a.active === false) }; })
    .sort(function(x,y){ return String(y.pm.pm_date||'').localeCompare(String(x.pm.pm_date||'')); });
}
function assetListOpenCount(){
  // The database's count is authoritative. The local one is a fallback for the
  // moment before the first load returns, not a second opinion.
  if(assetListStatus) return Number(assetListStatus.found_open||0) + Number(assetListStatus.missing_open||0);
  return foundAssets().filter(function(r){ return !r.settled; }).length
       + missingAssets().filter(function(r){ return !r.settled; }).length;
}
const EXC_LABEL = { store_closed:'Store closed', unit_missing:'Unit not on site' };

// ── Amounts in dispute ──────────────────────────────────────────────────────
// A HOLD IS NOT A CREDIT and the portal must not imply otherwise. The invoice
// still says what it said; the hold is our statement that we are not asking to
// be paid for those lines until the unit has been documented properly. Showing
// it here rather than in a letter is the point: the customer can see exactly
// which visits, on which invoice, and what it comes to.
function onHold(p){ return !!p.billing_hold_at && !p.billing_hold_outcome; }
function holdSummary(){
  var rows = pms.filter(onHold);
  var byInv = {}, amount = 0, units = {}, redone = 0;
  rows.forEach(function(p){
    units[p.serial || p.asset_id] = 1;
    if (p.revisit_done_at) redone++;
    if (p.billed && p.invoice_doc_number){
      var k = p.invoice_doc_number;
      if(!byInv[k]) byInv[k] = { invoice:k, reports:0, amount:0 };
      byInv[k].reports++; byInv[k].amount += Number(p.bill_amount||0);
      amount += Number(p.bill_amount||0);
    }
  });
  var uninvoiced = rows.filter(function(p){ return !p.billed; }).length;
  return { rows:rows, reports:rows.length, units:Object.keys(units).length,
           amount:amount, redone:redone,
           invoices:Object.keys(byInv).sort().map(function(k){ return byInv[k]; }),
           uninvoiced:uninvoiced,
           // Held lines that are actually ON an invoice. The other kind is held
           // the opposite way round — it has not gone out and will not — so
           // counting them together beside "Invoiced visits" would overstate
           // what is being disputed on a bill Freshpet is holding.
           invoicedHeld: rows.length - uninvoiced };
}
// What is on hold for one invoice group, so a total is never shown without the
// qualification sitting right next to it.
function holdForInvoice(rows){
  var held = rows.filter(onHold);
  return { count: held.length, amount: held.reduce(function(t,p){ return t + Number(p.bill_amount||0); }, 0) };
}

// Reusable completed-call card. One card per unit-cycle: a unit under audit
// carries its audit state HERE, in blue, rather than appearing twice in the
// list -- two cards for one service call is what made the pair unreadable.
function callCard(p){
  var a = assets[p.asset_id]||{};
  var nPhotos = Array.isArray(p.photo_paths)?p.photo_paths.length:0;
  var fd = p.form_data||{};
  var pair = auditPair(p);
  var held = onHold(p);
  var underAudit = pair.state !== 'none';
  // Once re-documented, the photograph count that matters is the audit's --
  // the original's were disconnected when the re-visit was ordered.
  if (pair.state === 'done' && Array.isArray(pair.audit.photo_paths)) nPhotos = pair.audit.photo_paths.length;

  return '<button class="call'+(underAudit?' audit':'')+(held?' hold':'')+'" onclick="openCall('+p.id+')">'
    + '<div class="st">'+esc(p.store||a.store||('Asset '+p.asset_id))+'</div>'
    + '<div class="ct">'+esc([p.city||a.city, a.state].filter(Boolean).join(', ')||'')+'</div>'
    + '<div class="meta">'
    + '<span class="pill gn">✓ Completed</span>'
    + (pair.state === 'pending'
        ? '<span class="pill rs">'+icon('camera')+' Under audit — no charge</span>' : '')
    + (pair.state === 'done'
        ? '<span class="pill rs">'+icon('camera')+' Re-documented '+esc(fmtDate(pair.audit.pm_date))+'</span>' : '')
    + (held?'<span class="pill hold">'+icon('alert')+' On hold — not payable</span>':'')
    + (p.billed?'<span class="pill iv">'+icon('receipt')+' Invoice #'+esc(p.invoice_doc_number||'—')+'</span>':'')
    + ((fd.legacy)?'<span class="pill dim">'+icon('archive')+' Legacy</span>':'')
    + (nPhotos?'<span class="pill ac">'+icon('camera')+' '+nPhotos+'</span>':'')
    + (p.pdf_path?'<span class="pill">'+icon('file-text')+' Report</span>':'')
    + (p.prev_comp?'<span class="pill dim">Prior</span>':'')
    + '</div>'
    + '<div class="dt">'+(p.signed_at?''+icon('clock')+' '+esc(fmtDateTime(p.signed_at)):esc(fmtDate(p.pm_date)))+' · S/N '+esc(p.serial||a.serial||'—')+'</div>'
    + '</button>';
}
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return d; } }
// Full date + time from a timestamptz (the moment the PM was signed/completed).
function fmtDateTime(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return String(iso); } }
function monthKey(d){ return (d||'').slice(0,7); }
function monthLabel(k){ if(!k) return 'Undated'; try{ return new Date(k+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}); }catch(e){ return k; } }

// ── auth ──
async function init(){
  sb.auth.onAuthStateChange(async function(ev, s){
    if (recovering) { if (s && s.user) user = s.user; return; }  // set-password flow drives itself
    if (ev==='SIGNED_IN' && s){ if (user && user.id===s.user.id) { user=s.user; return; } user=s.user; await afterLogin(); }
    else if (ev==='SIGNED_OUT'){ user=null; profile=null; screen='login'; render(); }
  });

  // Invite / password-reset emails land here as ?type=recovery&token_hash=….
  // The token is redeemed HERE (verifyOtp), never by a GET — so an email
  // scanner following the link can't burn it.
  var qp = null;
  try { qp = new URLSearchParams(window.location.search); } catch(e){}
  var tokenHash = qp && qp.get('token_hash');
  if (tokenHash && (qp.get('type')||'recovery')==='recovery'){
    recovering = true;
    screen='loading'; render();
    var v = await sb.auth.verifyOtp({ type:'recovery', token_hash: tokenHash });
    try { history.replaceState(null, '', window.location.pathname); } catch(e){}
    if (v.error){ recovering=false; screen='linkerr'; render(); return; }
    user = (v.data && (v.data.user || (v.data.session && v.data.session.user))) || user;
    screen='setpass'; render();
    return;
  }

  var { data:{ session } } = await sb.auth.getSession();
  if (session){ user = session.user; await afterLogin(); }
  else { screen='login'; render(); }
}

    sb.from('assets').select('id,store,address,city,state,zip,manufacturer,model,serial,source,no_serial,active,reported,reported_at,added_at,added_by,found_on_pm_id'),
    sb.from('reactive_batches').select('*').eq('status','invoiced').order('created_at', { ascending:false }),

}

function filtered(){

    // An audit visit shows INSIDE its original's card, not beside it.
    if (isMergedIntoOriginal(p)) return false;
    if (fCity && (p.city||(assets[p.asset_id]||{}).city||'')!==fCity) return false;
    if (fMonth && monthKey(p.pm_date)!==fMonth) return false;
    if (fInvoice==='__none' && p.billed) return false;
    if (fInvoice && fInvoice!=='__none' && String(p.invoice_doc_number||'')!==fInvoice) return false;
    if (fHold && !onHold(p)) return false;
    if (!q) return true;
    var a = assets[p.asset_id]||{};
    return ((p.store||'')+' '+(p.city||a.city||'')+' '+(p.serial||'')+' '+(a.address||'')+' '+(p.tech_name||'')).toLowerCase().indexOf(q)>=0;
  });
}
function setF(k,v){ if(k==='search')fSearch=v; if(k==='city')fCity=v; if(k==='month')fMonth=v; if(k==='invoice')fInvoice=v;
  // The hold view is a lens on everything, so it clears the other filters
  // rather than intersecting with whatever was set — "show me what is on hold"
  // returning nothing because a city was selected would read as "nothing is".
  if(k==='hold'){ fHold=v; if(v){ fInvoice=''; fCity=''; fMonth=''; fSearch=''; } }
  render(); if(k==='search'){ var el=document.getElementById('f_search'); if(el){ el.focus(); var n=el.value.length; el.setSelectionRange(n,n); } } }

  var calls = pms.filter(function(p){ return !isMergedIntoOriginal(p); });
  var mCount = calls.filter(function(p){ return monthKey(p.pm_date)===thisMonth; }).length;

      }).join('') + '</div>';
    }
    if (hs.uninvoiced){

     + '<div class="stat"><div class="v">'+mCount+'</div><div class="k">This month</div></div>'

     + '<div class="stat"><div class="v">'+invoicedCount+'</div><div class="k">Invoiced visits'

  var cities = {}; pms.forEach(function(p){ var c=p.city||(assets[p.asset_id]||{}).city; if(c) cities[c]=1; });

  var months = {}; pms.forEach(function(p){ var m=monthKey(p.pm_date); if(m) months[m]=1; });

  var invs = {}; pms.forEach(function(p){ if(p.billed && p.invoice_doc_number) invs[p.invoice_doc_number]=1; });
  var invOpts = '<option value="">All visits</option>'
    + Object.keys(invs).sort().map(function(iv){ return '<option value="'+esc(iv)+'"'+(iv===fInvoice?' selected':'')+'>Invoice #'+esc(iv)+'</option>'; }).join('')
    + '<option value="__none"'+(fInvoice==='__none'?' selected':'')+'>Not yet invoiced</option>';
  h += '<div class="filters">'
     + '<div class="fg" style="flex:1;min-width:200px"><label class="f">Search</label><input type="search" id="f_search" placeholder="Store, city, serial, tech…" value="'+esc(fSearch)+'" oninput="setF(\'search\',this.value)" style="width:100%"></div>'
     + '<div class="fg"><label class="f">Invoice</label><select onchange="setF(\'invoice\',this.value)">'+invOpts+'</select></div>'
     + '<div class="fg"><label class="f">City</label><select onchange="setF(\'city\',this.value)">'+cityOpts+'</select></div>'
     + '<div class="fg"><label class="f">Month</label><select onchange="setF(\'month\',this.value)">'+monthOpts+'</select></div>'
     + '<div class="fg"><label class="f">Group by</label><div class="seg">'
       + '<button class="'+(groupBy==='invoice'?'on':'')+'" onclick="setGroupBy(\'invoice\')">Invoice</button>'

       + '</div></div>'
     + '</div>';

  if (fHold){

       + icon('alert')+' Showing only the '+list.length+' visit'+(list.length===1?'':'s')+' on hold</span> '

  if(!list.length){ h += '<div class="empty">No completed calls match your filters.</div>'; }
  else if(groupBy==='invoice'){ h += renderByInvoice(list); }
  else { h += renderByMonth(list); }
  h += '</div>';
  app.innerHTML = h;
}

function assetRowCard(r, kindFallback){
  var a = r.asset || {}, p = r.pm;
  // The row knows its own direction. The "already reconciled" table mixes found
  // and missing units, and reading the direction off the table it happens to be
  // in rendered every settled missing unit as a found one.
  var kind = r.kind || kindFallback;
  // Scannable at a glance, the way the back-office tab is: one line per unit,
  // the store first, and every status as a short pill instead of a sentence.
  // The long explanation belongs in the section header, said once, not
  // repeated on all eight rows.
  var serial = a.no_serial
    ? '<span class="pill hold">NO SERIAL</span><div class="al-hint">plate not recorded</div>'
    : '<span class="mono">' + esc(a.serial || (p && p.serial) || '\u2014') + '</span>';
  var equip = esc([a.manufacturer, a.model].filter(Boolean).join(' ')) || '<span class="ct">\u2014</span>';
  var where = esc([a.city || (p && p.city), a.state].filter(Boolean).join(', '));

  var pills = kind === 'found'
    ? (r.settled
        ? '<span class="pill gn">On your list' + (a.reported_at ? ' \u00b7 ' + esc(fmtDate(String(a.reported_at).slice(0,10))) : '') + '</span>'
        : '<span class="pill hold">Not on your list</span>'
          + (r.noted ? '<span class="pill dim">Not serviced yet</span>' : ''))
    : (r.settled
        ? '<span class="pill gn">Removed from your list</span>'
        : '<span class="pill hold">' + esc(EXC_LABEL[p && p.exception_reason] || 'Not found on site') + '</span>');

  return '<tr' + (r.settled ? ' style="opacity:.55"' : '') + '>'
    + '<td><div class="al-store">' + esc(a.store || (p && p.store) || '\u2014') + '</div>'
      + (where ? '<div class="al-where">' + where + '</div>' : '') + '</td>'
    + '<td>' + equip + '</td>'
    + '<td>' + serial + '</td>'
    + '<td style="white-space:nowrap">' + (kind === 'found'
        ? esc(fmtDate(String(a.added_at || '').slice(0,10)))
        : esc(fmtDate(p && p.pm_date))) + '</td>'
    + '<td><div class="al-pills">' + pills + '</div></td>'
    + '<td style="white-space:nowrap">' + (p
        ? '<a href="#" onclick="openCall(' + p.id + ');return false">View report &rarr;</a>'
        : '<span class="ct">\u2014</span>') + '</td>'
    + '</tr>';
}

// One section: a plain header that says what the list is and what we are asking
// for, then the table. Deliberately NOT the invoice accordion — its sub-line is
// monospace, meant for invoice numbers, and prose set in it reads as machine
// output rather than a sentence addressed to a person.
function assetSection(title, ask, note, rows, kind, cols){
  return '<div class="al-h"><div class="ttl">' + title + '</div>'
    + '<div class="sub">' + rows.length + ' unit' + (rows.length === 1 ? '' : 's') + ' \u00b7 ' + ask
    + (note ? '<br>' + note : '') + '</div></div>'
    + '<div class="al-wrap"><table><thead><tr>'
    + cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '<th></th></tr></thead><tbody>'
    + rows.map(function(r){ return assetRowCard(r, kind); }).join('')
    + '</tbody></table></div>';
}

// ── Audits ──────────────────────────────────────────────────────────────────
// Everything about the review of our own work, in one place: the asset-list
// differences, and the incident record behind why the review is happening.
function renderAudits(){
  var openInc = incidents.filter(function(i){ return i.status !== 'closed'; }).length;
  var h = '<div class="seg" style="margin:0 0 16px">'
    + '<button class="'+(auditSub==='assets'?'on':'')+'" onclick="setAuditSub(\'assets\')">Asset list'
      + (assetListOpenCount()?' <span class="pill hold" style="margin-left:5px">'+assetListOpenCount()+'</span>':'')+'</button>'
    + '<button class="'+(auditSub==='incidents'?'on':'')+'" onclick="setAuditSub(\'incidents\')">Incident log'
      + (openInc?' <span class="pill hold" style="margin-left:5px">'+openInc+'</span>':'')+'</button>'
    + '</div>';
  return h + (auditSub==='incidents' ? renderIncidentLog() : renderAssetList());
}

var INC_STATE = {
  open:'Open', investigating:'Investigating', remediating:'Being fixed',
  monitoring:'Monitoring', paused:'Paused', closed:'Closed'
};
function renderIncidentLog(){
  if(!incidents.length){
    return '<div class="empty">No incidents to report. If something goes wrong with your service or your '
         + 'records, it is written up here \u2014 what happened, why, what we did about it, and what stops '
         + 'it happening again.</div>';
  }
  var h = '<div class="holdbar" style="border-color:#8FC4EA;background:#EAF3FB;color:#12405F">'
    + '<h4 style="color:#155E9B">'+icon('alert')+' INCIDENT LOG</h4>'
    + '<p>When something goes wrong with your service or your records we write it up: what happened, the '
    + 'root cause, who and what it affected, what we did about the damage, and what we changed so it does '
    + 'not happen again. You see it as we work it, not after the fact.</p></div>';

  incidents.forEach(function(i){
    var entries = incidentEntries.filter(function(e){ return e.incident_id === i.id; });
    var closed = i.status === 'closed';
    var open = openIncident === i.id;
    h += '<div class="inv"><div class="inv-h'+(open?' open':'')+'" onclick="toggleIncident('+i.id+')">'
      + '<span class="chev">'+(open?'\u25be':'\u25b8')+'</span>'
      + '<div class="inv-t"><div class="ttl">'+esc(i.title)+'</div>'
      + '<div class="sub">'+esc(i.ref||'')+' \u00b7 opened '+esc(fmtDate(String(i.opened_at||'').slice(0,10)))
      + (closed && i.closed_at ? ' \u00b7 closed '+esc(fmtDate(String(i.closed_at).slice(0,10))) : '')
      + (i.reports_affected!=null ? ' \u00b7 '+i.reports_affected+' reports affected' : '')
      + '</div></div>'
      + '<span class="pill '+(closed?'gn':'hold')+'">'+esc(INC_STATE[i.status]||i.status)+'</span>'
      + '</div>';
    if(open){
      h += '<div style="padding:16px 4px 4px">';
      [['What happened', i.summary],['Root cause', i.root_cause],['Impact', i.impact],
       ['What we did about it', i.corrective],['What stops it happening again', i.preventive]]
      .forEach(function(sec){
        if(!sec[1]) return;
        h += '<div class="sec-h">'+esc(sec[0])+'</div><div class="notes">'+esc(sec[1]).replace(/\n/g,'<br>')+'</div>';
      });
      if(entries.length){
        h += '<div class="sec-h">Updates</div>';
        entries.forEach(function(e){
          h += '<div class="notes" style="margin-bottom:8px">'
            + '<div class="ct" style="font-size:.74rem;margin-bottom:3px">'
            + esc(fmtDate(String(e.entry_at||'').slice(0,10)))+' \u00b7 '+esc(e.kind)+'</div>'
            + esc(e.body).replace(/\n/g,'<br>')+'</div>';
        });
      }
      h += '</div>';
    }
    h += '</div>';
  });
  return h;
}

function renderAssetList(){
  var found = foundAssets(), missing = missingAssets();
  var fOpen = found.filter(function(r){ return !r.settled; });
  var mOpen = missing.filter(function(r){ return !r.settled; });
  var settledRows = found.filter(function(r){ return r.settled; })
    .concat(missing.filter(function(r){ return r.settled; }));

  if(!found.length && !missing.length){
    return '<div class="empty">Nothing to reconcile \u2014 every cooler we have serviced is on your asset list, '
         + 'and we have found every unit the list says is out there.</div>';
  }

  var h = '<div class="holdbar" style="border-color:#8FC4EA;background:#EAF3FB;color:#12405F">'
     + '<h4 style="color:#155E9B">' + icon('alert') + ' ASSET LIST \u2014 ' + (fOpen.length + mOpen.length) + ' TO RECONCILE</h4>'
     + '<p>Differences between the asset list you send us and what our technicians found in the field. '
     + 'They are not problems with the service \u2014 every unit below was visited and documented, and every '
     + 'row links to that report. Each line clears from this page once your list is updated.</p></div>';

  h += '<div class="stats">'
     + '<div class="stat"><div class="v">' + fOpen.length + '</div><div class="k">Found, not on your list</div></div>'
     + '<div class="stat"><div class="v">' + mOpen.length + '</div><div class="k">On your list, not on site</div></div>'
     + '<div class="stat"><div class="v">' + settledRows.length + '</div><div class="k">Already reconciled</div></div>'
     + '</div>';

  if(fOpen.length){
    var noPlate = fOpen.filter(function(x){ return x.noted; }).length;
    h += assetSection('Coolers we found that are not on your list',
      '<strong>please add them to your asset list</strong>',
      noPlate ? noPlate + ' of these are marked <strong>Not serviced yet</strong>: the technician spotted them while '
              + 'servicing the unit beside them and could not record a serial plate, so they need a visit before '
              + 'they can be identified.' : '',
      fOpen, 'found', ['Store', 'Equipment', 'Serial', 'Found', 'Status']);
  }

  if(mOpen.length){
    h += assetSection('On your list, but not on site',
      '<strong>please remove or relocate them</strong>',
      'The technician made the trip and documented what they found.',
      mOpen, 'missing', ['Store', 'Equipment', 'Serial', 'Visited', 'What we found']);
  }

  if(!fOpen.length && !mOpen.length){
    h += '<div class="empty">Nothing outstanding \u2014 every difference we raised has been reconciled.</div>';
  }

  // Settled lines are kept, not dropped: "you already told us about this one"
  // is a question that gets asked, and it needs an answer.
  if(settledRows.length){
    h += '<button class="btn o" style="margin-top:4px" onclick="toggleSettledAssets()">'
      + (showSettledAssets ? 'Hide' : 'Show') + ' ' + settledRows.length + ' already reconciled</button>';
    if(showSettledAssets){
      h += '<div style="margin-top:12px">'
        + assetSection('Already reconciled', 'no action needed', '', settledRows, 'found',
            ['Store', 'Equipment', 'Serial', 'Date', 'Status'])
        + '</div>';
    }
  }
  return h;
}

// ── detail modal ──
// ── One unit, one card, both visits ─────────────────────────────────────────
//
// A unit under audit produced TWO reports: the original visit, and the audit
// visit that re-documents it. Showing them as two cards asks the reader to work
// out from two dates whether the store was serviced twice -- which is exactly
// the confusion this whole programme exists to clear up. So they are ONE card:
// the audit is the current documentation, and the original is folded away
// behind a pulldown that names its own date. Nothing is hidden and nothing is
// overwritten; the original is a record and stays reachable forever.
function auditPair(p){
  if(!p) return null;
  // Opening either half lands on the same merged card.
  var original = p, audit = null;
  if ((p.visit_type === 'reshoot' || p.visit_type === 'exception') && p.revisit_of != null){
    var parent = pms.find(function(x){ return x.id === p.revisit_of; });
    if (parent) { original = parent; audit = p; }
  }
  if (!audit && original.revisit_done_pm_id){
    audit = pms.find(function(x){ return x.id === original.revisit_done_pm_id; }) || null;
  }
  var state = audit ? 'done' : (original.revisit_requested_at ? 'pending' : 'none');
  return { original: original, audit: audit, state: state,
           // The audit visit can itself be an exception -- we went back and the
           // store was closed. That is a different answer from "re-documented"
           // and must not be dressed up as one.
           auditIsException: !!(audit && audit.visit_type === 'exception') };
}
// A re-shoot that is merged into its original must not also stand alone in the
// list. If the original is not loaded, it stands alone rather than vanishing.
function isMergedIntoOriginal(p){
  if (p.visit_type !== 'reshoot' && p.visit_type !== 'exception') return false;
  if (p.revisit_of == null) return false;
  return pms.some(function(x){ return x.id === p.revisit_of; });
}

// Everything that is true of ONE visit: facts, GPS, checklist, readings,
// comments, photos, the signed report. Rendered identically whichever visit it
// is, so the two halves of a card cannot drift in what they show.
function visitBody(p){
  if(!p) return '';
  var a = assets[p.asset_id] || {};
  var fd = p.form_data || {};
  var h = '<div class="kv">'
     + kv('Service date', fmtDate(p.pm_date))
     + (p.signed_at?kv('Completed', fmtDateTime(p.signed_at)):'')
     + kv('Equipment', [a.manufacturer,a.model].filter(Boolean).join(' ')||'\u2014')
     + kv('Serial #', p.serial||a.serial||'\u2014')
     + kv('Technician', p.tech_name||'\u2014')
     + kv('Company', p.service_company||'\u2014')
     + (fd.intTemp?kv('Interior temp', fd.intTemp):'')
     + (p.billed?kv('Invoice #', p.invoice_doc_number||'\u2014'):'')
     + (p.billed&&p.invoiced_at?kv('Invoiced', fmtDate((p.invoiced_at||'').slice(0,10))):'')
     + '</div>';

  if (p.gps_lat!=null && p.gps_lng!=null){
    var gLat=Number(p.gps_lat), gLng=Number(p.gps_lng);
    if(!isNaN(gLat)&&!isNaN(gLng)){
      var acc = p.gps_accuracy!=null ? ' (\u00b1'+Math.round(Number(p.gps_accuracy))+' m)' : '';
      h += '<div class="notes" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
         + '<span>'+icon('map-pin')+' <strong>Signed at</strong> '+esc(gLat.toFixed(5))+', '+esc(gLng.toFixed(5))+esc(acc)+'</span>'
         + '<a class="btn sm" href="https://maps.google.com/?q='+gLat+','+gLng+'" target="_blank" rel="noopener" style="margin-left:auto">'+icon('map')+' View on map</a>'
         + '</div>';
    }
  }

  if (fd.legacy){
    var link = fd.legacy_link || '';
    h += '<div class="notes" style="border-color:var(--am);background:rgba(207,138,23,.10)">'
       + '<div style="font-weight:700;color:var(--am);margin-bottom:6px">'+icon('archive')+' Completed on the previous system</div>'
       + esc(fd.legacy_note || 'This visit was completed and paid on the previous system. The backup paperwork \u2014 photos and the signed service form \u2014 lives on the legacy system, so it is not attached here.')
       + (link ? '<div style="margin-top:12px"><a class="btn" href="'+esc(link)+'" target="_blank" rel="noopener">'+icon('folder')+' View photos &amp; paperwork (legacy)</a></div>' : '')
       + '</div>';
  } else if (p.prev_comp){
    h += '<div class="notes" style="color:var(--tx2)">This visit was recorded as previously completed \u2014 no on-site checklist or report was captured.</div>';
  } else {
    var anyChecklist = CHECK_GROUPS.some(function(g){ return g.keys.some(function(kk){ return fd[kk[0]]; }); });
    if (anyChecklist){
      CHECK_GROUPS.forEach(function(g){
        var done = g.keys.filter(function(kk){ return fd[kk[0]]; });
        if(!done.length) return;
        h += '<div class="sec-h">'+esc(g.h)+'</div><div class="chks">';
        g.keys.forEach(function(kk){
          if(!fd[kk[0]]) return;
          var label = kk[1];
          if(kk[0]==='otherLoc' && fd.otherLocText) label += ' \u2014 '+fd.otherLocText;
          h += '<div class="chk"><span class="b">\u2713</span>'+esc(label)+'</div>';
        });
        h += '</div>';
      });
    }
    if (fd.sp1 || fd.voltage){
      h += '<div class="sec-h">Readings</div><div class="kv">'
         + (fd.sp1?kv('Set point 1', fd.sp1):'')
         + (fd.voltage?kv('Voltage', fd.voltage):'')
         + '</div>';
    }
    if (fd.comments){
      h += '<div class="sec-h">Comments</div><div class="notes">'+esc(fd.comments)+'</div>';
    }
  }

  if (Array.isArray(p.photo_paths) && p.photo_paths.length){
    h += '<div class="sec-h">Photos ('+p.photo_paths.length+')</div><div class="photos">';
    p.photo_paths.forEach(function(pp){
      var u = photoUrl(pp);
      h += '<img src="'+esc(u)+'" loading="lazy" onclick="openLb(\''+esc(u).replace(/'/g,"\\'")+'\')">';
    });
    h += '</div>';
  } else if (!p.prev_comp && !fd.legacy) {
    h += '<div class="notes" style="color:var(--tx2)">No photographs are attached to this visit.</div>';
  }

  if (p.pdf_path){
    h += '<div style="margin-top:20px"><a class="btn" href="'+esc(pdfUrl(p.pdf_path))+'" target="_blank" rel="noopener">'+icon('file-text')+' View signed report (PDF)</a></div>';
  }
  return h;
}

function openCall(id){
  var clicked = pms.find(function(x){ return x.id===id; });
  if(!clicked) return;
  var pair = auditPair(clicked);
  var p = pair.original;                      // the anchor: the visit that was billed
  var a = assets[p.asset_id]||{};
  var m = document.getElementById('modal');

  var h = '<div class="ov" onclick="if(event.target===this)closeCall()"><div class="modal">';
  h += '<div class="mh"><div><h2>'+esc(p.store||a.store||('Asset '+p.asset_id))+'</h2>'
     + '<div class="addr">'+esc([a.address, p.city||a.city, a.state, a.zip].filter(Boolean).join(', '))+'</div></div>'
     + '<button class="x" onclick="closeCall()" aria-label="Close">\u2715</button></div>';
  h += '<div class="mb">';

  // Billing first: it is the thing that changes what the reader owes. It always
  // belongs to the ORIGINAL visit -- an audit is never charged.
  if (onHold(p)) {
    h += '<div class="notes" style="border:1px solid #E8B368;border-left-width:5px;background:#FDF1DF;color:#5E3400">'
       + '<div style="font-weight:800;color:#8A4B00;margin-bottom:6px">'+icon('alert')+' ON HOLD \u2014 NOT PAYABLE</div>'
       + (p.billed
          ? 'This visit is on invoice #' + esc(p.invoice_doc_number||'\u2014')
            + (Number(p.bill_amount) ? ' at ' + money(Number(p.bill_amount)) : '')
            + ', and we have put that line on hold. Please do not pay it.'
          : 'This visit has not been invoiced, and will not be until it is re-documented.')
       + ' ' + esc(p.billing_hold_reason || 'Held pending re-documentation.')
       + (p.revisit_done_at
          ? ' <strong>It has now been re-documented</strong> and the hold is with us to close \u2014 we will either release the line or credit it.'
          : ' The stop is scheduled to be serviced and photographed again at no charge to you.')
       + '</div>';
  } else if (p.billing_hold_outcome === 'credited') {
    h += '<div class="notes" style="border-left:4px solid #2E7D53">'
       + '<strong style="color:#2E7D53">CREDITED</strong> \u2014 we did not stand behind our documentation of this '
       + 'visit, so it was credited'
       + (Number(p.credit_amount) ? ' at ' + money(Number(p.credit_amount)) : '')
       + (p.billing_hold_closed_at ? ' on ' + esc(fmtDate((p.billing_hold_closed_at||'').slice(0,10))) : '')
       + '. It is not payable.</div>';
  } else if (p.billing_hold_outcome === 'released') {
    h += '<div class="notes" style="border-left:4px solid #8FC4EA">'
       + '<strong style="color:#155E9B">HOLD RELEASED</strong> \u2014 this unit was documented again and the '
       + 'charge stands'
       + (p.billing_hold_closed_at ? ', released on ' + esc(fmtDate((p.billing_hold_closed_at||'').slice(0,10))) : '')
       + '.</div>';
  }

  // The audit banner, in the same blue as the form the technician fills in on
  // the re-visit and the report it prints.
  if (pair.state !== 'none'){
    h += '<div class="auditbar">'
       + '<div class="t">'+icon('camera')+' SECONDARY VISIT AUDIT</div>'
       + '<p>This unit was serviced on <strong>'+esc(fmtDate(p.pm_date))+'</strong>. '
       + 'Our photographic documentation of that visit could not be verified, so it is being '
       + 'documented again at <strong>no charge to you</strong>.</p>';
    if (pair.state === 'pending'){
      h += '<p>The audit visit has <strong>not happened yet</strong>. What you see below is the '
         + 'original visit\u2019s information, and it will be replaced here once the unit has been '
         + 'photographed again.</p>';
    } else if (pair.auditIsException){
      h += '<p>We went back on <strong>'+esc(fmtDate(pair.audit.pm_date))+'</strong> and could not '
         + 'complete the audit: <strong>'+esc(EXC_LABEL[pair.audit.exception_reason] || 'the unit was not available')
         + '</strong>. That visit is shown below; the original is under it.</p>';
    } else {
      h += '<p><strong>Re-documented on '+esc(fmtDate(pair.audit.pm_date))+'.</strong> '
         + 'The audit visit below is the current documentation for this unit. The original visit is '
         + 'kept in full underneath \u2014 nothing has been overwritten.</p>';
    }
    h += '</div>';
  }

  if (pair.state === 'done'){
    h += '<div class="vh audit">'+(pair.auditIsException ? 'AUDIT VISIT (not completed)' : 'AUDIT VISIT')
       + ' \u00b7 ' + esc(fmtDate(pair.audit.pm_date)) + '</div>';
    h += visitBody(pair.audit);
    // The original goes under a pulldown, labelled with its own date, so it is
    // one click away and never mistaken for the current record.
    h += '<details class="origwrap"><summary>ORIGINAL VISIT \u00b7 '
       + esc(fmtDate(p.pm_date))
       + '<span class="hint">the documentation the audit replaces \u2014 kept on file</span></summary>'
       + '<div class="origbody">' + visitBody(p) + '</div></details>';
  } else {
    if (pair.state === 'pending'){
      h += '<div class="vh audit">ORIGINAL VISIT \u00b7 '+esc(fmtDate(p.pm_date))
         + ' <span class="tag">being re-documented</span></div>';
    }
    h += visitBody(p);
  }

  h += '</div></div></div>';
  m.innerHTML = h;
  document.body.style.overflow='hidden';
}
function closeCall(){ document.getElementById('modal').innerHTML=''; document.body.style.overflow=''; }
function kv(k,v){ return '<div class="i"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }

// ── lightbox ──
function openLb(u){ document.getElementById('lb').innerHTML='<div class="lb" onclick="closeLb()"><span class="x">✕</span><img src="'+esc(u)+'"></div>'; }
function closeLb(){ document.getElementById('lb').innerHTML=''; }

init();
</script>
</body>
</html>
