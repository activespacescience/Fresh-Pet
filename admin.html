<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>Freshpet · Admin Console</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Excel (.xls/.xlsx) parsing for the asset uploads. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Pre-paint: follow the shared APBG theme (same origin as the gateway). -->
<script>
  (function(){ try { var t = localStorage.getItem('apbg_theme')==='light'?'light':'dark'; document.documentElement.setAttribute('data-apbg-theme', t); } catch(e){} })();
</script>
<!-- APBG cross-app waffle launcher + shared light/dark toggle. -->
<script src="https://alamedapointbg.com/appswitcher.js" defer></script>
<style>
/* Freshpet color system — light only. Warm cream canvas, Freshpet orange
   primary, fresh green for success. Intentionally does NOT follow the shared
   APBG dark toggle: nothing keys off [data-apbg-theme], so the site stays
   light regardless of the gateway theme switch. */
:root{
  --bg:#FFF8F0; --sf:#FFFFFF; --sf2:#F6EEE3; --bd:#EEE0CF; --bd2:#DCC8AC;
  --line:rgba(42,37,33,.07);
  --tx:#2A2521; --tx2:#786B5E; --dim:#8A7A66;
  --ac:#E56A15; --ac2:#C85A0E; --gn:#2FA24C; --am:#CF8A17; --rd:#DB4A44; --pu:#7C3ABE; --pu2:#66309E;
  --shadow:0 1px 2px rgba(42,37,33,.04),0 4px 16px rgba(191,120,58,.08);
  --font:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Inline SVG icons (Lucide-style) — inherit color + font-size, replace emoji */
.ic-svg{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none;stroke-width:2}
.logo .ic-svg{width:1.15em;height:1.15em;vertical-align:-.18em;color:var(--ac)}
.tab .ic-svg,.seg button .ic-svg{margin-right:5px}
/* Accessibility: visible keyboard focus + honor reduced-motion */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media (max-width:680px){.btn.sm{min-height:40px}.ic{width:40px;height:40px}}
a{color:var(--ac);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
/* Header */
.hd{display:flex;align-items:center;gap:14px;padding:16px 0 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.hd .logo{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.hd .logo .fp{color:var(--ac)}
.hd .sub{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{font-size:.78rem;color:var(--tx2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:.84rem;font-weight:600;background:var(--ac);color:#fff;transition:filter .15s,background .15s,border-color .15s}
.btn:hover{filter:brightness(1.06)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.o:hover{border-color:var(--bd2);background:var(--sf2)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn.gn{background:var(--gn)}.btn.rd{background:var(--rd)}
.btn.pu{background:var(--pu)}.btn.pu:hover{background:var(--pu2)}
.pill.pu{color:var(--pu);border-color:var(--pu);background:rgba(124,58,190,.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Tabs — clean underline nav (shared look with the portal) */
.tabs{display:flex;gap:2px;margin:18px 0 22px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.tab{padding:10px 15px;font-size:.88rem;font-weight:500;color:var(--tx2);background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.tab:hover{color:var(--tx)}
/* Cards / layout */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.card h3{font-size:1.02rem;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.card .hint{font-size:.8rem;color:var(--tx2);margin-bottom:16px;line-height:1.55;max-width:74ch}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
label.f{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin:0 0 5px}
select,input[type=text],input[type=number],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:.88rem;outline:none}
select:focus,input:focus{border-color:var(--ac)}
.muted{color:var(--tx2);font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--bd)}
.pill.gn{color:var(--gn);border-color:var(--gn);background:rgba(47,162,76,.12)}
.pill.am{color:var(--am);border-color:var(--am);background:rgba(207,138,23,.13)}
.pill.dim{color:var(--tx2)}
/* Route list */
.stop{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);margin-bottom:8px}
.stop .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.stop .meta{flex:1;min-width:0}
.stop .meta .s{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .meta .a{font-size:.76rem;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .acts{display:flex;gap:4px;flex:none}
.ic{width:30px;height:30px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ic:hover{border-color:var(--bd2)}
.ic:disabled{opacity:.35}
.addrow{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--bg)}
.addrow .meta{flex:1;min-width:0}
.addlist{max-height:340px;overflow-y:auto;margin-top:8px;padding-right:4px}
.grp-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:12px 0 6px}
/* Table — airy rows, light rules, hover highlight */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.87rem}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sf2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr.tot td{border-top:2px solid var(--bd);font-weight:700;border-bottom:none}
.empty{padding:34px 16px;text-align:center;color:var(--tx2);font-size:.9rem}
/* Overview tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px}
.tile{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.tile .lb{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--tx2)}
.tile .v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .v.gn{color:var(--gn)}.tile .v.am{color:var(--am)}.tile .v.ac{color:var(--ac)}
.tile .sub{font-size:.72rem;color:var(--tx2);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{padding:7px 13px;font-size:.8rem;font-weight:700;color:var(--tx2);background:transparent}
.seg button.on{background:var(--ac);color:#fff}
.bar{height:7px;border-radius:999px;background:var(--sf2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--gn);border-radius:999px}
.pill.rd{color:var(--rd);border-color:var(--rd);background:rgba(219,74,68,.11)}
.pill.ac{color:var(--ac);border-color:var(--ac);background:rgba(229,106,21,.12)}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:38px 32px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login .box .logo{font-size:1.6rem;font-weight:800;margin-bottom:6px}
.login .box .sub{font-size:.82rem;color:var(--tx2);margin-bottom:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:12px 20px;border-radius:12px;font-weight:700;font-size:.86rem;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
.toast.ok{background:var(--gn)}.toast.err{background:var(--rd)}.toast.info{background:var(--ac)}
@media(max-width:680px){ .wrap{padding:14px 14px 60px} .hd .sub{display:none} th.hide,td.hide{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>

// Freshpet — Admin Console (back office)
// A second GUI over the SAME Supabase project the handheld field app uses

function money(n){ return '$' + Number(n||0).toFixed(2); }

// ── Routes ──
function selectRouteTech(email){
  routeTech = email; addSearch=''; routeStops=[]; addSel={};
  if (email){
    assignments.filter(function(a){ return a.tech_email===email; })
      .sort(function(a,b){ return (a.stop_order||0)-(b.stop_order||0); })
      .forEach(function(a){ var as=assetById(a.asset_id); if(as) routeStops.push({ asset_id:a.asset_id, asset:as }); });
  }
  render();
}
// A serviced stop is COMPLETED and locked — it can't be moved or removed.
// A stop is locked only while it is genuinely finished. A unit carrying an open
// re-visit is back in play — the tech has to service it again — so the stop must
// stay movable and removable. Matches isCompleted() in the field app.
function stopCompleted(id){
  var mine = completedPMs.filter(function(p){ return !p.prev_comp && p.asset_id===id; });
  if(!mine.length) return false;
  return !mine.some(function(p){ return p.revisit_requested_at && !p.revisit_done_at; });
}
function moveStop(i, dir){ var j=i+dir; if(j<0||j>=routeStops.length) return; if(stopCompleted(routeStops[i].asset_id)||stopCompleted(routeStops[j].asset_id)){ toast('Completed stops are locked','info'); return; } var t=routeStops[i]; routeStops[i]=routeStops[j]; routeStops[j]=t; render(); }
function removeStop(i){ if(stopCompleted(routeStops[i].asset_id)){ toast('Completed stops are locked — can\'t remove','info'); return; } routeStops.splice(i,1); render(); }
function addStop(id){ if(routeStops.some(function(s){return s.asset_id===id;})) return; if(assetLockedElsewhere(id)){ toast('That store is on another tech\'s route','err'); return; } var as=assetById(id); if(as){ routeStops.push({asset_id:id, asset:as}); render(); } }
// An asset is claimable by the current tech only if no OTHER tech holds it.
function assetLockedElsewhere(id){
  var owner = assignments.find(function(x){ return x.asset_id===id; });
  return owner && owner.tech_email !== routeTech;
}
function toggleAddSel(id){
  if(assetLockedElsewhere(id)){ toast('That store is on another tech\'s route','err'); return; }
  if(addSel[id]) delete addSel[id]; else addSel[id]=true; render();
}
function toggleAddSelAll(){
  var q = addSearch.trim().toLowerCase();
  var avail = assets.filter(function(a){
    if(routeStops.some(function(s){return s.asset_id===a.id;})) return false;
    if(assetLockedElsewhere(a.id)) return false;   // locked to another tech
    if(!q) return true;
    return ((a.store||'')+' '+(a.city||'')+' '+(a.address||'')+' '+(a.serial||'')).toLowerCase().indexOf(q)>=0;
  });
  var allSel = avail.length>0 && avail.every(function(a){ return addSel[a.id]; });
  avail.forEach(function(a){ if(allSel) delete addSel[a.id]; else addSel[a.id]=true; });
  render();
}
function addSelectedStops(){
  var ids = Object.keys(addSel).filter(function(k){ return addSel[k]; }).map(Number);
  var added = 0, skipped = 0;
  ids.forEach(function(id){
    if(routeStops.some(function(s){return s.asset_id===id;})) return;   // already in list
    if(assetLockedElsewhere(id)){ skipped++; return; }                  // another tech owns it
    var as=assetById(id); if(as){ routeStops.push({asset_id:id, asset:as}); added++; }
  });
  addSel = {};
  toast(added+' stop(s) added'+(skipped?', '+skipped+' skipped (on another tech)':'')+' — Save route to apply', skipped?'info':'ok');
  render();
}
async function saveRoute(){
  if(!routeTech) return;
  // Defensive: drop any stop that a DIFFERENT tech already owns (a store is
  // one-tech-only; the DB enforces this too, but fail clearly, not on insert).
  var conflicts = routeStops.filter(function(s){ return assetLockedElsewhere(s.asset_id); });
  if(conflicts.length){
    routeStops = routeStops.filter(function(s){ return !assetLockedElsewhere(s.asset_id); });
    toast(conflicts.length+' store(s) removed — already on another tech\'s route','err');
    render();
    return;
  }
  // Guard against duplicate asset_ids in the working list.
  var seen = {}; routeStops = routeStops.filter(function(s){ if(seen[s.asset_id]) return false; seen[s.asset_id]=true; return true; });
  saving=true; render();
  // Rebuild the tech's route as one ordered set (same pattern the field app uses).
  var del = await sb.from('route_assignments').delete().eq('tech_email', routeTech);
  if(del.error){ saving=false; render(); return toast('Save failed: '+del.error.message,'err'); }
  if(routeStops.length){
    var rows = routeStops.map(function(s, i){ return { tech_email:routeTech, asset_id:s.asset_id, stop_order:i, route_name:'Primary Route', active:true }; });
    var ins = await sb.from('route_assignments').insert(rows);
    if(ins.error){ saving=false; render(); return toast(ins.error.code==='23505'?'Save failed: a store is already on another tech\'s route':'Save failed: '+ins.error.message,'err'); }
  }
  await loadAll(); saving=false; toast('Route saved for '+techName(routeTech),'ok'); render();
}

// ═══ Overview (company-wide + per-contractor) ═══
// Stops: "completed" / "remaining" are scoped to the selected period. Pay:
// "paid out" / "owed" are cumulative — they reflect the full completed_pms
// ledger, not a single period. Everything is attributed to the ROUTE OWNER of
// each asset (not the login that recorded the PM): some contractors (e.g. Bill
// Pace) have no field login of their own, so their stops are logged under
// another account — but the work, completion and pay are still theirs.
// Techs are paid a flat rate per completed PM; when a paid row has no stored
// payout_amount and the tech has no per-PM rate, fall back to DEFAULT_PM_RATE.
var DEFAULT_PM_RATE = 30;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function isoDate(d){ var p=function(n){ return (n<10?'0':'')+n; }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtDate(iso){ if(!iso) return ''; var p=String(iso).slice(0,10).split('-'); return MONTHS[(+p[1])-1]+' '+(+p[2]); }
function periodBoundsOf(which){
  if(which==='all') return { start:null, end:null, label:'All time' };
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(which==='prev'){ m-=1; if(m<0){ m=11; y-=1; } }
  var start=new Date(y,m,1), end=new Date(y,m+1,0);
  return { start:isoDate(start), end:isoDate(end), label:MONTHS[m]+' '+y };
}
function periodBounds(){ return periodBoundsOf(ovPeriod); }
function inPeriod(dateStr, b){ if(!b.start) return true; if(!dateStr) return false; var d=String(dateStr).slice(0,10); return d>=b.start && d<=b.end; }

function computeOverview(){
  var b = periodBounds();
  var rateByEmail={}, hasLoginByEmail={};
  techs.forEach(function(t){ rateByEmail[t.email]=t.pm_rate!=null?Number(t.pm_rate):null; hasLoginByEmail[t.email]=!!t.user_id; });
  var rateFor=function(email){ return (email && rateByEmail[email]!=null) ? rateByEmail[email] : DEFAULT_PM_RATE; };
  // owner (active route) of each asset — the attribution key for everything below
  var ownerOf={}; assignments.forEach(function(a){ ownerOf[a.asset_id]=a.tech_email; });
  // assets serviced within the period (exclude PREV COMP — done elsewhere)
  var doneInPeriod={};
  completedPMs.forEach(function(p){ if(p.prev_comp) return; if(!inPeriod(p.pm_date,b)) return; if(p.asset_id!=null) doneInPeriod[p.asset_id]=true; });

  var rows={};
  function bucket(email){ return rows[email]||(rows[email]={email:email, assigned:0, completed:0, paidOut:0, paidPMs:0, unpaid:0, rate:rateByEmail[email]!=null?rateByEmail[email]:null}); }
  // stops: attribute to the route owner so remaining = assigned − completed is always coherent
  assignments.forEach(function(a){ var t=bucket(a.tech_email); t.assigned++; if(doneInPeriod[a.asset_id]) t.completed++; });

  // pay & owed: attribute each completed PM to its asset's ROUTE OWNER (not the
  // login that recorded it). Paid value = stored payout_amount, else the tech's
  // rate, else DEFAULT_PM_RATE. Cumulative (not period-scoped).
  var offRoutePaid=0, offRouteUnpaid=0;
  completedPMs.forEach(function(p){
    if(p.prev_comp) return;
    var owner = p.asset_id!=null ? ownerOf[p.asset_id] : null;
    var val = p.payout_amount!=null ? Number(p.payout_amount) : rateFor(owner);
    if(p.paid_out){
      if(owner){ var t=bucket(owner); t.paidOut+=val; t.paidPMs++; }
      else offRoutePaid+=val;
    } else {
      if(owner) bucket(owner).unpaid++;
      else offRouteUnpaid++;
    }
  });

  var list=Object.keys(rows).map(function(e){
    var r=rows[e]; r.name=techName(e); r.remaining=Math.max(0,r.assigned-r.completed);
    r.owed = r.unpaid * (r.rate!=null?r.rate:DEFAULT_PM_RATE);
    r.noLogin = hasLoginByEmail[e]===false && r.assigned>0; // owns a route but has no field login (PMs logged elsewhere)
    return r;
  }).sort(function(a,b){ return b.assigned-a.assigned || (b.paidOut-a.paidOut); });

  // company totals (assigned/completed/remaining = route stops; pay incl. off-route)
  var assignedAssets=Object.keys(ownerOf).length;
  var completedAssigned=0; Object.keys(ownerOf).forEach(function(id){ if(doneInPeriod[id]) completedAssigned++; });
  var offRoute=0; Object.keys(doneInPeriod).forEach(function(id){ if(!ownerOf[id]) offRoute++; });
  var contribPaid=0, contribOwed=0, contribUnpaid=0;
  list.forEach(function(r){ contribPaid+=r.paidOut; contribOwed+=r.owed; contribUnpaid+=r.unpaid; });

  return { b:b, list:list, offRoutePaid:offRoutePaid, offRouteUnpaid:offRouteUnpaid, contribPaid:contribPaid, contribOwed:contribOwed, company:{
    assigned:assignedAssets, completed:completedAssigned, remaining:Math.max(0,assignedAssets-completedAssigned),
    offRoute:offRoute,
    paidOut:contribPaid+offRoutePaid,
    owed:contribOwed+offRouteUnpaid*DEFAULT_PM_RATE,
    unpaid:contribUnpaid+offRouteUnpaid,
    activeAssets:assets.length, unassigned:Math.max(0,assets.length-assignedAssets)
  }};
}

// ═══ Re-shoot programme banner ═══
// An ordered re-visit is real work owed to a customer, on a stop that is
// already invoiced. Before this it showed only as +1 on a generic "Report
// Issues" badge that also counts added assets and service tickets — which is
// how 191 open stops look identical to a quiet week. It gets its own banner,
// on the landing tab and on the audit tab, and it does not go away by itself.
function revisitStats(){
  var open = completedPMs.filter(function(p){ return p.revisit_requested_at && !p.revisit_done_at; });
  var done = completedPMs.filter(function(p){ return p.revisit_requested_at && p.revisit_done_at; });
  var units = {}; open.forEach(function(p){ units[p.serial] = 1; });
  var stores = {}; open.forEach(function(p){ stores[p.store] = 1; });
  var oldest = open.reduce(function(a,p){
    return (!a || String(p.revisit_requested_at) < a) ? String(p.revisit_requested_at) : a; }, null);
  return { open: open.length, done: done.length,
           units: Object.keys(units).length, stores: Object.keys(stores).length,
           oldest: oldest, total: open.length + done.length };
}
// ── When a field-found asset stops being an open item ───────────────────────
// An added asset is not "an issue with the report" — the report is fine. It is
// a gap in FRESHPET'S asset list, and the thing that closes it is Freshpet
// putting the unit on their books. That is exactly what Mark reported records,
// so the PM drops off the issues board the moment the asset is marked reported
// and not before. Until this, an added asset sat on the board forever with no
// action that could ever clear it.
//
// An asset row we cannot find is treated as NOT reported: a missing lookup must
// never silently close somebody's open item.
function assetById(id){
  if(!Array.isArray(assets)) return null;
  for(var i=0;i<assets.length;i++){ if(assets[i].id===id) return assets[i]; }
  return null;
}
function addedAssetSettled(p){
  if(!p.added_asset) return true;
  var a = assetById(p.asset_id);
  return !!(a && a.reported === true);
}
function addedAssetOpen(p){ return !!p.added_asset && !addedAssetSettled(p); }

// ── Amounts on hold ─────────────────────────────────────────────────────────
// A hold says "we are not asking to be paid for this line yet". It deliberately
// does NOT touch billed / bill_amount / invoice_doc_number — rewriting an
// invoice we already sent in our own database is not a correction, it is losing
// the record of what we charged. Two exits, both recorded: RELEASED (it was
// re-documented, the charge stands) or CREDITED (we are not charging for it,
// at whatever amount was actually agreed — never assumed to be the line value).
function onHold(p){ return !!p.billing_hold_at && !p.billing_hold_outcome; }
function holdStats(){
  var rows = completedPMs.filter(onHold);
  var byInv = {}, amount = 0, units = {}, ready = 0;
  rows.forEach(function(p){
    units[p.serial || p.id] = 1;
    if (p.revisit_done_at) ready++;
    if (p.billed && p.invoice_doc_number){
      var k = p.invoice_doc_number;
      if(!byInv[k]) byInv[k] = { invoice:k, reports:0, amount:0 };
      byInv[k].reports++; byInv[k].amount += Number(p.bill_amount||0);
      amount += Number(p.bill_amount||0);
    }
  });
  return { rows:rows, reports:rows.length, units:Object.keys(units).length, amount:amount,
           ready:ready, uninvoiced:rows.filter(function(p){ return !p.billed; }).length,
           invoices:Object.keys(byInv).sort().map(function(k){ return byInv[k]; }) };
}
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function daysSince(iso){
  if(!iso) return 0;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function renderRevisitBanner(){
  var r = revisitStats();
  if(!r.total) return '';
  if(!r.open){
    return '<div class="card" style="border-left:4px solid var(--gn)">'

      + '<div class="hint">All '+r.done+' ordered re-visits have been serviced and re-documented.</div></div>';
  }
  var age = daysSince(r.oldest);
  return '<div class="card" style="border-left:4px solid #155E9B;background:#E2EFF9">'
    + '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">'
    + '<div style="flex:1;min-width:260px">'
    + '<h3 style="margin-top:0;color:#155E9B">'+icon('alert')+' '+r.open+' stops are open for re-shoot</h3>'
    + '<div class="hint" style="color:#2E5C7E">'
    + r.units+' unit'+(r.units===1?'':'s')+' across '+r.stores+' store'+(r.stores===1?'':'s')
    + ' must be serviced and photographed again. These are invoiced stops whose documentation we could not stand behind — '
    + 'they are <strong>not billed to Freshpet</strong> and the technician is paid normally. '
    + 'They stay here until the work is done.</div></div>'
    + '<div style="flex:none;text-align:right">'
    + '<div style="font-size:1.9rem;font-weight:800;color:#155E9B;line-height:1">'+r.done+' / '+r.total+'</div>'
    + '<div class="muted" style="font-size:.74rem">re-shot so far</div>'
    + (age>0?'<div class="muted" style="font-size:.72rem;margin-top:4px">oldest ordered '+age+' day'+(age===1?'':'s')+' ago</div>':'')
    + '</div></div>'
    + '<div style="margin-top:12px"><button class="btn pu sm" onclick="tab=\'audits\';auditSub=\'issues\';riFilter=\'revisit\';render()">'
    + icon('refresh')+' See the '+r.open+' open stops</button></div>'
    + '</div>';
}

function renderOverview(){
  var o=computeOverview(), c=o.company;
  var pct=function(done,tot){ return tot>0?Math.round(done/tot*100):0; };

function renderRoutes(){
  var assignedIds = {}; assignments.forEach(function(a){ assignedIds[a.asset_id]=a.tech_email; });
  var techOpts = '<option value="">— select a technician —</option>' + techs.map(function(t){
    var n = assignments.filter(function(a){return a.tech_email===t.email;}).length;
    return '<option value="'+esc(t.email)+'"'+(t.email===routeTech?' selected':'')+'>'+esc(t.name||t.email)+(n?' ('+n+' stops)':'')+'</option>';
  }).join('');

  var h = '<div class="card"><h3>Load routes</h3><div class="hint">Pick a technician, build their ordered stop list, then Save. This writes the same <span class="mono">route_assignments</span> rows the handheld app reads — the field route updates the moment you save.</div>';

  if(!routeTech) return h + '<div class="card"><div class="empty">Select a technician to view and edit their route.</div></div>';

  // Completion (PMs are ANNUAL): a stop is COMPLETED once it has any serviced

  // can't be reordered, removed, or paid again until a fresh list is loaded.
  var done = {};
  completedPMs.forEach(function(p){
    if(p.prev_comp || p.asset_id==null) return;
    var d = String(p.pm_date||'').slice(0,10);
    if(!done[p.asset_id] || d>done[p.asset_id]) done[p.asset_id]=d;
  });
  var doneCount = routeStops.filter(function(s){ return done[s.asset_id]; }).length;
  var openCount = routeStops.length - doneCount;

  // Current route
  h += '<div class="row">';
  h += '<div class="col"><div class="card"><h3>'+esc(techName(routeTech))+' · route <span class="muted">('+routeStops.length+' stops)</span></h3>'
     + '<div class="hint">PMs are annual. Once a stop is serviced it shows <span style="color:var(--gn);font-weight:800">COMPLETED</span> and locks — it can\'t be reordered, removed, or paid again. <span style="color:var(--gn);font-weight:700">'+doneCount+' completed</span> · <span style="color:var(--am);font-weight:700">'+openCount+' open</span>.</div>';
  if(!routeStops.length){ h += '<div class="empty">No stops yet. Add stores from the right.</div>'; }
  else {
    routeStops.forEach(function(s,i){
      var a=s.asset;
      var d=done[s.asset_id];
      var status = d
        ? '<span class="pill gn" style="flex:none;font-weight:800">✓ COMPLETED</span>'
        : '<span class="pill dim" style="flex:none">open</span>';
      var acts = d
        ? '<span class="ic" title="Completed — locked" aria-label="Completed — locked" style="opacity:.55;cursor:default">'+icon('lock')+'</span>'
        : '<button class="ic" onclick="moveStop('+i+',-1)" '+(i===0?'disabled':'')+' title="Move up" aria-label="Move up">'+icon('chevron-up')+'</button>'
          + '<button class="ic" onclick="moveStop('+i+',1)" '+(i===routeStops.length-1?'disabled':'')+' title="Move down" aria-label="Move down">'+icon('chevron-down')+'</button>'
          + '<button class="ic" onclick="removeStop('+i+')" title="Remove stop" aria-label="Remove stop">'+icon('x')+'</button>';
      h += '<div class="stop"'+(d?' style="border-color:var(--gn)"':'')+'><div class="n"'+(d?' style="background:var(--gn)"':'')+'>'+(i+1)+'</div><div class="meta"><div class="s">'+esc(a.store||a.serial||('Asset '+a.id))+'</div><div class="a">'+esc([a.address,a.city,a.state].filter(Boolean).join(', '))+(d?' · completed '+esc(fmtDate(d)):'')+'</div></div>'
        + status
        + '<div class="acts">'+acts+'</div></div>';
    });
  }
  h += '<div style="margin-top:14px;display:flex;gap:10px"><button class="btn gn" onclick="saveRoute()" '+(saving?'disabled':'')+'>'+(saving?'Saving…':''+icon('save')+' Save route')+'</button><button class="btn o" onclick="selectRouteTech(routeTech)">'+icon('refresh')+' Reset</button></div>';
  h += '</div></div>';

  // Add stores
  var q = addSearch.trim().toLowerCase();
  var avail = assets.filter(function(a){
    if(routeStops.some(function(s){return s.asset_id===a.id;})) return false; // already in the working list
    if(assignedIds[a.id]===routeTech) return false;                           // already saved to THIS tech
    if(!q) return true;
    return ((a.store||'')+' '+(a.city||'')+' '+(a.address||'')+' '+(a.serial||'')).toLowerCase().indexOf(q)>=0;
  });
  function isLocked(a){ return assignedIds[a.id] && assignedIds[a.id]!==routeTech; } // on another tech's route
  var addableIds = avail.filter(function(a){ return !isLocked(a); }).map(function(a){ return a.id; });
  var addSelCount = Object.keys(addSel).filter(function(k){ return addSel[k]; }).length;
  var allAvailSel = addableIds.length>0 && addableIds.every(function(id){ return addSel[id]; });
  h += '<div class="col"><div class="card"><h3>Add stops</h3><div class="hint">Tick multiple stores and add them together, or use the row + button for one. Stores already on another tech\'s route are '+icon('lock')+' locked — a store can only belong to one tech.</div>';
  h += '<input type="search" placeholder="Search store, city, address, serial…" value="'+esc(addSearch)+'" oninput="addSearch=this.value;render();this.focus()">';
  h += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px">';
  if(addableIds.length){ h += '<button class="btn o sm" onclick="toggleAddSelAll()">'+(allAvailSel?''+icon('check-square')+' Deselect shown':''+icon('square')+' Select all shown')+'</button>'; }
  h += '<span class="muted" style="font-size:.8rem">'+addSelCount+' selected</span>';
  if(addSelCount){ h += '<button class="btn sm" style="margin-left:auto" onclick="addSelectedStops()">'+icon('plus')+' Add '+addSelCount+' selected</button><button class="btn o sm" onclick="addSel={};render()">Clear</button>'; }
  h += '</div>';
  h += '<div class="addlist">';
  if(!avail.length){ h += '<div class="empty">No matching stores.</div>'; }
  else {
    var byCity={}; avail.forEach(function(a){ (byCity[a.city||'—']||(byCity[a.city||'—']=[])).push(a); });
    Object.keys(byCity).sort().forEach(function(city){
      h += '<div class="grp-h">'+esc(city)+'</div>';
      byCity[city].forEach(function(a){
        var other = isLocked(a);
        var ck = !!addSel[a.id];
        var left = other
          ? '<span style="width:18px;flex:none;text-align:center">'+icon('lock')+'</span>'
          : '<input type="checkbox" style="width:18px;height:18px;flex:none" onclick="toggleAddSel('+a.id+')"'+(ck?' checked':'')+'>';
        var right = other
          ? '<span class="pill dim" style="flex:none">on '+esc(techName(assignedIds[a.id]))+'</span>'
          : '<button class="btn sm" onclick="addStop('+a.id+')">+ Add</button>';
        h += '<div class="addrow"'+(other?' style="opacity:.6"':'')+'>'+left+'<div class="meta"><div class="s" style="font-weight:700;font-size:.86rem">'+esc(a.store||a.serial)+'</div><div class="a muted" style="font-size:.74rem">'+esc([a.address,a.city].filter(Boolean).join(', '))+'</div></div>'+right+'</div>';
      });
    });
  }
  h += '</div></div></div>';
  h += '</div>';
  return h;
}

async function createPayoutBill(techUserId){
  var t = techs.find(function(x){ return x.user_id===techUserId; });
  if(!t) return;
  var unpaid = completedPMs.filter(function(p){ return !p.prev_comp && !p.paid_out && p.tech_user_id===techUserId; });
  var rate = t.pm_rate!=null ? Number(t.pm_rate) : null;
  if(rate==null || rate<=0) return toast('Set a per-PM rate for '+(t.name||t.email)+' first (below)','err');
  if(!unpaid.length) return toast('No unpaid PMs for this tech','err');
  var reshoots = unpaid.filter(function(p){ return p.visit_type==='reshoot'; }).length;
  if(!confirm('Create a QuickBooks BILL to '+(t.name||t.email)+' for '+unpaid.length+' PM'+(unpaid.length===1?'':'s')+' @ '+money(rate)+' = '+money(unpaid.length*rate)+'?\n\nThis posts a real vendor bill in QBO and marks these PMs paid out.'
    + (reshoots?('\n\nIncludes '+reshoots+' re-shoot visit'+(reshoots===1?'':'s')+' — paid in full to the tech and NOT billed to Freshpet.'):''))) return;
  payBusy=true; payBillResult=null; render();
  try{
    var token = await billToken();
    var res = await fetch(PAYOUT_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ mode:'create', techUserId:techUserId, rate:rate }) });
    var j = await res.json();
    if(!res.ok) throw new Error(j.error || ('HTTP '+res.status));
    payBillResult = j;
    await loadAll();
    toast('Bill #'+(j.bill&&j.bill.docNumber)+' created for '+(j.bill&&j.bill.vendor),'ok');
  }catch(e){ toast('Failed: '+e.message,'err'); }
  payBusy=false; render();
}

  });
  var h = '<div class="card"><h3>Technician pay</h3><div class="hint">Each completed PM (per asset, <span class="mono">PREV COMP</span> excluded) earns the tech their per-PM rate. Create a QuickBooks <strong>bill</strong> (what we owe the tech) for their unpaid PMs — separate from what we invoice Freshpet. Set/edit rates in the Per-PM rates section below. <strong>Re-shoot visits are paid here at the full rate</strong> even though they are never charged to Freshpet — the tech drove the stop and did the work; the bad paperwork was ours.</div>';

  if(payBillResult){
    var b=payBillResult.bill||{};
    h += '<div class="card" style="background:var(--sf2);border-color:var(--gn);margin:0 0 14px"><h3 style="color:var(--gn)">✓ Bill #'+esc(b.docNumber)+' created</h3>'
       + '<div class="muted" style="font-size:.85rem">'+payBillResult.paidCount+' PM(s) · '+money(b.total)+' · vendor '+esc(b.vendor)+'</div>'
       + ((payBillResult.warnings&&payBillResult.warnings.length)?'<div style="margin-top:8px;color:var(--am);font-size:.82rem">'+icon('alert')+' '+payBillResult.warnings.map(esc).join('<br>'+icon('alert')+' ')+'</div>':'')
       + '</div>';
  }

  var rows = techs.filter(function(t){ return t.user_id && ((byTech[t.user_id]&&byTech[t.user_id].length) || paidCount[t.user_id]); });
  if(!rows.length){ h += '<div class="empty" style="padding:20px">No technician pay to show yet.</div>'; h += '</div>'; return h; }
  h += '<div style="overflow-x:auto"><table><thead><tr><th>Technician</th><th class="num">Unpaid PMs</th><th class="num">Rate / PM</th><th class="num">Owed</th><th>Paid to date</th><th></th></tr></thead><tbody>';
  rows.forEach(function(t){
    var mine = byTech[t.user_id]||[];
    var unpaid = mine.length;
    var reshoots = mine.filter(function(p){ return p.visit_type==='reshoot'; }).length;
    var rate = t.pm_rate!=null?Number(t.pm_rate):null;
    var owed = rate!=null ? unpaid*rate : null;
    h += '<tr><td>'+esc(t.name||t.email)+'<div class="muted" style="font-size:.72rem">'+esc(t.email)+'</div></td>'
       + '<td class="num">'+unpaid+(reshoots?' <span class="pill pu" title="Re-shoots — paid to the tech, not billed to Freshpet">'+reshoots+' re-shoot</span>':'')+'</td>'
       + '<td class="num">'+(rate!=null?money(rate):'<span class="muted">—</span>')+'</td>'
       + '<td class="num">'+(owed!=null?money(owed):'<span class="muted">set rate</span>')+'</td>'
       + '<td>'+(paidCount[t.user_id]?'<span class="pill gn">'+paidCount[t.user_id]+' paid</span>':'<span class="muted">—</span>')+'</td>'
       + '<td>'+((unpaid&&rate!=null)?'<button class="btn gn sm" onclick="createPayoutBill(\''+esc(t.user_id)+'\')" '+(payBusy?'disabled':'')+'>'+(payBusy?'Working…':''+icon('dollar')+' Create QBO bill')+'</button>':'')+'</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

// ── Pay report (date range, by contractor) ──
function setPayFrom(v){ payFrom=v; render(); }
function setPayTo(v){ payTo=v; render(); }
function payPreset(which){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(which==='this'){ payFrom=isoDate(new Date(y,m,1)); payTo=isoDate(new Date(y,m+1,0)); }
  else if(which==='last'){ payFrom=isoDate(new Date(y,m-1,1)); payTo=isoDate(new Date(y,m,0)); }
  else { payFrom=''; payTo=''; } // all time
  render();
}
function payInRange(dateStr){ var d=String(dateStr||'').slice(0,10); if(payFrom && d<payFrom) return false; if(payTo && d>payTo) return false; return true; }
function renderPayReport(){
  // Lazy default → current month (so history is one click away via presets).
  if(payFrom===null){ var n=new Date(); payFrom=isoDate(new Date(n.getFullYear(),n.getMonth(),1)); payTo=isoDate(new Date(n.getFullYear(),n.getMonth()+1,0)); }
  var rateByEmail={}; techs.forEach(function(t){ rateByEmail[t.email]=t.pm_rate!=null?Number(t.pm_rate):null; });
  var rateFor=function(e){ return (e && rateByEmail[e]!=null) ? rateByEmail[e] : DEFAULT_PM_RATE; };
  var ownerOf={}; assignments.forEach(function(a){ ownerOf[a.asset_id]=a.tech_email; });
  var rows={}; function bk(e){ return rows[e]||(rows[e]={email:e, pms:0, paidPMs:0, unpaidPMs:0, paid:0, owed:0}); }
  var off={email:'(off-route)', pms:0, paidPMs:0, unpaidPMs:0, paid:0, owed:0};
  completedPMs.forEach(function(p){
    if(p.prev_comp) return; if(!payInRange(p.pm_date)) return;
    var owner = p.asset_id!=null ? ownerOf[p.asset_id] : null;
    var rate = rateFor(owner);
    var val = p.payout_amount!=null ? Number(p.payout_amount) : rate;
    var t = owner ? bk(owner) : off;
    t.pms++;
    if(p.paid_out){ t.paidPMs++; t.paid+=val; } else { t.unpaidPMs++; t.owed+=rate; }
  });
  var list = Object.keys(rows).map(function(e){ var r=rows[e]; r.name=techName(e); return r; }).sort(function(a,b){ return b.pms-a.pms; });
  if(off.pms) list.push(off);

  var rangeLbl = (!payFrom && !payTo) ? 'All time' : ((payFrom?fmtDate(payFrom):'…')+' – '+(payTo?fmtDate(payTo):'…'));
  var h = '<div class="card"><div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><h3>Pay report <span class="muted" style="font-weight:600">· '+esc(rangeLbl)+'</span></h3>'
    + '<div class="hint">Per-contractor pay for any date range, from the full completed-PM history. Each completed PM earns '+money(DEFAULT_PM_RATE)+' (or the tech\'s set rate). Credited to whoever\'s route the stop is on. Pick a range to see past periods. Re-shoot visits count here and are paid normally — they are excluded only from what we invoice Freshpet.</div></div>'
    + '<div class="seg" style="flex:none">'
    + '<button onclick="payPreset(\'this\')">This month</button><button onclick="payPreset(\'last\')">Last month</button><button onclick="payPreset(\'all\')">All time</button>'
    + '</div></div>';
  h += '<div class="row" style="align-items:flex-end;margin-bottom:8px">'
    + '<div style="flex:none"><label class="f">From</label><input type="date" value="'+esc(payFrom||'')+'" onchange="setPayFrom(this.value)" style="max-width:180px"></div>'
    + '<div style="flex:none"><label class="f">To</label><input type="date" value="'+esc(payTo||'')+'" onchange="setPayTo(this.value)" style="max-width:180px"></div>'
    + '</div>';
  if(!list.length){ h += '<div class="empty">No completed PMs in this range.</div></div>'; return h; }
  h += '<div style="overflow-x:auto"><table><thead><tr><th>Contractor</th><th class="num">PMs done</th><th class="num">Paid</th><th class="num">$ paid</th><th class="num">Unpaid</th><th class="num">$ owed</th></tr></thead><tbody>';
  var tP=0,tPaidN=0,tPd=0,tU=0,tO=0;
  list.forEach(function(r){
    tP+=r.pms; tPaidN+=r.paidPMs; tPd+=r.paid; tU+=r.unpaidPMs; tO+=r.owed;
    h += '<tr><td>'+esc(r.name)+(r.email!=='(off-route)'?'<div class="muted" style="font-size:.72rem">'+esc(r.email)+'</div>':'')+'</td>'
      + '<td class="num">'+r.pms+'</td>'
      + '<td class="num">'+r.paidPMs+'</td>'
      + '<td class="num">'+money(r.paid)+'</td>'
      + '<td class="num">'+(r.unpaidPMs?'<span class="pill am">'+r.unpaidPMs+'</span>':'0')+'</td>'
      + '<td class="num">'+(r.owed>0?money(r.owed):money(0))+'</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td><td class="num">'+tP+'</td><td class="num">'+tPaidN+'</td><td class="num">'+money(tPd)+'</td><td class="num">'+tU+'</td><td class="num">'+money(tO)+'</td></tr>';
  h += '</tbody></table></div></div>';
  return h;
}

function renderPayments(){
  // distinct weeks present in payouts
  var weeks=[]; payouts.forEach(function(p){ if(weeks.indexOf(p.week_start)<0) weeks.push(p.week_start); });
  weeks.sort().reverse();
  if(!payWeek && weeks.length) payWeek=weeks[0];

  // Date-range pay report (history), then the actionable per-tech bill tool.
  var h = renderPayReport();
  h += renderTechPay();
  // Weekly payouts (tech-submitted snapshots, if any)
  var weekOpts = weeks.length ? weeks.map(function(w){ var p=payouts.find(function(x){return x.week_start===w;}); var end=p?p.week_end:''; return '<option value="'+esc(w)+'"'+(w===payWeek?' selected':'')+'>'+esc(w)+(end?' → '+esc(end):'')+'</option>'; }).join('') : '<option value="">— no submitted payouts —</option>';
  var wk = payouts.filter(function(p){ return p.week_start===payWeek; });
  var total = wk.reduce(function(s,p){ return s+Number(p.amount||0); },0);
  var paid = wk.filter(function(p){return p.status==='paid';}).reduce(function(s,p){return s+Number(p.amount||0);},0);

  h += '<div class="card"><h3>Weekly payouts</h3><div class="hint">Submitted by techs from the field app — review and mark paid here. Same <span class="mono">payouts</span> rows; the tech sees “PAID” instantly.</div>';
  h += '<label class="f">Week</label><select onchange="setPayWeek(this.value)" style="max-width:320px">'+weekOpts+'</select>';
  if(!wk.length){ h += '<div class="empty">No payouts for this week.</div>'; }
  else {
    h += '<div style="overflow-x:auto;margin-top:14px"><table><thead><tr><th>Technician</th><th class="num">Stores</th><th class="num hide">PMs</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead><tbody>';
    wk.forEach(function(p){
      var paidPill = p.status==='paid' ? '<span class="pill gn">Paid</span>' : '<span class="pill am">Submitted</span>';
      var nItems = Array.isArray(p.details)?p.details.length:(p.store_count||0);
      h += '<tr><td>'+esc(techName(p.tech_email))+'<div class="muted" style="font-size:.72rem">'+esc(p.tech_email)+'</div></td>'
         + '<td class="num">'+(p.store_count||0)+'</td>'
         + '<td class="num hide">'+nItems+'</td>'
         + '<td class="num">'+money(p.amount)+'</td>'
         + '<td>'+paidPill+'</td>'
         + '<td>'+(p.status==='paid'?'':'<button class="btn gn sm" onclick="markPaid('+p.id+')">Mark paid</button>')+'</td></tr>';
    });
    h += '<tr class="tot"><td>Total</td><td class="num"></td><td class="num hide"></td><td class="num">'+money(total)+'</td><td colspan="2" class="muted" style="font-weight:600">'+money(paid)+' paid · '+money(total-paid)+' outstanding</td></tr>';
    h += '</tbody></table></div>';
  }
  h += '</div>';

  // Rates
  h += '<div class="card"><h3>Per-PM rates</h3><div class="hint">Flat rate paid per completed PM for each tech (overrides per-asset fees). Stored on <span class="mono">tech_profiles.pm_rate</span>.</div>';
  h += '<div style="overflow-x:auto"><table><thead><tr><th>Technician</th><th>Role</th><th class="num">Rate / PM</th><th></th></tr></thead><tbody>';
  techs.forEach(function(t){
    h += '<tr><td>'+esc(t.name||t.email)+'<div class="muted" style="font-size:.72rem">'+esc(t.email)+'</div></td>'
       + '<td><span class="pill '+(t.role==='admin'?'am':'dim')+'">'+esc(t.role||'tech')+'</span></td>'
       + '<td class="num"><input type="number" step="0.01" min="0" id="rate_'+esc(t.email)+'" value="'+(t.pm_rate!=null?Number(t.pm_rate):'')+'" placeholder="—" style="max-width:120px;text-align:right"></td>'
       + '<td><button class="btn o sm" onclick="saveRate(\''+esc(t.email)+'\', document.getElementById(\'rate_'+esc(t.email)+'\').value)">Save</button></td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

// ═══ Billing (Freshpet) ═══
async function billToken(){ var { data:{ session } } = await sb.auth.getSession(); return session && session.access_token; }
// completed_pms has no city column — derive it from the linked asset.
function cityOf(p){ var a = assetById(p.asset_id); return (a && a.city) || ''; }
function billableList(){
  var q = billSearch.trim().toLowerCase();
  return completedPMs.filter(function(p){
    if (p.prev_comp) return false;                 // done elsewhere — never billed
    if (p.visit_type === 'exception') return false; // failed visit (closed store / missing unit) — never a billable PM
    if (p.visit_type === 'reshoot') return false;   // re-visit of a stop already billed once — remediation, we absorb it
    // On hold = in dispute. It cannot be selected for an invoice from here, and
    // freshpet-invoice.mjs refuses it again server-side — this list is the
    // convenience, that function is the gate.
    if (!p.billed && onHold(p)) return false;
    if (!billShowBilled && p.billed) return false;
    if (!q) return true;
    return ((p.store||'')+' '+cityOf(p)+' '+(p.serial||'')+' '+(p.tech_name||'')).toLowerCase().indexOf(q)>=0;
  });
}
function toggleBill(id){ if(billSel[id]) delete billSel[id]; else billSel[id]=true; billPreview=null; render(); }
function selectAllBill(){
  var list = billableList().filter(function(p){ return !p.billed; });
  var allSel = list.length && list.every(function(p){ return billSel[p.id]; });
  if (allSel) { list.forEach(function(p){ delete billSel[p.id]; }); }
  else { list.forEach(function(p){ billSel[p.id]=true; }); }
  billPreview=null; render();
}
function selectedIds(){ return Object.keys(billSel).filter(function(k){ return billSel[k]; }).map(Number); }

// Portal user management backend — creates the real Supabase login, mints a
// one-time set-password link, and sends the branded walkthrough/reset email.
var USERS_FN = 'https://apbg-billing.netlify.app/.netlify/functions/freshpet-portal-users';
var fpLegacyLink = '';
try { fpLegacyLink = localStorage.getItem('fp_legacy_link') || ''; } catch(e){}
var fpInviteBusy = {};   // { email: true } while an invite/reset is in flight

function setLegacyLink(v){ fpLegacyLink=(v||'').trim(); try{ localStorage.setItem('fp_legacy_link', fpLegacyLink); }catch(e){} }

async function portalUsersCall(body){
  var token = await billToken();
  var res = await fetch(USERS_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }, body: JSON.stringify(body) });
  var j = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(j.error || ('HTTP '+res.status));
  return j;
}

async function grantPortal(){
  var el = document.getElementById('fp_email');
  var email = (el && el.value || '').trim().toLowerCase();
  if(!email || email.indexOf('@')<0) return toast('Enter a valid email','err');
  var sendInvite = !!(document.getElementById('fp_send_invite')||{}).checked;
  var existing = techs.find(function(t){ return (t.email||'').toLowerCase()===email; });
  if (existing && existing.role==='admin'){ if(sendInvite) return sendPortalInvite(email); return toast(email+' is an admin — they already have portal access','info'); }
  var res = existing
    ? await sb.from('tech_profiles').update({ role:'freshpet' }).eq('email', existing.email)
    : await sb.from('tech_profiles').insert({ email:email, name:email.split('@')[0], role:'freshpet' });
  if(res.error) return toast('Failed: '+res.error.message,'err');
  await loadAll(); toast('Portal access granted to '+email,'ok'); render();
  if (sendInvite) await sendPortalInvite(email);
}
// Also the "resend invite" path — safe to send any number of times.
async function sendPortalInvite(email){
  if(fpInviteBusy[email]) return;
  fpInviteBusy[email]=true; render();
  try{
    var t = techs.find(function(x){ return (x.email||'').toLowerCase()===email.toLowerCase(); });
    var j = await portalUsersCall({ action:'invite', email:email, name:(t&&t.name)||'', legacyLink: fpLegacyLink });
    toast('Invite + walkthrough emailed to '+email+(j.legacyLinkIncluded?'':' (no legacy folder link set)'),'ok');
    await loadAll();
  }catch(e){ toast('Invite failed: '+e.message,'err'); }
  delete fpInviteBusy[email]; render();
}
async function resetPortalPassword(email){
  if(fpInviteBusy[email]) return;
  if(!confirm('Email a password-reset link to '+email+'?')) return;
  fpInviteBusy[email]=true; render();
  try{
    await portalUsersCall({ action:'reset', email:email });
    toast('Password-reset email sent to '+email,'ok');
    await loadAll();
  }catch(e){ toast('Reset failed: '+e.message,'err'); }
  delete fpInviteBusy[email]; render();
}
async function revokePortal(email){
  if(!confirm('Remove Freshpet portal access for '+email+'?')) return;
  var { error } = await sb.from('tech_profiles').delete().eq('email', email);
  if(error) return toast('Failed: '+error.message,'err');
  await loadAll(); toast('Access removed for '+email,'ok'); render();
}

async function previewInvoice(){
  var ids = selectedIds();
  if(!ids.length) return toast('Select at least one completed PM','err');
  billBusy=true; billPreview=null; billResult=null; render();
  try{
    var token = await billToken();
    var res = await fetch(BILL_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ mode:'preview', pmIds:ids, rate:Number(billRate)||30 }) });
    var j = await res.json();
    if(!res.ok) throw new Error(j.error || ('HTTP '+res.status));
    billPreview = j;
  }catch(e){ toast('Preview failed: '+e.message,'err'); }
  billBusy=false; render();
}
async function createInvoice(){
  var ids = selectedIds();
  if(!ids.length) return toast('Select at least one completed PM','err');
  var n = ids.length, rate = Number(billRate)||30;
  if(!confirm('Create a QuickBooks invoice to FRESH PET for '+n+' PM'+(n===1?'':'s')+' @ '+money(rate)+' = '+money(n*rate)+'?\n\nThis posts a real invoice in QBO and marks these PMs billed.')) return;
  billBusy=true; billResult=null; render();
  try{
    var token = await billToken();
    var res = await fetch(BILL_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ mode:'create', pmIds:ids, rate:rate, recipientEmail:(billRecipient||'').trim() }) });
    var j = await res.json();
    if(!res.ok) throw new Error(j.error || ('HTTP '+res.status));
    billResult = j; billSel = {}; billPreview = null;
    await loadAll();
    toast('Invoice #'+(j.invoice&&j.invoice.docNumber)+' created'+(j.emailed?' + emailed':''),'ok');
  }catch(e){ toast('Create failed: '+e.message,'err'); }
  billBusy=false; render();
}

// Closing a hold. Both exits are a decision somebody made, so both record who
// and why; neither deletes the hold, because "there was a hold on this line and
// here is how it ended" is the only question anyone asks about it later.
async function closeHold(outcome){
  var ids = holdSelectedIds();
  if(!ids.length) return toast('Select the lines to close','err');
  var rows = completedPMs.filter(function(p){ return ids.indexOf(p.id)>=0 && onHold(p); });
  if(!rows.length) return toast('None of those are on hold','err');
  var patch = { billing_hold_outcome: outcome, billing_hold_closed_at: new Date().toISOString(),
                billing_hold_closed_by: (user && user.email) || 'admin' };

  if(outcome === 'released'){
    var notRedone = rows.filter(function(p){ return !p.revisit_done_at; });
    if(!confirm('Release ' + rows.length + ' line' + (rows.length===1?'':'s') + ' back onto the invoice?\n\n'
      + 'You are saying the charge stands and Freshpet should pay it.\n'
      + (notRedone.length
         ? '\n\u26a0 ' + notRedone.length + ' of these has NOT been re-documented yet — releasing it means the\n'
           + 'original paperwork is what you are standing behind.\n' : ''))) return;
  } else {
    var suggested = rows.reduce(function(t,p){ return t + Number(p.bill_amount||0); }, 0);
    var typed = prompt('Credit ' + rows.length + ' line' + (rows.length===1?'':'s') + '.\n\n'
      + 'Total credit amount in dollars. The line value is ' + fmtMoney(suggested) + ', but a negotiated\n'
      + 'credit is a decision, not arithmetic — type what was actually agreed.\n\n'
      + 'It is split evenly across the selected lines.', String(suggested));
    if(typed === null) return;
    var amt = Number(String(typed).replace(/[^0-9.\-]/g,''));
    if(!(amt >= 0)) return toast('That is not an amount','err');
    patch.credit_amount = Math.round((amt / rows.length) * 100) / 100;
    if(!confirm('Credit ' + fmtMoney(amt) + ' across ' + rows.length + ' line' + (rows.length===1?'':'s')
      + ' (' + fmtMoney(patch.credit_amount) + ' each)?\n\n'
      + 'This records the credit on our side. Issuing it in QuickBooks is a separate step.')) return;
  }

  holdBusy = true; render();
  try{
    var { error } = await sb.from('completed_pms').update(patch).in('id', rows.map(function(p){ return p.id; }));
    if(error) throw error;
    holdSel = {};
    await loadAll();
    toast(rows.length + ' line' + (rows.length===1?'':'s') + ' ' + outcome, 'ok');
  }catch(e){ toast('Failed: ' + e.message, 'err'); }
  holdBusy = false; render();
}

function renderHolds(){
  var hs = holdStats();
  if(!hs.reports && !completedPMs.some(function(p){ return p.billing_hold_at; })) return '';
  if(!hs.reports){
    return '<div class="card" style="border-left:4px solid var(--gn)"><h3 style="color:var(--gn);margin-top:0">'
      + icon('check') + ' No amounts on hold</h3>'
      + '<div class="hint">Every disputed line has been released or credited.</div></div>';
  }
  var sel = holdSelectedIds();
  var list = hs.rows.slice().sort(function(a,b){
    if(!!b.revisit_done_at !== !!a.revisit_done_at) return b.revisit_done_at ? 1 : -1;
    return String(a.store||'').localeCompare(String(b.store||''));
  });

  var h = '<div class="card" style="border-left:4px solid var(--am)">'
    + '<h3 style="margin-top:0;color:var(--am)">' + icon('alert') + ' ' + fmtMoney(hs.amount) + ' on hold</h3>'
    + '<div class="hint">' + hs.reports + ' visit' + (hs.reports===1?'':'s') + ' across ' + hs.units
    + ' unit' + (hs.units===1?'':'s') + ' are in dispute and shown to Freshpet in the portal as '
    + '<strong>not payable</strong>. A hold changes nothing about what was invoiced — it is our statement '
    + 'about specific lines on it. Close each one by <strong>releasing</strong> it (re-documented, the charge '
    + 'stands) or <strong>crediting</strong> it.'
    + (hs.uninvoiced ? ' A further ' + hs.uninvoiced + ' held visit' + (hs.uninvoiced===1?' is':'s are')
        + ' not invoiced at all and cannot be selected for an invoice while held.' : '')
    + '</div>';

  if(hs.invoices.length){
    h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0">'
      + hs.invoices.map(function(iv){
          return '<span class="pill am">Invoice #' + esc(iv.invoice) + ' · ' + iv.reports
            + ' visit' + (iv.reports===1?'':'s') + ' · ' + fmtMoney(iv.amount) + '</span>'; }).join('')
      + '</div>';
  }
  if(hs.ready){
    h += '<div class="hint" style="color:var(--gn)">' + hs.ready + ' of these ' + (hs.ready===1?'has':'have')
      + ' been re-documented and ' + (hs.ready===1?'is':'are') + ' ready for you to release or credit.</div>';
  }

  h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0">'
    + '<button class="btn o sm" onclick="holdSelectAll()">'
      + (list.every(function(p){ return holdSel[p.id]; }) ? 'Deselect all' : 'Select all ' + list.length) + '</button>'
    + (hs.ready ? '<button class="btn o sm" onclick="holdSelectAll(true)">Select the ' + hs.ready + ' re-documented</button>' : '')
    + '<span class="muted" style="font-size:.8rem">' + sel.length + ' selected</span>'
    + '<button class="btn gn sm" onclick="closeHold(\'released\')" ' + ((holdBusy||!sel.length)?'disabled':'') + '>Release — charge stands</button>'
    + '<button class="btn o sm" onclick="closeHold(\'credited\')" ' + ((holdBusy||!sel.length)?'disabled':'') + '>Credit</button>'
    + '</div>';

  h += '<div style="overflow-x:auto;max-height:380px;overflow-y:auto"><table><thead><tr>'
    + '<th style="width:34px"></th><th>Store</th><th>Serial</th><th>Date</th><th>Invoice</th>'
    + '<th>Amount</th><th>State</th></tr></thead><tbody>';
  list.forEach(function(p){
    h += '<tr>'
      + '<td><input type="checkbox" ' + (holdSel[p.id]?'checked':'') + ' onclick="holdToggle(' + p.id + ')"></td>'
      + '<td>' + esc(p.store||'') + '</td>'
      + '<td class="mono" style="font-size:.8rem">' + esc(p.serial||'—') + '</td>'
      + '<td>' + esc(p.pm_date||'') + '</td>'
      + '<td>' + (p.billed ? '#' + esc(p.invoice_doc_number||'—') : '<span class="pill dim">not invoiced</span>') + '</td>'
      + '<td class="mono">' + (p.billed ? fmtMoney(p.bill_amount) : '—') + '</td>'
      + '<td>' + (p.revisit_done_at
          ? '<span class="pill gn">Re-documented ' + esc(String(p.revisit_done_at).slice(0,10)) + '</span>'
          : '<span class="pill am">Awaiting re-shoot</span>') + '</td>'
      + '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

    var selectableCount = list.filter(function(p){ return !p.billed; }).length;
    h += '<div style="overflow-x:auto"><table><thead><tr>'
       + '<th style="width:34px"><button class="btn o sm" onclick="selectAllBill()" title="Select all unbilled" style="padding:3px 8px">✓ all</button></th>'
       + '<th>Store</th><th class="hide">City</th><th>Serial</th><th>Date</th><th class="hide">Tech</th><th>Status</th></tr></thead><tbody>';
    list.forEach(function(p){
      var checked = !!billSel[p.id];
      var statusCell = p.billed
        ? '<span class="pill gn">Inv #'+esc(p.invoice_doc_number||'—')+'</span>'
        : '<span class="pill am">Unbilled</span>';
      h += '<tr>'
         + '<td>'+(p.billed?'':'<input type="checkbox" '+(checked?'checked':'')+' onclick="toggleBill('+p.id+')">')+'</td>'
         + '<td>'+esc(p.store||'')+'</td>'
         + '<td class="hide">'+esc(cityOf(p))+'</td>'
         + '<td class="mono" style="font-size:.8rem">'+esc(p.serial||'')+'</td>'
         + '<td>'+esc(p.pm_date||'')+'</td>'
         + '<td class="hide">'+esc(p.tech_name||'')+'</td>'
         + '<td>'+statusCell+'</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="muted" style="margin-top:8px;font-size:.78rem">'+selectableCount+' unbilled shown.</div>';
  }
  // Say out loud what has been held back, so a missing stop is never a mystery.
  var heldBack = completedPMs.filter(function(p){ return !p.prev_comp && (p.visit_type==='reshoot' || p.visit_type==='exception'); });
  if(heldBack.length){
    var nRe = heldBack.filter(function(p){ return p.visit_type==='reshoot'; }).length;
    var nEx = heldBack.length - nRe;
    h += '<div class="muted" style="margin-top:6px;font-size:.78rem">'
       + 'Not on this list and not billable: '
       + (nRe?'<span class="pill pu">'+nRe+' re-shoot'+(nRe===1?'':'s')+'</span> (our remediation — tech is paid, Freshpet is not charged)':'')
       + (nRe&&nEx?' · ':'')
       + (nEx?'<span class="pill am">'+nEx+' exception'+(nEx===1?'':'s')+'</span> (store closed / unit not found)':'')
       + '</div>';
  }
  h += '</div>';
  return h;
}

// ═══ Added Assets (field-found, un-reported) ═══
function fieldAssets(){ return assets.filter(function(a){ return a.source==='field'; }); }
function addedAssetPMs(){ return completedPMs.filter(function(p){ return p.added_asset && !p.prev_comp; }); }

async function markReported(id){
  var a = assets.find(function(x){ return x.id===id; }); if(!a) return;
  if(!confirm('Mark this asset as REPORTED to Freshpet?\n\n'+(a.store||'')+' — S/N '+(a.serial||'')+'\n\nDo this once Freshpet has been told the unit exists (it should show up in their next asset export).')) return;
  var { error } = await sb.from('assets').update({ reported:true, reported_at:new Date().toISOString(), reported_by:user.email }).eq('id', id);
  if(error) return toast('Failed: '+error.message,'err');
  await loadAll(); toast('Marked reported','ok'); render();
}

function toggleAa(id){ if(aaSel[id]) delete aaSel[id]; else aaSel[id]=true; aaPreview=null; render(); }
function aaSelectedIds(){ return Object.keys(aaSel).filter(function(k){ return aaSel[k]; }).map(Number); }
function aaSelectAll(){
  var list = addedAssetPMs().filter(function(p){ return !p.billed; });
  var allSel = list.length && list.every(function(p){ return aaSel[p.id]; });
  if(allSel){ list.forEach(function(p){ delete aaSel[p.id]; }); }
  else { list.forEach(function(p){ aaSel[p.id]=true; }); }
  aaPreview=null; render();
}

// Same QBO invoice pipeline as the Billing tab (freshpet-invoice fn), scoped
// to the selected added-asset PMs.
async function aaInvoice(mode){
  var ids = aaSelectedIds();
  if(!ids.length) return toast('Select at least one added-asset PM','err');
  var rate = Number(aaRate)||30;
  if(mode==='create' && !confirm('Create a QuickBooks invoice to FRESH PET for '+ids.length+' ADDED-ASSET PM'+(ids.length===1?'':'s')+' @ '+money(rate)+' = '+money(ids.length*rate)+'?\n\nThis posts a real invoice in QBO and marks these PMs billed.')) return;
  aaBusy=true; if(mode==='create'){ aaResult=null; } else { aaPreview=null; } render();
  try{
    var token = await billToken();
    var res = await fetch(BILL_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ mode:mode, pmIds:ids, rate:rate, recipientEmail:(aaRecipient||'').trim() }) });
    var j = await res.json();
    if(!res.ok) throw new Error(j.error || ('HTTP '+res.status));
    if(mode==='create'){
      aaResult=j; aaSel={}; aaPreview=null;
      await loadAll();
      toast('Invoice #'+(j.invoice&&j.invoice.docNumber)+' created'+(j.emailed?' + emailed':''),'ok');
    } else { aaPreview=j; }
  }catch(e){ toast((mode==='create'?'Create':'Preview')+' failed: '+e.message,'err'); }
  aaBusy=false; render();
}

// QBO vendor bill scoped to JUST this tech's unpaid added-asset PMs
// (freshpet-payout-bill with pmIds — the Payments tab pays everything unpaid).
async function aaPayTech(techUserId){
  var t = techs.find(function(x){ return x.user_id===techUserId; }); if(!t) return;
  var mine = addedAssetPMs().filter(function(p){ return !p.paid_out && p.tech_user_id===techUserId; });
  if(!mine.length) return toast('No unpaid added-asset PMs for this tech','err');
  var rate = t.pm_rate!=null && Number(t.pm_rate)>0 ? Number(t.pm_rate) : DEFAULT_PM_RATE;
  if(!confirm('Create a QuickBooks BILL to '+(t.name||t.email)+' for '+mine.length+' ADDED-ASSET PM'+(mine.length===1?'':'s')+' @ '+money(rate)+' = '+money(mine.length*rate)+'?\n\nThis posts a real vendor bill in QBO and marks just these PMs paid out.')) return;
  aaBusy=true; aaPayResult=null; render();
  try{
    var token = await billToken();
    var res = await fetch(PAYOUT_FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },

// ═══ Incident Log ═══
// A durable record of what went wrong, why, what was done, and what stops it recurring.
// Kept in the app so the record lives beside the data it describes.
var INC_STATUS = ['open','investigating','remediating','monitoring','paused','closed'];
var INC_SEV    = ['low','medium','high','critical'];
var INC_KIND   = ['note','finding','action','decision','communication'];
var SEV_PILL   = { low:'dim', medium:'am', high:'rd', critical:'rd' };
var STATUS_PILL= { open:'rd', investigating:'am', remediating:'pu', monitoring:'am', paused:'dim', closed:'gn' };
// Where an incident notification goes. Not a config row: this address is the
// point of the requirement, and a misconfigured setting that silently sends
// nowhere is worse than a hardcoded one you can read.
var INC_ALERT_TO = 'skypace@brixbev.com';

function incEntriesFor(id){
  return incidentEntries.filter(function(e){ return e.incident_id === id; })
    .sort(function(a,b){ return String(a.entry_at).localeCompare(String(b.entry_at)); });
}
function fmtWhen(t){
  if(!t) return '';
  var d = new Date(t);
  return isNaN(d) ? String(t).slice(0,16) : d.toLocaleString(undefined,{ dateStyle:'medium', timeStyle:'short' });
}
function nl2br(t){ return esc(t||'').replace(/\n/g,'<br>'); }

async function incAddEntry(id){
  var body = (incDraft.body||'').trim();
  if(!body) return toast('Write something first','err');
  incBusy = true; render();
  try{
    var { error } = await sb.from('incident_entries').insert({
      incident_id: id, kind: incDraft.kind, body: body,
      author: (user && user.email) || 'admin'
    });
    if(error) throw error;
    await sb.from('incidents').update({ updated_at: new Date().toISOString() }).eq('id', id);
    incDraft = { kind:'note', body:'' };
    await loadAll();
    toast('Entry added','ok');
  }catch(e){ toast('Could not add the entry: '+e.message,'err'); }
  incBusy = false; render();
}

async function incSetStatus(id, status){
  var inc = incidents.filter(function(i){ return i.id===id; })[0];
  if(!inc || inc.status === status) return;
  var note = '', reason = null;

  // Closing is the one transition that has to say WHY. An incident closed with
  // no statement of what finished is a row that went quiet, not a resolution,
  // and this log exists precisely because "it went quiet" was not good enough.
  if(status === 'closed'){
    note = prompt('Close ' + (inc.ref||'this incident') + '?\n\n'
      + 'Say what finished it \u2014 the corrective and preventive work that is done.\n'
      + 'This goes on the record and, if the incident is customer-facing, is what\n'
      + 'you can choose to show Freshpet.\n\n'
      + 'e.g. All 197 stops re-documented, controls verified live, hold released.');
    if(note === null) return;
    note = String(note).trim();
    if(!note) return toast('A closing statement is required','err');
  } else if(inc.status === 'closed'){
    // Reopening carries the same discipline as closing. An incident that
    // silently comes back off the shelf loses the one thing the log is for:
    // being able to say later what was believed, and when.
    note = prompt('Reopen ' + (inc.ref||'this incident') + '?\n\n'
      + 'It was closed' + (inc.closed_at ? ' on ' + fmtWhen(inc.closed_at) : '')
      + (inc.closed_by ? ' by ' + inc.closed_by : '') + '.\n'
      + 'Say what brought it back \u2014 this goes on the record beside the closing\n'
      + 'statement it contradicts.\n\n'
      + 'e.g. Two re-shot stops failed the audit again on the second visit.');
    if(note === null) return;
    note = String(note).trim();
    if(!note) return toast('Say what brought it back','err');
  } else if(status === 'paused'){
    reason = prompt('Pause ' + (inc.ref||'this incident') + '?\n\n'
      + 'Say what it is waiting on. Paused is honest about stalled work in a way\n'
      + 'that leaving it "open" for weeks is not.\n\n'
      + 'e.g. Waiting on Freshpet to confirm the two disputed serials.');
    if(reason === null) return;
    reason = String(reason).trim();
    if(!reason) return toast('Say what it is waiting on','err');
  }

  incBusy = true; render();
  try{
    var patch = { status: status, updated_at: new Date().toISOString() };
    // closed_at is the close TIMESTAMP, so it is cleared on reopen — but
    // closed_by is left in place: who closed it last is history, not state.
    patch.closed_at = (status === 'closed') ? new Date().toISOString() : null;
    if(status === 'closed') patch.closed_by = (user && user.email) || 'admin';
    patch.paused_reason = (status === 'paused') ? reason : null;
    var { error } = await sb.from('incidents').update(patch).eq('id', id);
    if(error) throw error;
    var body = status === 'closed' ? 'CLOSED. ' + note
             : status === 'paused' ? 'PAUSED \u2014 waiting on: ' + reason
             : inc.status === 'closed' ? 'REOPENED. ' + note
             : 'Status changed to ' + status + '.';
    await sb.from('incident_entries').insert({ incident_id:id, kind:'decision',
      author:(user && user.email)||'admin', body: body });
    await loadAll();
    notifyIncident(Object.assign({}, inc, { status: status }),
                   status === 'closed' ? 'closed'
                   : inc.status === 'closed' ? 'reopened' : 'status', body);
    toast(status === 'closed' ? 'Incident closed' : 'Status updated','ok');
  }catch(e){ toast('Could not update: '+e.message,'err'); }
  incBusy = false; render();
}

// Sharing ONE entry with the customer. Off by default and one at a time, on
// purpose: the timeline is where people write candidly, and it already holds a
// named personnel action. Nothing reaches Freshpet without somebody reading it
// and choosing to send it.
async function incShareEntry(entryId, share){
  var e = incidentEntries.filter(function(x){ return x.id===entryId; })[0];
  if(!e) return;
  if(share && !confirm('Show this entry to Freshpet?\n\n'
      + '\u201c' + String(e.body||'').slice(0,180) + (String(e.body||'').length>180?'\u2026':'') + '\u201d\n\n'
      + 'It appears on their portal under this incident. Check it names nobody and\n'
      + 'says nothing internal before you send it.')) return;
  incBusy = true; render();
  try{
    var { error } = await sb.from('incident_entries').update({
      customer_visible: !!share,
      shared_at: share ? new Date().toISOString() : null,
      shared_by: share ? ((user && user.email)||'admin') : null
    }).eq('id', entryId);
    if(error) throw error;
    await loadAll();
    toast(share ? 'Shared with Freshpet' : 'No longer shown to Freshpet','ok');
  }catch(e2){ toast('Could not change sharing: '+e2.message,'err'); }
  incBusy = false; render();
}

// Every incident event emails INC_ALERT_TO. Best-effort and non-blocking: a
// mail outage must never stop an incident being recorded, which is the thing
// that actually matters. A failure says so rather than passing silently.
async function notifyIncident(inc, event, body){
  try{
    var token = await billToken();
    var res = await fetch(INCIDENT_FN, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ to: INC_ALERT_TO, event: event,
        incident: { id:inc.id, ref:inc.ref, title:inc.title, status:inc.status,
                    severity:inc.severity, customer_facing:!!inc.customer_facing },
        note: body || '' })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    toast('Recorded, but the notification to '+INC_ALERT_TO+' failed: '+e.message,'err');
  }
}

// ═══ Nightly audit ═══
// The findings written by fn_pm_nightly_audit, which runs in Postgres at 02:10
// Pacific every night. This board is the record of record: the digest email is
// a convenience on top of it, and if that email fails the list here is still
// right. Findings resolve themselves once the underlying report is fixed, so
// this is a worklist rather than a log.
var AUDIT_LABEL = {
  photos_none:      ['red',  'No photographs at all',                          'Nothing ties this report to a machine or to the visit.'],
  photos_missing:   ['red',  'Missing one of the three required photographs',  'Full pic of unit, serial plate, bottom of unit.'],
  photo_reused:     ['red',  'A photograph also appears on another report',    'The defect Freshpet found: one unit standing in for another.'],
  duplicate_report: ['am',   'Two reports for one unit within ten days',       'Sometimes right, often a double submission — read it.'],
  default_readings: ['am',   'Readings are exactly the old pre-filled values',  'SP1 41F / 120V / 38F. The form no longer suggests these.'],
  signature_missing:['red',  'No store signature and no reason given',         'The form requires one or the other.'],
  exception_thin:   ['am',   'Exception with no note or no photograph',        'The shape of the five closed-store reports on #172825.'],
  no_serial_plate:  ['dim',  'Serial plate missing or unreadable',             'Reconcile against the Freshpet asset list.']
};
var auditBusy = false;
var auditSub = 'findings';   // findings | issues | added
var auditSel = {};   // { finding id: true }
var holdBusy = false;
var holdSel = {};    // { pm id: true } — lines whose hold is being closed
function holdToggle(id){ if(holdSel[id]) delete holdSel[id]; else holdSel[id]=true; render(); }
function holdSelectedIds(){ return Object.keys(holdSel).filter(function(k){ return holdSel[k]; }).map(Number); }
function holdSelectAll(onlyRedone){
  var list = holdStats().rows.filter(function(p){ return onlyRedone ? !!p.revisit_done_at : true; });
  var allSel = list.length && list.every(function(p){ return holdSel[p.id]; });
  list.forEach(function(p){ if(allSel) delete holdSel[p.id]; else holdSel[p.id]=true; });
  render();
}

function auditToggle(id){ if(auditSel[id]) delete auditSel[id]; else auditSel[id]=true; render(); }
function auditSelectedIds(){ return Object.keys(auditSel).filter(function(k){ return auditSel[k]; }).map(Number); }
function auditSelectedFindings(){
  var ids = auditSelectedIds();
  return auditFindings.filter(function(f){ return ids.indexOf(f.id) >= 0; });
}
// Select-all over a named group, or over everything when no check is given.
function auditSelectAll(check){
  var list = check ? auditFindings.filter(function(f){ return f.check_name===check; }) : auditFindings;
  var allSel = list.length && list.every(function(f){ return auditSel[f.id]; });
  list.forEach(function(f){ if(allSel) delete auditSel[f.id]; else auditSel[f.id]=true; });
  render();
}

// Clearing findings you have looked at is the whole point of a worklist: the
// board is supposed to go quiet once you have been through it and stay quiet.
// The reason is required and recorded, so "cleared" never means "hidden".
async function bulkDismiss(){
  var ids = auditSelectedIds();
  if(!ids.length) return toast('Select the findings to clear','err');
  var why = prompt('Clearing ' + ids.length + ' finding' + (ids.length===1?'':'s') + '.\n\n'
    + 'Why? (recorded on each row — say what you checked or did)');
  if(why === null) return;
  if(!String(why).trim()) return toast('A reason is required','err');
  auditBusy = true; render();
  try{
    var { data:{ user: u } } = await sb.auth.getUser();
    var { error } = await sb.from('pm_audit_findings').update({
      dismissed_at: new Date().toISOString(),
      dismissed_by: ((u && u.email) || 'admin') + ' — ' + String(why).trim()
    }).in('id', ids);
    if(error) throw error;
    auditSel = {};
    await loadAll();
    toast(ids.length + ' finding' + (ids.length===1?'':'s') + ' cleared','ok');
  }catch(e){ toast('Failed: '+e.message,'err'); }
  auditBusy = false; render();
}

// Send the selected stops back out. The findings do not need dismissing
// afterwards — the board drops anything a re-shoot supersedes on its next read.
async function bulkReshootFromAudit(){
  var fs = auditSelectedFindings();
  if(!fs.length) return toast('Select the findings to send back out','err');
  var pmIds = []; fs.forEach(function(f){ if(pmIds.indexOf(f.pm_id)<0) pmIds.push(f.pm_id); });
  var reason = (document.getElementById('auditRvReason')||{}).value || 'unverifiable';
  if(!confirm('Send ' + pmIds.length + ' stop' + (pmIds.length===1?'':'s') + ' back out for a re-shoot?\n\n'
    + 'Reason: ' + (REVISIT_REASONS[reason]||reason) + '\n\n'
    + 'Each one has its photographs disconnected (kept on file) and goes back on the route.\n'
    + 'They drop off this board straight away — they are tracked on the re-shoot banner from then on.')) return;
  auditBusy = true; render();
  var r = await orderReshootFor(pmIds, reason);
  auditSel = {};
  await loadAll();
  toast(r.ok + ' stop' + (r.ok===1?'':'s') + ' sent back out'
    + (r.skipped ? ' · ' + r.skipped + ' already open' : '')
    + (r.fail ? ' · ' + r.fail + ' failed' : ''), r.fail ? 'err' : 'ok');
  auditBusy = false; render();
}
// The finding row carries the report's own details (the view joins them), so a
// finding renders correctly even for a report outside the loaded page set.
function auditPm(id, f){
  if (f && f.store) return f;
  return completedPMs.find(function(p){ return p.id===id; }) || {};
}

async function dismissFinding(id){
