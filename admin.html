function renderAudit(){
  var reds = auditFindings.filter(function(f){ return f.severity==='red'; });
  var ambers = auditFindings.filter(function(f){ return f.severity==='amber'; });
  var infos = auditFindings.filter(function(f){ return f.severity==='info'; });

  var h = renderRevisitBanner()
    + '<div class="card"><div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">'
    + '<div style="flex:1;min-width:220px"><h3>Nightly audit</h3>'
    + '<div class="hint">Every check here is a defect the invoice #172825 review had to find by hand. It runs automatically at <strong>02:10 Pacific</strong> over the last 45 days of work and re-checks everything, so a problem is caught the night it happens rather than when a customer reads an invoice. Findings <strong>clear themselves</strong> once the report is fixed — this is a worklist, not a log.</div></div>'
    + '<button class="btn o sm" style="flex:none" onclick="runAuditNow()" '+(auditBusy?'disabled':'')+'>'+(auditBusy?'Running…':icon('refresh')+' Run it now')+'</button>'
    + '</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">'
    + '<span class="pill rd">'+reds.length+' to fix</span>'
    + '<span class="pill am">'+ambers.length+' to check</span>'
    + '<span class="pill dim">'+infos.length+' for information</span>'
    + '</div></div>';

  if(!auditFindings.length){
    h += '<div class="card"><div class="empty" style="padding:26px">'
      + '<div style="font-size:1.05rem;color:var(--gn);font-weight:700">Nothing outstanding</div>'
      + '<div class="muted" style="margin-top:6px">Every PM in the last 45 days passes every check, or has been cleared or sent back out. '
      + 'It stays this way until something new comes in.</div></div></div>';
    return h;
  }

  // Bulk bar. A worklist you can only clear one row at a time is a worklist
  // nobody finishes, and an audit that never goes quiet stops being read.
  var sel = auditSelectedIds();
  var allSelected = auditFindings.length && auditFindings.every(function(f){ return auditSel[f.id]; });
  h += '<div class="card" style="position:sticky;top:0;z-index:5">'
    + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<button class="btn o sm" onclick="auditSelectAll()">'+(allSelected?'Deselect all':'Select all '+auditFindings.length)+'</button>'
    + '<span class="muted">'+sel.length+' selected</span>'
    + '<div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<select id="auditRvReason" style="max-width:230px">'
    + Object.keys(REVISIT_REASONS).map(function(k){
        return '<option value="'+k+'"'+(k==='unverifiable'?' selected':'')+'>'+esc(REVISIT_REASONS[k])+'</option>'; }).join('')
    + '</select>'
    + '<button class="btn pu sm" onclick="bulkReshootFromAudit()" '+(auditBusy||!sel.length?'disabled':'')+'>'
    + icon('refresh')+' Send back out</button>'
    + '<button class="btn o sm" onclick="bulkDismiss()" '+(auditBusy||!sel.length?'disabled':'')+'>'
    + icon('check')+' Clear selected</button>'
    + '</div></div>'
    + '<div class="muted" style="font-size:.76rem;margin-top:8px">'
    + '<strong>Clear</strong> = you looked and it is fine or already handled; a reason is required and recorded. '
    + '<strong>Send back out</strong> = order a re-shoot; the stop moves to the re-shoot board and leaves this one. '
    + 'Either way it does not come back.</div>'
    + '</div>';

  var byCheck = {};
  auditFindings.forEach(function(f){ (byCheck[f.check_name]=byCheck[f.check_name]||[]).push(f); });
  // Severity first, then size. Note the lookup must not use `||` for a default:
  // red ranks 0, and `0 || 9` is 9, which sorted the worst findings to the
  // bottom of the page.
  var RANK = { red:0, amber:1, info:2 };
  var rank = function(k){ var v = RANK[byCheck[k][0].severity]; return v == null ? 9 : v; };
  var order = Object.keys(byCheck).sort(function(a,b){
    return rank(a)-rank(b) || byCheck[b].length-byCheck[a].length;
  });

  order.forEach(function(k){
    var meta = AUDIT_LABEL[k] || ['dim', k, ''];
    var rows = byCheck[k];
    var groupAll = rows.every(function(f){ return auditSel[f.id]; });
    h += '<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'

      + '<button class="btn o sm" style="flex:none" onclick="auditSelectAll(\''+k+'\')">'+(groupAll?'Deselect':'Select these '+rows.length)+'</button></div>';
    if(meta[2]) h += '<div class="hint">'+esc(meta[2])+'</div>';
    h += '<div style="overflow-x:auto;max-height:360px;overflow-y:auto"><table><thead><tr><th style="width:34px"></th><th>Date</th><th>Store</th><th>Serial</th><th class="hide">Tech</th><th>What the audit saw</th><th></th></tr></thead><tbody>';
    rows.forEach(function(f){
      var p = auditPm(f.pm_id, f);
      h += '<tr><td><input type="checkbox" '+(auditSel[f.id]?'checked':'')+' onclick="auditToggle('+f.id+')"></td>'
        + '<td style="white-space:nowrap">'+esc(p.pm_date||'')+'</td>'
        + '<td>'+esc(p.store||('report '+f.pm_id))+'</td>'
        + '<td class="mono" style="font-size:.8rem">'+esc(p.serial||'')+'</td>'
        + '<td class="hide">'+esc(p.tech_name||'')+'</td>'
        + '<td class="muted" style="font-size:.78rem">'+esc(f.detail)+'</td>'

// ═══ RE-VISIT — disconnect untrustworthy documentation and redo the stop ═══
// A re-visit says: whatever photographs are on this report cannot be relied on to
// document this unit. The images are NEVER deleted — they are moved aside into
// form_data.revisit_cleared_photos so the original submission stays intact — but they
// stop being presented as evidence, and the stop goes back on the route to be redone.
var REVISIT_REASONS = {
  no_plate_photo:  'No serial-plate photograph on file',
  wrong_unit_photo:'Photograph(s) showed another unit',
  unverifiable:    'Documentation cannot be verified',
  customer_dispute:'Disputed by the customer'
};

async function requestRevisit(id, reason){
  var p = completedPMs.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  var nPh = Array.isArray(p.photo_paths) ? p.photo_paths.length : 0;
  var msg = 'Order a RE-VISIT for this stop?\n\n'
    + (p.store||'') + '  ·  S/N ' + (p.serial||'') + '  ·  ' + (p.pm_date||'') + '\n'
    + 'Reason: ' + (REVISIT_REASONS[reason] || reason) + '\n\n'
    + 'This will:\n'
    + '  • disconnect ' + (nPh ? nPh + ' photograph' + (nPh===1?'':'s') : 'the photo evidence') + ' from this report\n'
    + '  • flag the stop to be serviced and documented again\n'
    + '  • keep the original submission on file (nothing is deleted)\n\n'
    + (p.billed ? 'NOTE: this PM has already been invoiced (' + (p.invoice_doc_number||'') + ').\nThe re-visit does not credit the invoice — handle that separately.\n\n' : '')
    + 'Continue?';
  if(!confirm(msg)) return;
  rvBusy = true; render();
  try{
    var cleared = Array.isArray(p.photo_paths) ? p.photo_paths.slice() : [];
    var note = 'RE-VISIT ORDERED ' + new Date().toISOString().slice(0,10) + ': '
      + (REVISIT_REASONS[reason] || reason)
      + '. The photograph(s) previously filed on this report have been disconnected and are no longer '
      + 'presented as documentation of this unit; they remain on file (revisit_cleared_photos). '
      + 'This stop is scheduled to be serviced and photographed again.';
    var { data: cur, error: readErr } = await sb.from('completed_pms')
      .select('form_data').eq('id', id).single();
    if(readErr) throw readErr;
    var fd = cur && cur.form_data ? cur.form_data : {};
    if(cleared.length) fd.revisit_cleared_photos = cleared;
    fd.audit_note = ((fd.audit_note ? fd.audit_note + ' ' : '') + note);
    var { error } = await sb.from('completed_pms').update({
      photo_paths: [], photo_hashes: [],
      revisit_requested_at: new Date().toISOString(),
      revisit_requested_by: (user && user.email) || 'admin',
      revisit_reason: reason,
      needs_review: true,
      form_data: fd,
      modified_at: new Date().toISOString(),
      modified_by: 're-visit ordered by ' + ((user && user.email) || 'admin')
    }).eq('id', id);
    if(error) throw error;
    await loadAll();
    toast('Re-visit ordered — evidence disconnected, stop queued for redo','ok');
  }catch(e){ toast('Could not order the re-visit: ' + e.message, 'err'); }
  rvBusy = false; render();
}

async function cancelRevisit(id){
  if(!confirm('Cancel this re-visit?\n\nThe stop goes back to normal. Photographs that were disconnected are NOT automatically re-attached — they stay on file under revisit_cleared_photos.')) return;
  rvBusy = true; render();
  try{
    var { error } = await sb.from('completed_pms').update({
      revisit_requested_at: null, revisit_requested_by: null, revisit_reason: null
    }).eq('id', id);
    if(error) throw error;
    await loadAll();
    toast('Re-visit cancelled','ok');
  }catch(e){ toast('Could not cancel: ' + e.message, 'err'); }
  rvBusy = false; render();
}

function revisitPicker(p){
  if(p.revisit_requested_at && !p.revisit_done_at){
    return '<span class="pill pu" title="Ordered by ' + esc(p.revisit_requested_by||'') + '">RE-VISIT</span> '
      + '<button class="btn o sm" onclick="cancelRevisit(' + p.id + ')" ' + (rvBusy?'disabled':'') + '>Cancel</button>';
  }
  var opts = Object.keys(REVISIT_REASONS).map(function(k){
    return '<option value="' + k + '">' + esc(REVISIT_REASONS[k]) + '</option>'; }).join('');
  return '<button class="btn pu sm" onclick="var r=document.getElementById(\'rvr_' + p.id + '\').value; requestRevisit(' + p.id + ', r)" '
    + (rvBusy?'disabled':'') + ' title="Disconnect this report\'s photo evidence and redo the stop">' + icon('refresh') + ' RE-VISIT</button>'
    + '<select id="rvr_' + p.id + '" style="margin-left:6px;padding:3px 6px;font-size:.72rem;max-width:150px">' + opts + '</select>';
}

// Ordering a re-visit, once. Called from the Report Issues tab and from the
// Nightly Audit tab — two entry points must not grow two slightly different
// ideas of what a re-visit does to a report.
async function orderReshootFor(ids, reason){
  var ok = 0, skipped = 0, fail = 0;
  for(var i=0;i<ids.length;i++){
    var p = completedPMs.filter(function(x){ return x.id === ids[i]; })[0];
    // Already open: ordering again would wipe the cleared-photo record it is
    // holding, which is the only copy of what was disconnected.
    if(!p || (p.revisit_requested_at && !p.revisit_done_at)) { skipped++; continue; }
    try{
      var cleared = Array.isArray(p.photo_paths) ? p.photo_paths.slice() : [];
      var { data: cur } = await sb.from('completed_pms').select('form_data').eq('id', p.id).single();
      var fd = cur && cur.form_data ? cur.form_data : {};
      if(cleared.length) fd.revisit_cleared_photos = cleared;
      fd.audit_note = ((fd.audit_note ? fd.audit_note + ' ' : '')
        + 'RE-VISIT ORDERED ' + new Date().toISOString().slice(0,10) + ': ' + (REVISIT_REASONS[reason]||reason)
        + '. Photograph(s) disconnected and kept on file; the stop is scheduled to be serviced and photographed again.');
      var { error } = await sb.from('completed_pms').update({
        photo_paths: [], photo_hashes: [],
        revisit_requested_at: new Date().toISOString(),
        revisit_requested_by: (user && user.email) || 'admin',
        revisit_reason: reason, needs_review: true, form_data: fd,
        modified_at: new Date().toISOString(),
        modified_by: 're-visit ordered by ' + ((user && user.email) || 'admin')
      }).eq('id', p.id);
      if(error) throw error; ok++;
    }catch(e){ fail++; }
  }
  return { ok: ok, skipped: skipped, fail: fail };
}

// Clearing an issue a re-shoot cannot answer.
//
// Two of the flags are questions for FRESHPET, not work for a tech: a serial
// that is not on their asset list, and a billing credit. Driving somebody back
// out changes nothing about either, so ordering a re-shoot is the wrong button
// and the row would otherwise sit on the board forever. This is the right one:
// it records what settled the question and takes the row off.
//
// The prior flag is written into the audit note before 'resolved' overwrites
// it, so clearing a row never erases what it was flagged for.
async function bulkMarkHandled(){
  var ids = riSelectedIds();
  if(!ids.length) return toast('Select the rows to clear','err');
  var why = prompt('Mark ' + ids.length + ' issue' + (ids.length===1?'':'s') + ' handled.\n\n'
    + 'Say what settled it. This is written onto each report and is the record of\n'
    + 'why it left the board.\n\n'
    + 'e.g. Freshpet confirmed both serials and added them to the asset list.');
  if(why === null) return;
  why = (why||'').trim();
  if(!why) return toast('Say what settled it — a row cannot leave the board silently','err');

  rvBusy = true; render();
  var ok = 0, skipped = 0, fail = 0;
  for(var i=0;i<ids.length;i++){
    var p = completedPMs.filter(function(x){ return x.id === ids[i]; })[0];
    // A stop the tech still owes is not handled. Its flags stay until the
    // re-shoot closes them (fn_close_revisit).
    if(!p || (p.revisit_requested_at && !p.revisit_done_at)) { skipped++; continue; }
    try{
      var { data: cur } = await sb.from('completed_pms').select('form_data').eq('id', p.id).single();
      var fd = cur && cur.form_data ? cur.form_data : {};
      fd.audit_note = ((fd.audit_note ? fd.audit_note + ' ' : '')
        + 'HANDLED ' + new Date().toISOString().slice(0,10) + ' by ' + ((user && user.email) || 'admin')
        + (p.audit_flag ? ' (was flagged: ' + p.audit_flag + ')' : '') + ': ' + why);
      var { error } = await sb.from('completed_pms').update({
        needs_review: false,
        audit_flag: p.audit_flag ? 'resolved' : null,
        form_data: fd,
        modified_at: new Date().toISOString(),
        modified_by: 'issue marked handled by ' + ((user && user.email) || 'admin')
      }).eq('id', p.id);
      if(error) throw error; ok++;
    }catch(e){ fail++; }
  }
  riSel = {};
  await loadAll();
  toast(ok + ' issue' + (ok===1?'':'s') + ' cleared'
    + (skipped ? ' · ' + skipped + ' skipped (re-shoot still open)' : '')
    + (fail ? ' · ' + fail + ' failed' : ''), fail ? 'err' : 'ok');
  rvBusy = false; render();
}

function bulkRevisit(){
  var ids = riSelectedIds();
  if(!ids.length) return toast('Select the stops to re-visit','err');
  var reason = document.getElementById('rvBulkReason').value;
  if(!confirm('Order a RE-VISIT for ' + ids.length + ' stop' + (ids.length===1?'':'s') + '?\n\n'
    + 'Reason: ' + (REVISIT_REASONS[reason]||reason) + '\n\n'
    + 'Each one has its photo evidence disconnected (kept on file) and goes back on the route to be redone.')) return;
  (async function(){
    rvBusy = true; render();
    var r = await orderReshootFor(ids, reason);
    var ok = r.ok, fail = r.fail;
    riSel = {};
    await loadAll();
    toast(ok + ' stop' + (ok===1?'':'s') + ' queued for re-visit' + (fail ? ' · ' + fail + ' failed' : ''), fail ? 'err' : 'ok');
    rvBusy = false; render();
  })();
}

// ═══ Report Issues to Freshpet ═══
function riList(){
  var q=(riSearch||'').trim().toLowerCase();
  return completedPMs.filter(function(p){
    if(p.prev_comp) return false;
    // The 'issues' view is what is NOT already on the re-shoot board; open
    // re-shoots have their own pill and banner.
    if(riFilter==='issues' && (p.revisit_requested_at && !p.revisit_done_at)) return false;
    if(riFilter==='issues' && !(addedAssetOpen(p) || p.needs_review)) return false;
    if(riFilter==='added' && !addedAssetOpen(p)) return false;
    if(riFilter==='review' && !p.needs_review) return false;
    if(riFilter==='revisit' && !(p.revisit_requested_at && !p.revisit_done_at)) return false;
    if(riFilter==='needphoto' && p.audit_flag!=='needs_plate_photo') return false;
    if(riFilter==='reused' && p.audit_flag!=='reused_photo') return false;
    if(riFilter==='noserial' && !p.no_serial_plate) return false;
    if(riFilter==='assetlist' && p.audit_flag!=='asset_list_confirm') return false;
    if(q && ((p.store||'')+' '+(p.serial||'')+' '+(p.tech_name||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function riToggle(id){ if(riSel[id]) delete riSel[id]; else riSel[id]=true; render(); }
function riSelectedIds(){ return Object.keys(riSel).filter(function(k){ return riSel[k]; }).map(Number); }
function riSelectAll(){
  var list=riList();
  var allSel=list.length && list.every(function(p){ return riSel[p.id]; });
  if(allSel){ list.forEach(function(p){ delete riSel[p.id]; }); }
  else { list.forEach(function(p){ riSel[p.id]=true; }); }
  render();
}
function riToggleRecip(e){ riPicked[e]=!riPicked[e]; riResult=null; render(); }

async function sendIssueReport(){
  var ids=riSelectedIds();
  if(!ids.length) return toast('Select at least one unit to report','err');
  var picked=SEND_RECIPIENTS.filter(function(e){ return riPicked[e]; });
  var typed=(riRecipients||'').split(/[,;\s]+/).map(function(s){return s.trim();}).filter(Boolean);
  var seen={}, recips=[];
  picked.concat(typed).forEach(function(e){ var k=e.toLowerCase(); if(!seen[k]){ seen[k]=1; recips.push(e); } });
  if(!recips.length) return toast('Select or enter at least one recipient','err');
  var bad=recips.filter(function(e){ return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); });
  if(bad.length) return toast('Invalid email: '+bad[0],'err');
  var nPhotos=0; completedPMs.forEach(function(p){ if(riSel[p.id] && Array.isArray(p.photo_paths)) nPhotos+=p.photo_paths.length; });
  if(!confirm('Email a cooler report to Freshpet?\n\n'+ids.length+' unit'+(ids.length===1?'':'s')+' · '
    +(riAttachPhotos?nPhotos+' photo'+(nPhotos===1?'':'s'):'no photos')+' · '
    +(riAttachPdfs?'signed PM reports attached':'no PDFs')+'\nTo: '+recips.join(', '))) return;
  riBusy=true; riResult=null; render();
  try{
    var token=await billToken();
    var res=await fetch(ISSUE_FN,{ method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+token },
      body:JSON.stringify({ pmIds:ids, recipients:recips, note:(riNote||'').trim(), attachPhotos:riAttachPhotos, attachPdfs:riAttachPdfs }) });
    var j=await res.json(); if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
    riResult=j; riSel={};
    await loadAll();
    toast('Report sent — '+j.count+' unit(s), '+j.attachedCount+' file(s) attached','ok');
  }catch(e){ toast('Send failed: '+e.message,'err'); }
  riBusy=false; render();
}

// ── Audits: the three views of one programme ────────────────────────────────
// The nightly audit finds problems, Report Issues is what we tell Freshpet
// about them, and a field-found asset is a finding about their asset list.
// Three tabs for one job is three places to check, and the reason a stop
// showed up on two boards at once. They are one section with sub-tabs now,
// each carrying its own count so the section badge is not the only number.
function auditOpenCounts(){
  var findings = auditFindings.filter(function(f){ return f.severity==='red'; }).length;
  var issues = completedPMs.filter(function(p){
    // A stop awaiting a re-shoot is counted by the re-shoot banner. Counting it
    // here too gives two numbers for one pile that never agree.
    if (p.revisit_requested_at && !p.revisit_done_at) return false;
    return !p.prev_comp && (addedAssetOpen(p) || p.needs_review) && !p.issue_emailed_at; }).length;
  var added = assets.filter(function(a){ return a.source==='field' && a.reported===false; }).length;
  return { findings:findings, issues:issues, added:added, total: findings + issues + added };
}

// ═══ Reactive / CSV upload ═══
function parseCSV(text){
  var rows=[], row=[], cur='', inQ=false;
  for(var i=0;i<text.length;i++){ var c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } } else { cur+=c; } }
    else if(c==='"'){ inQ=true; }
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); cur=''; if(row.some(function(x){return x.trim()!=='';})) rows.push(row); row=[]; }
    else if(c!=='\r'){ cur+=c; }
  }
  row.push(cur); if(row.some(function(x){return x.trim()!=='';})) rows.push(row);
  return rows;
}
var CSV_COLMAP = {
  store:['account name','store','store name'],
  address:['shipping address line 1','address','shipping street'],
  city:['shipping city','city'], state:['shipping state/province','state','state/province'],
  zip:['shipping zip/postal code','zip','zip/postal code','zip code','postal code'],
  phone:['phone'], manufacturer:['manufacturer'], model:['model'],
  serial:['asset: serial number','serial number','serial'],
  warranty:['warranty status','warranty'],
  warranty_end:['unit warranty end date','warranty end date','warranty end']
};
function mapCSVHeader(headerRow){
  var idx={}; headerRow.forEach(function(cell,i){ var n=cell.trim().toLowerCase().replace(/^location:\s*/,'');
    for(var f in CSV_COLMAP){ if(idx[f]===undefined && CSV_COLMAP[f].indexOf(n)>-1) idx[f]=i; } });
  return idx;
}
// Decide out-of-warranty (billable) from the Freshpet "Warranty Status" column.
// Live values are literally "OUT" (out of warranty → BILLED) and "UNDER" (under
// warranty → imported so we can verify coverage, but NOT billed). The status is
// authoritative; the "Unit Warranty End Date" is only a fallback when the
// status is blank/ambiguous. Admin can still flip any row in the review.
// Returns true = out of warranty (billable).
function isOutOfWarranty(status, end){
  var s=(status||'').trim().toLowerCase();
  // Under warranty → not billed
  if(/\bunder\b|in[\s-]?warranty|\bactive\b|\bcovered\b|\bvalid\b|\byes\b/.test(s)) return false;
  // Out of warranty / expired → billed
  if(/\bout\b|out[\s-]?of[\s-]?warranty|\bexpired\b|\bno\b|\bnone\b|n\/a/.test(s)) return true;
  // Blank/ambiguous status → use the warranty end date (past = expired = billed)
  var e=(end||'').trim(); if(e){ var d=Date.parse(e); if(!isNaN(d)) return d < Date.now(); }
  return true; // default to billable when nothing is known
}
// Turn a raw grid (array of arrays; row 0 = headers) into asset records.
function rowsToAssetRecords(raw){
  if(!raw || raw.length<2){ toast('File appears empty','err'); return null; }
  var idx=mapCSVHeader(raw[0].map(function(c){ return c==null?'':String(c); }));
  var need=['store','city','serial']; var miss=need.filter(function(f){ return idx[f]===undefined; });
  if(miss.length){ toast('File missing columns: '+miss.join(', '),'err'); return null; }
  var out=[], noSerial=0;
  for(var i=1;i<raw.length;i++){ var r=raw[i]||[];
    var g=function(f){ var v=idx[f]!==undefined ? r[idx[f]] : ''; return v==null?'':String(v).trim(); };
    var serial=g('serial'), store=g('store');
    if(!serial && !store) continue;   // truly empty row — skip
    if(!serial) noSerial++;            // keep it (serial can be filled in later); just count it
    out.push({ store:store, address:g('address'), city:g('city'), state:g('state')||'CA', zip:g('zip'),
      phone:g('phone'), manufacturer:g('manufacturer'), model:g('model'), serial:serial,
      warranty:g('warranty'), warranty_end:g('warranty_end') });
  }
  if(noSerial) toast(out.length+' assets loaded · '+noSerial+' have no serial number (still included)','info');
  return out;
}
function onReactiveCSV(input){
  var file=input.files&&input.files[0]; if(!file) return;
  rvFileName=file.name; rvMode=''; rvRows=null; rvReview=null; rvPMPreview=null; rvResult=null;
  var isXls=/\.xlsx?$/i.test(file.name);
  if(isXls && typeof XLSX==='undefined'){ toast('Excel reader not loaded — try a CSV, or reload','err'); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    var raw;
    try{
      if(isXls){
        var wb=XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        var ws=wb.Sheets[wb.SheetNames[0]];
        raw=XLSX.utils.sheet_to_json(ws, { header:1, blankrows:false, defval:'' });
      } else {
        raw=parseCSV(e.target.result);
      }
    }catch(err){ toast('Could not read file: '+err.message,'err'); return; }
    var out=rowsToAssetRecords(raw); if(!out) return;
    rvRows=out; render();
  };
  if(isXls) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}
function pickMode(m){ rvMode=m; rvResult=null;
  if(m==='reactive'){ rvReview = rvRows.map(function(x){ var oow=isOutOfWarranty(x.warranty, x.warranty_end); return Object.assign({}, x, { under_warranty:!oow, approved:true }); }); }
  if(m==='pm'){ buildPMPreview(); }
  render();
}
function toggleRvApprove(i){ rvReview[i].approved=!rvReview[i].approved; render(); }
function toggleRvWarranty(i){ rvReview[i].under_warranty=!rvReview[i].under_warranty; render(); }
// Indices of review rows matching the current warranty filter + search.
function rvShown(){
  var q=rvSearch.trim().toLowerCase();
  var out=[];
  (rvReview||[]).forEach(function(x,i){
    if(rvFilter==='out' && x.under_warranty) return;
    if(rvFilter==='under' && !x.under_warranty) return;
    if(q && ((x.store||'')+' '+(x.city||'')+' '+(x.serial||'')).toLowerCase().indexOf(q)<0) return;
    out.push(i);
  });
  return out;
}
function setRvFilter(f){ rvFilter=f; render(); }
function rvApproveShown(v){ rvShown().forEach(function(i){ rvReview[i].approved=v; }); render(); }

// ── PM reset ──
function buildPMPreview(){
  var bySerial={}; assets.forEach(function(a){ bySerial[a.serial]=a; });
  var fileSerials={}; rvRows.forEach(function(x){ fileSerials[x.serial]=1; });
  var completedSerials={}; completedPMs.forEach(function(p){ completedSerials[p.serial]=1; });
  var newCount=0, updateCount=0;
  rvRows.forEach(function(x){ if(bySerial[x.serial]) updateCount++; else newCount++; });
  // Un-reported field-added assets can't be in Freshpet's export yet — keep them.
  var deactivate=assets.filter(function(a){ return !fileSerials[a.serial] && !(a.source==='field' && a.reported===false); });
  var keptField=assets.filter(function(a){ return !fileSerials[a.serial] && a.source==='field' && a.reported===false; }).length;
  // assignments dropped = those whose asset is completed; kept = uncompleted
  var completedAssignments = assignments.filter(function(a){ var as=assetById(a.asset_id); return as && completedSerials[as.serial]; });
  rvPMPreview={ newCount:newCount, updateCount:updateCount, deactivate:deactivate, keptField:keptField, dropAssign:completedAssignments.length, keepAssign:assignments.length-completedAssignments.length };
  render();
}
async function applyPMReset(){
  if(!rvRows) return;
  var p=rvPMPreview||{};
  if(!confirm('This resets the PM routes loaded as of '+new Date().toLocaleDateString()+'.\n\n• '+p.newCount+' new locations added (unassigned)\n• '+p.updateCount+' existing updated\n• '+(p.deactivate?p.deactivate.length:0)+' removed (deactivated)\n• '+p.dropAssign+' completed stops unassigned; '+p.keepAssign+' pending assignments kept\n\nAll completed PM history is preserved. Continue?')) return;
  rvBusy=true; render();
  try{
    // Upsert assets by serial
    var bySerial={}; assets.forEach(function(a){ bySerial[a.serial]=a; });
    var completedSerials={}; completedPMs.forEach(function(x){ completedSerials[x.serial]=1; });
    for(var i=0;i<rvRows.length;i++){ var x=rvRows[i]; var ex=bySerial[x.serial];
      var rec={ store:x.store, address:x.address, city:x.city, state:x.state, zip:x.zip, phone:x.phone,
        manufacturer:x.manufacturer, model:x.model, serial:x.serial, warranty:x.warranty, active:true };
      if(ex){ await sb.from('assets').update(rec).eq('id', ex.id); }
      else { await sb.from('assets').insert(rec); }
    }
    // Deactivate assets not in the file (un-reported field-added assets are
    // kept — Freshpet's export can't contain them yet)
    var fileSerials={}; rvRows.forEach(function(x){ fileSerials[x.serial]=1; });
    var deact=assets.filter(function(a){ return !fileSerials[a.serial] && !(a.source==='field' && a.reported===false); }).map(function(a){ return a.id; });
    if(deact.length){ await sb.from('assets').update({ active:false }).in('id', deact); }
    // Drop route assignments for COMPLETED assets; keep pending ones
    var dropIds=assignments.filter(function(a){ var as=assetById(a.asset_id); return as && completedSerials[as.serial]; }).map(function(a){ return a.asset_id; });
    if(dropIds.length){ await sb.from('route_assignments').delete().in('asset_id', dropIds); }
    await loadAll();
    rvRows=null; rvMode=''; rvPMPreview=null; rvBusy=false;
    toast('PM routes reset — new locations loaded, pending assignments kept','ok'); render();
  }catch(e){ rvBusy=false; toast('Reset failed: '+e.message,'err'); render(); }
}

function composeDenyEmail(){

    + '\n\nThank you.';

// Approve = SAVE the shown+approved accounts to this quarter's (draft) batch, then
// clear them out of the review list. Under-warranty accounts are saved too
// (billable=false) so they're kept on record for coverage lookups; only
// out-of-warranty accounts count toward billing. Invoicing is a separate step
// (per-batch, below) so completion/saving is independent of billing.
async function saveApprovedToQuarter(){
  if(!rvReview) return;
  var idxs=rvShown().filter(function(i){ return rvReview[i].approved; });
  if(!idxs.length) return toast('No approved rows shown to save (denied rows stay for the removal email)','err');
  var q=(rvQuarter||'').trim();
  if(!q) return toast('Enter a Quarter label first (e.g. 2026 Q3)','err');
  var loc=(rvLocation||'').trim();
  var rate=Number(rvRate)||30;
  // New reactive data ALWAYS purges old: any dataset from a different quarter is
  // replaced when we start saving this one, so the saved set + warranty lookup
  // only ever reflect the current reactive billing data.
  var stale=rvBatches.filter(function(b){ return (b.quarter_label||'')!==q; });
  if(stale.length){
    var staleN=rvSaved.filter(function(a){ return stale.some(function(b){ return b.id===a.batch_id; }); }).length;
    var staleInv=stale.filter(function(b){ return b.status==='invoiced'; }).length;
    if(!confirm('Saving to "'+q+'" will PURGE '+stale.length+' older reactive dataset'+(stale.length===1?'':'s')+' ('+staleN+' saved account'+(staleN===1?'':'s')+(staleInv?', incl. '+staleInv+' already invoiced':'')+') so the new data fully replaces the old.\n\nThe QBO invoices themselves are NOT deleted — only our saved records + portal listings. Continue?')) return;
  }
  rvBusy=true; render();
  try{
    // purge the stale (other-quarter) datasets first
    if(stale.length){
      var staleIds=stale.map(function(b){ return b.id; });
      var dpa=await sb.from('reactive_assets').delete().in('batch_id', staleIds); if(dpa.error) throw new Error(dpa.error.message);
      var dpb=await sb.from('reactive_batches').delete().in('id', staleIds); if(dpb.error) throw new Error(dpb.error.message);
      rvBatches=rvBatches.filter(function(b){ return staleIds.indexOf(b.id)<0; });
      rvSaved=rvSaved.filter(function(a){ return staleIds.indexOf(a.batch_id)<0; });
    }
    // find or create the draft batch for this quarter + location
    var batch=rvBatches.find(function(b){ return b.status==='draft' && (b.quarter_label||'')===q && (b.location||'')===loc; });
    var batchId;
    if(batch){ batchId=batch.id; }
    else {
      var bIns=await sb.from('reactive_batches').insert({ quarter_label:q, location:loc||null, rate:rate, status:'draft', created_by:user.email }).select('id').single();
      if(bIns.error) throw new Error(bIns.error.message);
      batchId=bIns.data.id;
    }
    // dedup by serial against what's already saved in this batch (only for
    // rows that actually have a serial — blank serials are never collapsed)
    var existing={}; rvSaved.forEach(function(a){ if(a.batch_id===batchId && a.serial) existing[a.serial.toUpperCase()]=1; });
    var toSave=idxs.map(function(i){ return rvReview[i]; }).filter(function(x){ return !(x.serial && existing[x.serial.toUpperCase()]); });
    if(toSave.length){
      var rows=toSave.map(function(x){ return { batch_id:batchId, store:x.store, address:x.address, city:x.city, state:x.state, zip:x.zip,
        serial:x.serial, model:x.model, manufacturer:x.manufacturer, under_warranty:!!x.under_warranty, billable:!x.under_warranty, approved:true }; });
      var aIns=await sb.from('reactive_assets').insert(rows); if(aIns.error) throw new Error(aIns.error.message);
    }
    // clear the saved rows out of the review list
    var saveSet={}; idxs.forEach(function(i){ saveSet[i]=1; });
    rvReview=rvReview.filter(function(x,i){ return !saveSet[i]; });
    // refresh saved accounts + batches, then recompute this batch's counts
    await loadAll();
    var mine=rvSaved.filter(function(a){ return a.batch_id===batchId; });

// Bill a saved quarter: posts the QBO FP-QRB invoice for the out-of-warranty
// accounts saved in the batch, renders the PDF, and adds it to the portal.
async function invoiceBatch(id){
  var b=rvBatches.find(function(x){ return x.id===id; }); if(!b) return;
  var mine=rvSaved.filter(function(a){ return a.batch_id===b.id; });
  var bill=mine.filter(function(a){ return a.billable && !a.under_warranty; });
  if(!bill.length) return toast('No out-of-warranty accounts saved in this quarter to bill','err');
  var rate=Number(b.rate)||30;
  if(!confirm('Create the Quarterly Reactive invoice for '+(b.quarter_label||'this quarter')+'?\n\n'+mine.length+' accounts saved · '+bill.length+' out-of-warranty billed @ '+money(rate)+' = '+money(bill.length*rate)+'.\n\nThis posts a real QBO invoice (FP-QRB) and adds it to the portal.')) return;
  rvBusy=true; rvResult=null; render();
  try{
    var token=(await sb.auth.getSession()).data.session.access_token;
    var ref=b.invoice_ref;
    if(!ref){ var refRes=await sb.rpc('fp_next_qrb_ref'); if(refRes.error) throw new Error(refRes.error.message); ref=refRes.data;
      var uRef=await sb.from('reactive_batches').update({ invoice_ref:ref }).eq('id', b.id); if(uRef.error) throw new Error(uRef.error.message); }
    var res=await fetch(QUARTERLY_FN,{ method:'POST', headers:{ 'Content-Type':'application/json','Authorization':'Bearer '+token },
      body:JSON.stringify({ mode:'create', batchId:b.id, rate:rate, recipientEmail:(rvRecipient||'').trim() }) });
    var j=await res.json(); if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
    rvResult=j; await loadAll();
    toast('Invoice '+(j.invoice&&j.invoice.ref)+' created','ok');
  }catch(e){ toast('Failed: '+e.message,'err'); }
  rvBusy=false; render();
}
// Delete an old saved reactive dataset (batch + its saved accounts). The QBO
// invoice, if any, is not touched — only our saved record + portal listing.
async function deleteBatch(id){
  var b=rvBatches.find(function(x){ return x.id===id; }); if(!b) return;
  var n=rvSaved.filter(function(a){ return a.batch_id===id; }).length;
  if(!confirm('Delete this saved reactive dataset?\n\n'+(b.quarter_label||'(no quarter)')+(b.location?(' · '+b.location):'')+'\n'+n+' saved account'+(n===1?'':'s')
    +(b.status==='invoiced'?('\nInvoice '+(b.invoice_ref||'')+' — the QBO invoice is NOT deleted, only this saved record + portal listing.'):'')
    +'\n\nThis cannot be undone.')) return;
  rvBusy=true; render();
  try{
    var da=await sb.from('reactive_assets').delete().eq('batch_id', id); if(da.error) throw new Error(da.error.message);
    var db=await sb.from('reactive_batches').delete().eq('id', id); if(db.error) throw new Error(db.error.message);
    await loadAll(); rvBusy=false; toast('Deleted','ok'); render();
  }catch(e){ rvBusy=false; toast('Delete failed: '+e.message,'err'); render(); }
}

function reactiveInvoiceList(){ return (rvBatches||[]).filter(function(b){ return b.status==='invoiced' && b.invoice_ref; }); }
function pmInvoiceList(){
  var map={};
  (completedPMs||[]).forEach(function(p){ if(!p.invoice_doc_number) return; var k=String(p.invoice_doc_number);
    if(!map[k]) map[k]={ ref:k, count:0, total:0, min:null, max:null };
    var g=map[k]; g.count++; g.total+=Number(p.bill_amount||0);
    if(p.pm_date){ if(!g.min||p.pm_date<g.min) g.min=p.pm_date; if(!g.max||p.pm_date>g.max) g.max=p.pm_date; }
  });
  return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return a.ref<b.ref?1:-1; });
}
function setSiType(t){ siType=t; siRef=''; siResult=null; render(); }

async function sendInvoiceEmail(){
  var ref=(siRef||'').trim(); if(!ref) return toast('Pick an invoice first','err');
  var picked=SEND_RECIPIENTS.filter(function(e){ return siPicked[e]; });
  var typed=(siRecipients||'').split(/[,;\s]+/).map(function(s){return s.trim();}).filter(Boolean);
  var seen={}, recips=[];
  picked.concat(typed).forEach(function(e){ var k=e.toLowerCase(); if(!seen[k]){ seen[k]=1; recips.push(e); } });
  if(!recips.length) return toast('Select or enter at least one recipient','err');
  var bad=recips.filter(function(e){ return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); });

  siBusy=true; siResult=null; render();
  try{

      body:JSON.stringify({ type:siType, ref:ref, recipients:recips, attachPdf:!!siAttach }) });

      h += '<tr><td>'+esc(a.store||'')+'</td><td class="hide">'+esc(a.city||'')+'</td><td class="mono" style="font-size:.8rem">'+esc(a.serial||'')+'</td>'
        + '<td>'+esc(b.quarter_label||'')+'</td>'
        + '<td>'+(a.under_warranty?'<span class="pill">'+icon('shield')+' Under</span>':'<span class="pill am">'+icon('dollar')+' Out</span>')+'</td></tr>';
    });
    if(savedShown.length>500){ h += '<tr><td colspan="5" class="muted" style="text-align:center">Showing first 500 of '+savedShown.length+' — refine your search.</td></tr>'; }
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}

init();
</script>
