function renderRoute() {
  var h = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
    '<button class="btn back-btn" onclick="goHome()">←</button>' +
    '<h2 style="margin:0;flex:1">'+icon('map')+' My Route</h2>' +
  '</div>';

  if (myRoute.length === 0) {
    h += '<div class="card" style="text-align:center;padding:40px 16px">' +
      '<p style="font-size:16px;margin-bottom:8px">No route assigned yet</p>' +
      '<p style="color:var(--dim);font-size:13px">Ask your admin to assign stops to your route.</p>' +
    '</div>';
    return h;
  }

  // Group by stop_order to form stops
  var stops = [];
  var seenOrder = {};
  myRoute.forEach(function(r) {
    var key = r.stop_order;
    if (!seenOrder[key]) {
      seenOrder[key] = { order: r.stop_order, assets: [r.asset], address: r.asset.address, city: r.asset.city, state: r.asset.state, zip: r.asset.zip, store: r.asset.store };
      stops.push(seenOrder[key]);
    } else {
      seenOrder[key].assets.push(r.asset);
    }
  });

  // Sort by order
  stops.sort(function(a, b) { return a.order - b.order; });

  // Determine completion status of each stop
  var today = new Date().toISOString().split('T')[0];
  stops.forEach(function(s) {
    s.allDone = s.assets.every(function(a) { return isCompleted(a.serial); });
    s.someDone = s.assets.some(function(a) { return isCompleted(a.serial); });
    s.hasRevisit = s.assets.some(function(a) { return isRevisit(a.serial); });
  });

  var doneCount = stops.filter(function(s) { return s.allDone; }).length;

  h += '<div class="card" style="text-align:center">' +
    '<div style="font-size:24px;font-weight:700">' + doneCount + '/' + stops.length + '</div>' +
    '<div style="color:var(--dim);font-size:16px">Stops Completed</div>' +
    '<div class="progress-bar"><div class="fill" style="width:' + (stops.length > 0 ? (doneCount / stops.length * 100) : 0) + '%"></div></div>' +
  '</div>';

  // Start/End day: re-optimize remaining stops from wherever you are
  if (doneCount < stops.length) {
    if (startingDay) {
      h += '<div class="card" style="text-align:center"><span class="spinner"></span> Locating start point &amp; optimizing route...</div>';
    } else if (localStorage.getItem('fp_day_on')) {
      h += '<button class="btn btn-o" style="margin-bottom:10px;border-color:var(--rd);color:var(--rd)" onclick="endDay()">'+icon('octagon')+' Complete Day</button>';
    } else {
      h += '<div class="card">';
      h += lbl('Start from (address, city or zip — leave blank to use GPS)');
      h += '<input type="text" id="startAddr" placeholder="e.g. 1200 Main St, San Jose">';
      h += '<button class="btn btn-s" onclick="startDay()">'+icon('play')+' Start Day — Optimize From Here</button>';
      h += '</div>';
    }
  }

  var doneStops = [];
  stops.forEach(function(s, i) {
    // A finished stop leaves the route list. It is collected below instead, so
    // what is on screen is exactly what is still owed.
    if (s.allDone) { doneStops.push({ s: s, i: i }); return; }
    var isCurrent = !s.allDone && (i === 0 || stops[i-1].allDone);
    var cls = s.allDone ? 'completed' : (isCurrent ? 'current' : '');
    var numCls = s.allDone ? 'done' : (isCurrent ? 'current' : 'pending');

    h += '<div class="stop-card ' + cls + '" id="stop' + i + '">';
    // Blue banner across the top of the store card when any unit here is due an
    // audit, in the same blue as the form and the report. The per-unit flags say
    // which machine; this says "this stop is not a normal stop" before you have
    // read a single sub-card.
    if (s.hasRevisit) {
      h += '<div style="margin:-2px 0 10px;padding:8px 11px;border:1px solid #8FC4EA;border-left-width:4px;'
        + 'border-left-color:#155E9B;border-radius:8px;background:#E2EFF9;'
        + 'font-weight:800;font-size:14px;color:#155E9B;letter-spacing:.03em">SECONDARY VISIT AUDIT</div>';
    }
    h += '<div style="display:flex;align-items:flex-start;gap:4px">';
    h += '<span class="stop-num ' + numCls + '">' + (s.allDone ? '✓' : (i+1)) + '</span>';
    h += '<div style="flex:1">';
    h += '<strong style="font-size:20px">' + esc(s.store) + '</strong>';
    if (isCurrent) { h += ' <span class="badge">Current</span>'; }
    h += '<br><span style="font-size:17px;color:var(--ac);text-decoration:underline;cursor:pointer" onclick="openNavigation(\'' + esc(s.address).replace(/'/g, "\\'") + '\',\'' + esc(s.city).replace(/'/g, "\\'") + '\',\'' + esc(s.state).replace(/'/g, "\\'") + '\',\'' + esc(s.zip).replace(/'/g, "\\'") + '\')">' + esc(s.address) + ', ' + esc(s.city) + '</span>';
    h += '<br><span style="font-size:16px;color:var(--dim)">' + s.assets.length + ' asset(s)';
    var doneSoFar = s.assets.filter(function(a) { return isCompleted(a.serial); }).length;
    if (doneSoFar > 0 && !s.allDone) { h += ' &bull; ' + doneSoFar + ' done'; }
    h += '</span>';

    h += '<div style="margin-top:8px">';
    h += '<button class="nav-btn" onclick="openNavigation(\'' + esc(s.address).replace(/'/g, "\\'") + '\',\'' + esc(s.city).replace(/'/g, "\\'") + '\',\'' + esc(s.state).replace(/'/g, "\\'") + '\',\'' + esc(s.zip).replace(/'/g, "\\'") + '\')">'+icon('map')+' Navigate</button>';
    h += '</div>';

    // "There may be another cooler here." Said BEFORE the unit list, because it
    // is an instruction about the store, not about any machine on it — and
    // because a tech who is not told to look has no reason to.
    var cands = candidatesAt(s.store);
    if (cands.length) {
      h += '<div style="margin:10px 0 0;padding:10px 12px;border:1px solid var(--or);border-left-width:4px;'
        + 'border-radius:9px;background:rgba(229,106,21,.09)">'
        + '<div style="font-weight:800;font-size:14px;color:var(--or);letter-spacing:.02em">'
        + icon('alert') + ' CHECK FOR ' + (cands.length === 1 ? 'ANOTHER COOLER' : cands.length + ' MORE COOLERS') + ' HERE</div>'
        + '<div style="font-size:13px;color:var(--dim);margin-top:4px">'
        + 'Our records say this store may have a unit that is not on the list. '
        + 'Walk the store. If you find one, use <strong>Add an asset</strong> below and do a full PM on it. '
        + 'If there is only what is listed, tell the office \u2014 that closes it too.</div>'
        + cands.map(function(c){
            return '<div style="font-size:12px;color:var(--dim);margin-top:6px">'
              + (c.serial_read ? 'Plate photographed reads <strong class="mono">' + esc(c.serial_read) + '</strong>'
                               : 'Reported by the technician on a previous visit')
              + (c.units_listed != null ? ' \u00b7 list carries ' + c.units_listed : '') + '</div>';
          }).join('')
        + '</div>';
    }

    // Every unit at this store, on the store card. The tech picks the next one
    // from here instead of walking back out to a stop screen — at a store with
    // three coolers that was a screen change per unit for no reason.
    // Units already documented at this store are folded away for the same
    // reason the finished stops are — on a re-shoot stop the owed unit is the
    // whole point and a done one beside it reads as noise.
    var openUnits = s.assets.filter(function(a) { return !isCompleted(a.serial); });
    var doneUnits = s.assets.filter(function(a) { return isCompleted(a.serial); });
    openUnits.forEach(function(a) { h += unitCard(a, i); });
    if (doneUnits.length) {
      h += '<button class="btn btn-o" style="margin:8px 0 0;padding:8px;font-size:13px;color:var(--dim);border-color:var(--bd)" '
        + 'onclick="event.stopPropagation();toggleDoneUnits(' + i + ')">'
        + (doneUnitsOpen[i] ? 'Hide' : 'Show') + ' ' + doneUnits.length + ' already done at this store</button>';
      if (doneUnitsOpen[i]) { doneUnits.forEach(function(a) { h += unitCard(a, i); }); }
    }

    // Adding a unit belongs to the STORE, not to any one machine on it — the
    // unit being added is by definition not on the list yet.
    // Everything that is NOT "service this unit" collects on one strip at the
    // bottom. Hung off each unit these buttons doubled the height of the card
    // and buried the only thing a tech is looking for, which is the machine.
    h += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px">';
    h += '<button class="btn btn-o" style="flex:1 1 100%;margin:0;padding:10px;font-size:14px" onclick="goAddAssetForStop(' + i + ')">'
      + icon('plus') + ' Add an asset</button>';
    // A closed door is a fact about the STORE and answers every unit at once, so
    // it belongs here. A missing MACHINE is a fact about that machine, so it
    // lives on the unit's own card on the next screen instead.
    if (!s.allDone) {
      h += '<button class="btn btn-o" style="flex:1;min-width:120px;margin:0;padding:10px;font-size:14px;border-color:var(--rd);color:var(--rd)" '
        + 'onclick="startStoreClosed(' + i + ')">' + icon('alert') + ' Store closed</button>';
    }
    h += '</div>';

    h += '</div></div></div>';
  });

  if (doneStops.length) {
    h += '<button class="btn btn-o" style="margin-top:14px;padding:12px;font-size:15px;color:var(--dim);border-color:var(--bd)" '
      + 'onclick="toggleDoneStops()">' + icon('check') + ' Already done \u2014 ' + doneStops.length + ' stop'
      + (doneStops.length === 1 ? '' : 's') + (showDoneStops ? ' (hide)' : ' (show)') + '</button>';
    if (showDoneStops) {
      h += '<div style="font-size:13px;color:var(--dim);margin:8px 0 4px">Finished stops. Tap a unit to reopen the report you filed.</div>';
      doneStops.forEach(function(d) {
        h += '<div class="stop-card completed" id="stop' + d.i + '">';
        h += '<div style="display:flex;align-items:flex-start;gap:4px">';
        h += '<span class="stop-num done">\u2713</span>';
        h += '<div style="flex:1">';
        h += '<strong style="font-size:18px">' + esc(d.s.store) + '</strong>';
        h += '<br><span style="font-size:14px;color:var(--dim)">' + esc(d.s.city) + ' \u00b7 '
          + d.s.assets.length + ' asset(s) documented</span>';
        d.s.assets.forEach(function(a) { h += unitCard(a, d.i); });
        h += '</div></div></div>';
      });
    }
  }

  return h;
}

async function saveNewAsset() {
  if (addingAsset || !addAssetStop) return;
  var man = ((document.getElementById('naMan') || {}).value || '').trim();
  var model = ((document.getElementById('naModel') || {}).value || '').trim();
  var serial = ((document.getElementById('naSerial') || {}).value || '').trim();
  var warranty = ((document.getElementById('naWarranty') || {}).value || 'OUT');
  var noSerial = !!addAssetNoSerial;
  if (noSerial) {
    // Visibly not a manufacturer serial. assets.serial is NOT NULL and every
    // lookup joins on it, so the row needs a value — but the value must never
    // be mistakable for the real thing, and no_serial is what code reads.
    serial = 'NO-SERIAL-' + new Date().toISOString().split('T')[0].replace(/-/g,'') + '-' +
             Math.random().toString(36).slice(2,6).toUpperCase();
  } else if (!serial) {
    showStatus('Enter the serial number, or tick NO SERIAL NUMBER', 'err'); return;
  }
  var dup = ASSETS.find(function(a) { return (a.serial || '').toUpperCase() === serial.toUpperCase(); });
  if (dup) { showStatus('S/N ' + serial + ' already exists (' + dup.store + ')', 'err'); return; }

  addingAsset = true;
  render();
  try {
    var ref = addAssetStop.assets[0]; // sibling unit at this address — copy the store identity
    var { data: newAsset, error } = await sb.from('assets').insert({
      store: ref.store, address: ref.address, city: ref.city, state: ref.state, zip: ref.zip,
      phone: ref.phone || '', manufacturer: man, model: model, serial: serial, warranty: warranty,
      no_serial: noSerial,
      pm_fee: ref.pm_fee || 0, lat: ref.lat, lng: ref.lng,
      active: true, source: 'field', reported: false,
      added_by: currentUser.email, added_at: new Date().toISOString()
    }).select().single();
    if (error) { throw new Error(error.message); }

    // The candidate that predicted this unit is now answered by the unit itself.
    // Closing it here is what makes "he'll just add it" actually close the loop
    // — otherwise the office is still chasing a store the tech has already
    // settled. Best-effort: a failed close never costs the asset.
    try {
      var openHere = candidatesAt(ref.store).filter(function(c){ return c.status === 'open'; });
      if (openHere.length) {
        await sb.from('asset_list_candidates').update({
          status: 'confirmed', asset_id: newAsset.id,
          resolution: 'Confirmed on site ' + new Date().toISOString().slice(0,10) + ' by '
            + (currentUser.email || 'the technician') + ' — the unit was found and added from the route'
            + (noSerial ? ' with no readable serial plate.' : ' as S/N ' + serial + '.'),
          resolved_at: new Date().toISOString(),
          resolved_by: currentUser.email || 'field'
        }).eq('id', openHere[0].id);
        await loadAssetCandidates();
      }
    } catch (e) { /* the asset is what matters; the office can close the row */ }

    // Pin the new unit onto MY route at this same stop so it stays with the
    // store (best-effort — the PM works either way).
    try {
      await sb.from('route_assignments').insert({
        tech_email: currentUser.email, asset_id: newAsset.id,
        stop_order: addAssetStop.order, route_name: 'Primary Route', active: true
      });
    } catch (e) {}

    await loadAssets();
    await loadMyRoute();
    addingAsset = false;
    addAssetStop = null;
    var idx = ASSETS.findIndex(function(a) { return a.id === newAsset.id; });
    if (idx === -1) {
      showStatus('Asset saved — find it under Browse All Assets to run the PM', 'err');
      backToRoute(currentStopIdx);
      return;
    }
    startChecklistFromRoute(idx, currentStopIdx);
    addedAssetFlag = true;
    saveProgress();
    showStatus('Asset added — now complete the full PM', 'ok');
  } catch (err) {
    addingAsset = false;
    showStatus('Could not add asset: ' + err.message, 'err');
    render();
  }
}

// ===== Start / End Day =====
var startingDay = false;

function endDay() {
  localStorage.removeItem('fp_day_on');
  showStatus('Day ended — hit Start Day to pick back up', 'info');
  render();
}

function getPosition() {
  return new Promise(function(resolve) {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      function() { resolve(null); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

async function geocodeAddress(q) {
  q = q.trim();
  if (/^\d{5}$/.test(q)) {
    try {
      var d = await (await fetch('https://api.zippopotam.us/us/' + q)).json();
      var p = d.places && d.places[0];
      if (p) return { lat: parseFloat(p.latitude), lng: parseFloat(p.longitude) };
    } catch (e) {}
  }
  try {
    var r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q));
    var j = await r.json();
    if (j && j[0]) return { lat: parseFloat(j[0].lat), lng: parseFloat(j[0].lon) };
  } catch (e) {}
  return null;
}

async function startDay() {
  if (startingDay) return;
  var addrEl = document.getElementById('startAddr');
  var startAddr = addrEl ? addrEl.value.trim() : '';
  startingDay = true;
  render();

  try {
    var origin = null;
    if (startAddr) {
      origin = await geocodeAddress(startAddr);
      if (!origin) {
        startingDay = false;
        showStatus('Could not find "' + startAddr + '" — try a city or zip code', 'err');
        render();
        return;
      }
    } else {
      origin = await getPosition();
    }
    var stops = getRouteStops();
    var doneStops = stops.filter(function(s) { return s.assets.every(function(a) { return isCompleted(a.serial); }); });
    var todo = stops.filter(function(s) { return !s.assets.every(function(a) { return isCompleted(a.serial); }); });

    if (!origin) {
      // No GPS: start from the last completed stop, or keep current order
      var last = doneStops[doneStops.length - 1];
      if (last && last.assets[0]) { origin = { lat: last.assets[0].lat, lng: last.assets[0].lng }; }
    }

    if (origin && todo.length > 1) {
      // Nearest-neighbor over the remaining stops from the origin
      var ordered = [];
      var remaining = todo.slice();
      var cur = origin;
      while (remaining.length > 0) {
        var nearIdx = 0, nearDist = Infinity;
        for (var i = 0; i < remaining.length; i++) {
          var a0 = remaining[i].assets[0];
          var d = haversine(cur.lat, cur.lng, a0.lat, a0.lng);
          if (d < nearDist) { nearDist = d; nearIdx = i; }
        }
        ordered.push(remaining[nearIdx]);
        cur = { lat: remaining[nearIdx].assets[0].lat, lng: remaining[nearIdx].assets[0].lng };
        remaining.splice(nearIdx, 1);
      }
      todo = ordered;
    }

    // Persist new order: completed stops first, then re-optimized remainder
    var seq = doneStops.concat(todo);
    for (var s = 0; s < seq.length; s++) {
      var ids = [];
      myRoute.forEach(function(r) { if (r.stop_order === seq[s].order) ids.push(r.id); });
      if (ids.length) {
        var { error } = await sb.from('route_assignments').update({ stop_order: s }).in('id', ids);
        if (error) { throw new Error(error.message); }
      }
    }

    localStorage.setItem('fp_day_on', '1');
    await loadMyRoute();
    startingDay = false;
    showStatus(origin ? ('Day started — route optimized from ' + (startAddr || 'your location')) : 'Day started (location unavailable — order unchanged)', 'ok');
    render();
  } catch (err) {
    startingDay = false;
    showStatus('Error reordering route: ' + err.message, 'err');
    render();
  }
}

function getRouteStops() {
  var stops = [];
  var seenOrder = {};
  myRoute.forEach(function(r) {
    var key = r.stop_order;
    if (!seenOrder[key]) {
      seenOrder[key] = { order: r.stop_order, assets: [r.asset], address: r.asset.address, city: r.asset.city, state: r.asset.state, zip: r.asset.zip, store: r.asset.store };
      stops.push(seenOrder[key]);
    } else {
      seenOrder[key].assets.push(r.asset);
    }
  });
  stops.sort(function(a, b) { return a.order - b.order; });
  return stops;
}

// "First L." from the tech profile / Google account
function shortTechName() {
  var full = myName || (currentUser && currentUser.user_metadata && currentUser.user_metadata.full_name) || (currentUser ? currentUser.email.split('@')[0] : '');
  var parts = full.trim().split(/\s+/);
  if (parts.length >= 2) { return parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.'; }
  return parts[0] || '';
}

// Identity fields only. Readings and work items start EMPTY on purpose:
// invoice #172825 went out with 184/196 reports carrying the old prefilled
// 38°F/41°F and pre-checked work boxes — reviewers correctly read those as
// unexamined defaults, not observations. A reading now exists on a report
// only because the tech entered it.
function defaultForm() {
  var name = shortTechName();
  return {
    techName: name,
    serviceCompany: 'Freeflow Beverage Solutions',
    serviceRep: name,
    date: new Date().toISOString().split('T')[0]
  };
}

// A re-shoot starts from the ORIGINAL report, not from a blank form. We were at
// this store once and a manager signed for that visit; the re-shoot exists
// because the photographs could not be stood behind, not because the visit was
// invented. So the earlier answers come forward as the starting point, the
// readings are retaken, and the store's signature is carried as a record of the
// original visit rather than re-collected — nobody is asked to sign twice for
// one service call, and no manager is asked to sign for readings taken on a day
// they were not shown.
//
// Only the report's own fields travel. Photographs, audit notes, correction
// bookkeeping and the previous re-visit flags are deliberately left behind: a
// re-shoot's whole purpose is new pictures.
var RESHOOT_DROP_KEYS = [
  'audit_note','original_photo_paths','original_pdf_path','corrected_pdf_path',
  'detached_photos','detach_prior_photo_paths','field_form_scan','asset_list_undercount',
  'legacy','legacy_link','legacy_note','tech_name',
  'reshoot_of_pm_id','original_date','original_signed_at','original_store_contact',
  'original_signature','reshoot_date','storeSignature','techSignature'
];
function reshootFormFrom(pm) {
  var src = pm.form_data || {};
  var f = {};
  Object.keys(src).forEach(function(k) {
    if (RESHOOT_DROP_KEYS.indexOf(k) < 0) f[k] = src[k];
  });
  var me = shortTechName();
  f.techName = me;
  f.serviceRep = me;
  f.serviceCompany = src.serviceCompany || 'Freeflow Beverage Solutions';
  f.date = new Date().toISOString().split('T')[0];
  // The readings are the point of going back. Blank them so they are measured
  // again rather than inherited — an inherited 38F is the original defect.
  f.intTemp = ''; f.sp1 = ''; f.voltage = ''; f.noMeter = false;
  // What the original visit attests to, recorded as provenance.
  f.reshoot_of_pm_id = pm.id;
  f.original_date = pm.pm_date || '';
  f.original_signed_at = pm.signed_at || null;
  f.reshoot_date = f.date;
  var signed = !src.noContact && (src.storeSignature || (src.storeContact || '').trim());
  if (signed) {
    f.original_store_contact = (src.storeContact || '').trim();
    if (src.storeSignature) f.original_signature = src.storeSignature;
    f.noContact = false;
  } else {
    // Nothing to carry — this stop takes a signature the normal way.
    f.original_store_contact = '';
    f.noContact = !!src.noContact;
  }
  return f;
}

function startChecklist(idx) {
  selectedAsset = ASSETS[idx];
  selectedAssetIdx = idx;
  reopenPmId = null;

  form = rs ? reshootFormFrom(rs) : defaultForm();
  // A unit recorded as having no plate starts already marked. Asking the tech
  // to tick it every visit is asking them to re-discover the same fact.
  if (ASSETS[idx].no_serial) form.noSerialPlate = true;
  photos = [];
  sigs = { store: null, tech: mySig || null };
  screen = 'checklist';

  render();
}

// True when the form in hand is a re-shoot carrying a signature from the
// original visit — the case where the store panel is locked.
function reshootCarriesSignature() {
  return !!(form && form.reshoot_of_pm_id && form.original_store_contact);

function startChecklistFromRoute(idx, stopIdx) {

// Coming back from a PM lands on the route page beside the store you were just
// at, with its other units right there. Walking out to a stop screen to pick
// the next cooler was a screen change per unit for nothing.
var scrollToStopIdx = null;
function backToRoute(stopIdx) {
  routeFromChecklist = false;
  if (stopIdx != null) { currentStopIdx = stopIdx; scrollToStopIdx = stopIdx; }

}

// Drop straight back into an unfinished PM (used on every app start)
function tryAutoResume() {
  if (!localStorage.getItem('fp_progress')) return false;
  if (!loadProgress()) return false;
  selectedAsset = ASSETS[selectedAssetIdx];
  if (!selectedAsset) return false;
  // A draft for a stop that is FINISHED strands the technician on a checklist
  // he cannot complete — the classic case being a re-shoot: he submits it, the
  // phone reloads the page on the way back from the camera, and boot drops him
  // straight back onto the old form for a unit that is already done, with no
  // audit banner and (before the fix above) an empty photo strip. It reads as
  // the app being stuck between screens. A finished stop's draft is spent:
  // throw it away and start him on the route, where the stop shows as done.
  // reopenPmId is the deliberate exception — that IS an edit of a filed report.
  if (!reopenPmId && isCompleted(selectedAsset.serial)) { clearProgress(); return false; }
  screen = 'checklist';
  return true;
}

function resumeProgress() {
  if (tryAutoResume()) { render(); }
  else { clearProgress(); showStatus('Saved PM could not be restored', 'err'); render(); }
}

// ===== Submit =====
// Best-effort GPS at sign time. Resolves to {lat,lng,accuracy} or null within
// ~8s — never blocks the PM submit if permission is denied/unavailable.
function getGps() {
  return new Promise(function(resolve) {
    if (!navigator.geolocation) { resolve(null); return; }
    var done = false;
    var t = setTimeout(function(){ if(!done){ done=true; resolve(null); } }, 8000);
    navigator.geolocation.getCurrentPosition(
      function(pos){ if(done) return; done=true; clearTimeout(t); resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy }); },
      function(){ if(done) return; done=true; clearTimeout(t); resolve(null); },
      { enableHighAccuracy:true, timeout:7000, maximumAge:60000 }
    );
  });
}
async function submitForm() {
  if (submitting) return;
  if (!form.techName) { showStatus('Please enter tech name', 'err'); return; }
  // Hard gates added after the invoice #172825 review (2026-08): a PM without
  // a fresh serial-plate photo, a real temperature reading, or an honest
  // answer on the store signature is exactly what produced that dispute.
  // No serial means nobody can prove which machine this report is about, which
  // is precisely the thing the office has to chase. Flag it here rather than
  // trusting the tech to also remember to press REPORT ISSUE.
  if (form.noSerialPlate) { ticketFlag = true; }
  var missing = missingPhotos();
  if (missing.length) {
    showStatus('Still needed: ' + missing.map(function(r){ return r.label; }).join(', ')
      + ' \u2014 take them here with the camera on THIS unit', 'err');
    return;
  }
  if (!form.intTemp) { showStatus('Measure and select the interior temperature', 'err'); return; }
  if (!form.sp1) { showStatus('Enter Set Point 1 as read on the unit', 'err'); return; }
  // Voltage read as 120 on all 511 reports that carried one, because it was a
  // pre-filled default nobody ever changed. Ask for it, and take "no meter" as an
  // honest answer — a blank field and a fake reading are both worse.
  if (form.noMeter) { form.voltage = ''; }
  else if (!(form.voltage || '').trim()) { showStatus('Enter the voltage you measured, or check \u201cNo meter on hand\u201d', 'err'); return; }
  if (!form.workingArrival && !form.notWorkingArrival) { showStatus('Mark whether the unit was working on arrival', 'err'); return; }
  if (reshootCarriesSignature()) {
    // Locked path: the store signed the original visit and is not asked again.
    // Guard it rather than trust the UI — a resumed draft could carry a stale
    // signature in memory, and pasting one onto a report the signer never saw
    // is the exact failure this whole remediation is about.
    sigs.store = null;
    form.noContact = false;
    form.reshoot_date = form.date || new Date().toISOString().split('T')[0];
  } else if (form.noContact) {
    sigs.store = null; // never both — the report states no contact was available
  } else if (!sigs.store) {
    showStatus('Get the store contact\u2019s signature, or check \u201cNo store contact available to sign\u201d. Never sign for the store yourself.', 'err'); return;
  } else if (!(form.storeContact || '').trim()) {
    showStatus('Enter the name of the store contact who signed', 'err'); return;
  }  if (!sigs.tech) {
    if (!confirm('Missing technician signature. Submit anyway?')) return;
  }
  // One report per unit per day: a second tap must go through the explicit
  // reopen/edit path, not mint a duplicate row (Kelley's Pets & Target #1417
  // each shipped doubled reports on invoice #172825).
  if (!reopenPmId) {
    var a0 = selectedAsset;
    var dupPm = completedPMs.find(function(p) {
      return p.asset_id === a0.id && p.pm_date === (form.date || new Date().toISOString().split('T')[0]) && !p.prev_comp;
    });
    if (dupPm) { showStatus('A report for this unit is already submitted today. Open it from PM History to edit it instead.', 'err'); return; }
  }

  submitting = true;
  render();

  try {
    localStorage.setItem('fp_techName', form.techName);
    localStorage.setItem('fp_company', form.serviceCompany || '');

    var a = selectedAsset;
    var timestamp = Date.now();
    // Capture the sign time + GPS at submit (best-effort; never blocks).
    var signedAt = new Date().toISOString();
    var gps = await getGps();
    // Record whether location was captured — every report on invoice #172825
    // went out with GPS silently null because permission was never granted,
    // and nothing surfaced that. The state is now part of the record.
    form.gpsStatus = gps ? 'captured' : 'unavailable';
    var safeStore = a.store.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
    var baseName = safeStore + '_' + a.serial + '_' + (form.date || '').replace(/-/g, '');

    var photoPaths = [];
    var photoHashes = [];
    for (var i = 0; i < photos.length; i++) {
      var np = normPhoto(photos[i]);
      var photoBlob = dataURLtoBlob(np.d);
      // kind travels in the filename so a reopen can restore the tag
      var photoPath = baseName + '_photo_' + (i + 1) + '_' + (np.kind || 'other') + '_' + timestamp + '.jpg';
      var { data: pData, error: pErr } = await sb.storage.from('fp-photos').upload(photoPath, photoBlob, {
        contentType: 'image/jpeg',
        upsert: false
      });
      if (pErr) { console.warn('Photo upload error:', pErr); }
      else {
        photoPaths.push(photoPath);
        photoHashes.push(np.hash || (await sha256Hex(np.d).catch(function(){ return null; })));
      }
    }

    // Keep the signatures WITH the record, not only as pixels burned into the
    // PDF. Until now a signature existed nowhere else, so nothing downstream
    // could show who signed or carry it onto a re-shoot without re-scraping the
    // document. form_data is behind RLS; the photo buckets are public, so a
    // signature must never go there.
    if (sigs.store) { form.storeSignature = sigs.store; }
    if (sigs.tech)  { form.techSignature  = sigs.tech; }

    var pdfDoc = await new Promise(function(resolve) {
      generatePDF(a, form, photos, sigs, { signedAt: signedAt, gps: gps, addedAsset: addedAssetFlag }, function(doc) { resolve(doc); });
    });

    var pdfBlob = pdfDoc.output('blob');
    var pdfPath = baseName + '_' + timestamp + '.pdf';
    var { error: pdfErr } = await sb.storage.from('fp-pdfs').upload(pdfPath, pdfBlob, {
      contentType: 'application/pdf',
      upsert: false
    });
    if (pdfErr) { console.warn('PDF upload error:', pdfErr); }

    var prevPm = reopenPmId ? completedPMs.find(function(p) { return p.id === reopenPmId; }) : null;
    // A stop carrying an open re-visit files a RE-SHOOT: a new, complete report
    // that replaces documentation we could not stand behind. It is paid to the
    // tech at the normal rate and is NEVER charged to Freshpet — they already
    // paid for this stop once, and the re-do is ours, not theirs. Enforced in
    // admin.html (billableList), freshpet-invoice.mjs, and a DB trigger.
    var openRevisit = reopenPmId ? null : openRevisitPm(a.serial);
    var record = {
      asset_id: a.id,
      tech_user_id: currentUser.id,
      tech_name: form.techName,
      service_company: form.serviceCompany || '',
      pm_date: form.date || new Date().toISOString().split('T')[0],
      form_data: form,
      pdf_path: pdfPath,
      photo_paths: photoPaths,
      photo_hashes: photoHashes,
      visit_type: openRevisit ? 'reshoot' : 'pm',
      revisit_of: openRevisit ? openRevisit.id : null,
      no_serial_plate: !!form.noSerialPlate,
      store: a.store,
      serial: a.serial,
      signed_at: signedAt,
      gps_lat: gps ? gps.lat : null,
      gps_lng: gps ? gps.lng : null,
      gps_accuracy: gps ? gps.accuracy : null,
      // A NOTE IS A REPORT. Until now writing one did nothing: nine visits said
      // in plain words that a store had a cooler that was not on the list --
      // "ALERT EXTRA UNIT HERE !!!!!" -- and four of those nine were not even
      // flagged, so nobody read them and none of those units got a record.
      // If a tech takes the trouble to write something down, it lands on the
      // Report Issues board and a human clears it with Mark handled. Noise is
      // cheap now that the board can be emptied; a missed note is not.
      //
      // Only a NEW or CHANGED note raises it, so re-submitting an edited report
      // cannot re-open an issue somebody has already dealt with.
      needs_review: ticketFlag || addedAssetFlag || noteRaisesIssue(form, prevPm)
        || !!(prevPm && prevPm.needs_review),
      added_asset: addedAssetFlag || !!(prevPm && prevPm.added_asset)
    };
    if (reopenPmId) {
      // Timestamp the modification — the original signed_at/created_at stay
      // in place as the record of the first submit.
      record.modified_at = signedAt;
      record.modified_by = currentUser.email;
    }
    var dbErr, savedId = null;
    if (reopenPmId) {
      dbErr = (await sb.from('completed_pms').update(record).eq('id', reopenPmId)).error;
      savedId = reopenPmId;
    } else {
      var ins = await sb.from('completed_pms').insert(record).select('id').single();
      dbErr = ins.error;
      savedId = ins.data && ins.data.id;
    }

    if (dbErr) { throw new Error('DB save failed: ' + dbErr.message); }

    // Close the re-visit only after its replacement is safely saved — if the
    // insert had failed the stop must stay open on the route, not silently
    // disappear with nothing filed in its place.
    if (openRevisit && savedId) {
      // Through the RPC, not a direct update: the original may have been filed
      // by a different tech, and RLS only lets a tech update their own rows.
      var closeErr = (await sb.rpc('fn_close_revisit', {
        p_original_id: openRevisit.id, p_reshoot_id: savedId
      })).error;
      // A failed close leaves the stop on the route — annoying, not wrong. The
      // re-shoot report itself is filed either way, so nothing is lost.
      if (closeErr) console.warn('Re-visit close failed:', closeErr);
    }

    // Offer the camera-roll copy before anything clears `photos`. Built from
    // the photos that were actually filed, so the tech's copy and the report
    // are the same set.
    savedPhotoSet = photos.length
      ? { files: photoFilesFor(photos, baseName), store: a.store, serial: a.serial }
      : null;

    var wasTicket = ticketFlag;
    var wasReopen = !!reopenPmId;
    var wasAdded = addedAssetFlag;
    reopenPmId = null;
    ticketFlag = false;
    addedAssetFlag = false;
    if (wasTicket) {
      var sent = await sendReviewEmail(pdfPath, a);
      showStatus(sent ? '🚨 Service ticket opened — emailed to service@brixbev.com' : 'PM flagged NEEDS REVIEW, but the email failed (check Resend setup)', sent ? 'ok' : 'err');
    }

    // Save a local copy so the report can be sent to Freshpet right away
    try { pdfDoc.save(baseName + '.pdf'); } catch(e) {}

    await loadCompletedPMs();
    clearProgress();
    submitting = false;

    if (routeFromChecklist) {
      routeFromChecklist = false;
      scrollToStopIdx = currentStopIdx;
      screen = 'route';
    } else {
      screen = 'home';
    }
    if (!wasTicket) {
      showStatus(wasAdded ? 'Added-asset PM submitted — flagged for review as ADDED ASSET'
        : (wasReopen ? 'PM updated — modification timestamped' : 'PM submitted successfully!'), 'ok');
    }

  } catch (err) {
    submitting = false;
    showStatus('Error: ' + err.message, 'err');
    render();
  }
}

// ===== Site-visit exception (store closed / unit missing) =====
// Before this existed, a tech at a boarded-up store had exactly one form the
// app would accept — a full PM checklist with prefilled readings and a
// signature box — which is how invoice #172825 carried "completed PMs" for
// five closed or unit-less sites. An exception visit is its own record type:
// reason + storefront photo, no readings, no signatures, never billable as a
// PM, always flagged for review.
var addAssetNoSerial = false;   // ticked on the Add Asset form when the unit has no readable plate
var exceptionForm = { reason: '', note: '' };
// Which kind of exception is being filed, and — for a store-level one — which
// stop it covers. A closed store is not a fact about one cooler, so it is filed
// against the store and answers every unit on it.
var exceptionKind = null;      // 'store_closed' | 'unit_missing'
var exceptionStopIdx = null;   // set only for store_closed

var EXCEPTION_KINDS = {
  store_closed: {
    title: 'STORE CLOSED \u2014 NO ASSET',
    scope: 'store',
    lead: 'The store is closed and no unit could be serviced. This files a report against every unit on the route at this store, so none of them is left looking unvisited.',
    photoHint: 'Photograph the storefront \u2014 closed sign, dark windows, whatever you can see. This is the proof you were here.',
    note: 'What you saw. Papered over? Permanently closed? Anyone to ask?'
  },
  unit_missing: {
    title: 'MISSING ASSET',
    scope: 'unit',
    lead: 'The store is open but this unit is not on site. This files a report against this one unit; the rest of the store carries on as normal.',
    photoHint: 'Photograph the space where the unit should be, or the aisle it was in. This is the proof you looked.',
    note: 'What you saw and who you asked. Was it moved, pulled, or never there?'
  }
};

// Store-level: a closed store, filed from the store card on the route page.
function startStoreClosed(stopIdx) {
  var stops = getRouteStops();
  var stop = stops[stopIdx];
  if (!stop) return;
  exceptionStopIdx = stopIdx;
  currentStopIdx = stopIdx;
  selectedAsset = stop.assets[0] || null;   // the report names every unit; this is just the anchor
  startException('store_closed');
}

// Reached from the store card's action strip. With one candidate there is
// nothing to ask; with several the tech says which machine is gone rather than
// every unit carrying its own button.
// Unit-level: the store is open, this one machine is gone.
function startUnitMissing(assetIdx, stopIdx) {
  selectedAsset = ASSETS[assetIdx];
  selectedAssetIdx = assetIdx;
  if (stopIdx != null) { currentStopIdx = stopIdx; routeFromChecklist = true; }
  exceptionStopIdx = null;
  startException('unit_missing');
}

function startException(kind) {
  exceptionKind = EXCEPTION_KINDS[kind] ? kind : 'unit_missing';
  // Zero prefill. Nothing is carried in from a PM form and no answer is
  // suggested — the whole point of this report is what the tech actually found.
  exceptionForm = { reason: exceptionKind, note: '' };
  photos = [];
  screen = 'exception';
  render();
}

// Every unit this exception speaks for. A closed store answers all of them.
function exceptionAssets() {
  if (exceptionKind === 'store_closed' && exceptionStopIdx != null) {
    var stop = getRouteStops()[exceptionStopIdx];
    if (stop && stop.assets.length) return stop.assets;
  }
  return selectedAsset ? [selectedAsset] : [];
}

  var k = EXCEPTION_KINDS[exceptionKind] || EXCEPTION_KINDS.unit_missing;

    ? 'backToRoute(' + (exceptionStopIdx == null ? 'currentStopIdx' : exceptionStopIdx) + ')'

    + '</div>';

  // Name every unit the report speaks for, so it is never a surprise later how

  if (units.length) {
    h += '<div class="card"><h3 style="margin-top:0">'

  h += '<h3>Photo (required)</h3>';

    h += '<button class="btn btn-o" style="margin-top:8px" onclick="' + backFn + '">Cancel</button>';

async function submitException() {
  if (submitting) return;
  captureExceptionMeta();
  if (!(exceptionForm.note || '').trim()) { showStatus('Write what you found — this report is nothing without it', 'err'); return; }
  if (!photos.length) { showStatus('A photo is required — it is the proof of the visit', 'err'); return; }
  submitting = true;
  render();
  try {
    var a = selectedAsset;
    var timestamp = Date.now();
    var signedAt = new Date().toISOString();
    var gps = await getGps();
    var safeStore = a.store.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
    var baseName = 'EXCEPTION_' + safeStore + '_' + a.serial + '_' + new Date().toISOString().split('T')[0].replace(/-/g, '');

    var photoPaths = [], photoHashes = [];
    for (var i = 0; i < photos.length; i++) {
      var np = normPhoto(photos[i]);
      var photoPath = baseName + '_photo_' + (i + 1) + '_site_' + timestamp + '.jpg';
      var { error: pErr } = await sb.storage.from('fp-photos').upload(photoPath, dataURLtoBlob(np.d), { contentType: 'image/jpeg', upsert: false });
      if (pErr) { console.warn('Photo upload error:', pErr); }
      else { photoPaths.push(photoPath); photoHashes.push(np.hash || (await sha256Hex(np.d).catch(function(){ return null; }))); }
    }

    // A closed store answers EVERY unit on the route there, so the report names
    // all of them and one row is written per unit. One visit, one document —
    // the same PDF is attached to each row rather than generating near-identical
    // copies — but each unit gets its own answer for the day instead of some of
    // them silently staying open on the route.
    var units = exceptionAssets();
    if (!units.length) { throw new Error('No unit to file this against'); }
    var pdfDoc = generateExceptionPDF(a, exceptionForm, photos,
      { signedAt: signedAt, gps: gps, techName: shortTechName(), kind: exceptionKind, units: units });
    var pdfPath = baseName + '_' + timestamp + '.pdf';
    var { error: pdfErr } = await sb.storage.from('fp-pdfs').upload(pdfPath, pdfDoc.output('blob'), { contentType: 'application/pdf', upsert: false });
    if (pdfErr) { console.warn('PDF upload error:', pdfErr); }

    var today = new Date().toISOString().split('T')[0];
    for (var u = 0; u < units.length; u++) {
      var un = units[u];
      // A unit already serviced today keeps its PM — a closed store cannot
      // retroactively un-service a unit somebody actually worked on.
      if (isCompleted(un.serial) && !isRevisit(un.serial)) continue;
      // If this unit was carrying an open re-visit, the exception answers it:
      // we went back and recorded why the documentation could not be redone.
      var exRevisit = openRevisitPm(un.serial);
      var { data: exRow, error: dbErr } = await sb.from('completed_pms').insert({
        asset_id: un.id,

// Reopen a submitted PM for edits (pulls its data and photos back in)
function blobToDataURL(blob) {
  return new Promise(function(res) { var r = new FileReader(); r.onload = function() { res(r.result); }; r.readAsDataURL(blob); });
}

async function reopenPM(pmId, fromRoute) {
  var pm = completedPMs.find(function(p) { return p.id === pmId; });
  if (!pm) return;
  if (pm.prev_comp) { showStatus('PREV COMP entries have no checklist to edit', 'err'); return; }
  if (pm.visit_type === 'exception') { showStatus('Exception reports document a failed visit — file a new PM instead once the unit is serviceable', 'err'); return; }
  if (pm.revisit_requested_at && !pm.revisit_done_at) { showStatus('This stop is flagged for a re-visit — service it and file a fresh report. Editing the old one is exactly what we are undoing.', 'err'); return; }
  if (pm.tech_user_id !== currentUser.id && userRole !== 'admin') { showStatus('Only the tech who submitted this PM (or an admin) can reopen it', 'err'); return; }
  var idx = ASSETS.findIndex(function(x) { return x.id === pm.asset_id; });
  if (idx === -1) { showStatus('Asset is no longer active', 'err'); return; }
  selectedAsset = ASSETS[idx];
  selectedAssetIdx = idx;
  form = Object.assign({}, pm.form_data || {});
  photos = [];
  sigs = { store: null, tech: mySig || null };
  reopenPmId = pm.id;
  ticketFlag = false;
  addedAssetFlag = false;
  routeFromChecklist = !!fromRoute;
  screen = 'checklist';
  saveProgress();
  render();
  // Pull existing photos back in so they stay in the regenerated PDF.
  // The kind tag rides in the filename (`_photo_N_<kind>_ts.jpg`); paths from
  // before the tagged-photo change have no tag and come back as 'other'.
  if (pm.photo_paths && pm.photo_paths.length) {
    for (var i = 0; i < pm.photo_paths.length; i++) {
      try {
        var resp = await fetch(SUPA_URL + '/storage/v1/object/public/fp-photos/' + pm.photo_paths[i]);
        if (resp.ok) {
          var d = await blobToDataURL(await resp.blob());
          var km = pm.photo_paths[i].match(/_photo_\d+_(plate|unit|site|other)_\d+\.jpg$/);
          var hash = await sha256Hex(d).catch(function(){ return null; });
          photos.push({ d: d, kind: km ? km[1] : 'other', hash: hash });
        }
      } catch (e) {}
    }
    render();
  }
}

function dataURLtoBlob(dataURL) {
  var parts = dataURL.split(',');
  var mime = parts[0].match(/:(.*?);/)[1];
  var b64 = atob(parts[1]);
  var arr = new Uint8Array(b64.length);
  for (var i = 0; i < b64.length; i++) arr[i] = b64.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

      var snLabel = f.noSerialPlate ? '(NO SERIAL NUMBER)' : '(S/N: '+a.serial+')';
      doc.text(kindLabel+' — photo '+(i+1)+' of '+ph.length+' — '+a.store+' '+snLabel,W/2,30,{align:'center'});
      try{var ip=doc.getImageProperties(pp.d);var iw=ip.width,ih=ip.height;var sc=Math.min((RM-LM)/iw,680/ih,1);iw*=sc;ih*=sc;doc.addImage(pp.d,'JPEG',LM+((RM-LM)-iw)/2,50,iw,ih);}catch(e){}
    }
  }
  cb(doc);
}

// ===== Admin Asset Picker =====
function renderAdminAssetPicker() {
  var h = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
    '<button class="btn back-btn" onclick="screen=\'admin\';render()">←</button>' +
    '<h2 style="margin:0;flex:1">Add Stores to Route</h2>' +
  '</div>';
  h += '<p style="font-size:12px;color:var(--dim);margin-bottom:8px">Assigning to: <strong>' + esc(adminSelectedTech) + '</strong></p>';
  h += '<div class="search"><input type="text" id="searchInput" placeholder="Search store, city, address..." value="' + esc(search) + '"></div>';

  // Group by store location
  var groups = {};
  var groupOrder = [];
  var filtered = ASSETS.filter(function(a) {
    if (!search) return true;
    var s = search.toLowerCase();
    return a.store.toLowerCase().indexOf(s) > -1 ||
           a.city.toLowerCase().indexOf(s) > -1 ||
           a.address.toLowerCase().indexOf(s) > -1;
  });

  var selCount = Object.keys(pickerSel).filter(function(k){ return pickerSel[k]; }).length;

  // Who has each asset (one tech per store: taken stores can't be added)
  var assignedTo = {};
  allAssignments.forEach(function(ra) { assignedTo[ra.asset_id] = ra.tech_email; });

  filtered.forEach(function(a) {
    var key = a.store + '|' + a.address + '|' + a.city;
    if (!groups[key]) {
      groups[key] = { store: a.store, address: a.address, city: a.city, assets: [], allAssigned: true, takenBy: null };
      groupOrder.push(key);
    }
    var owner = assignedTo[a.id];
    if (owner && owner !== adminSelectedTech) { groups[key].takenBy = owner; }
    var assigned = adminTechAssets.indexOf(a.id) > -1;
    if (!assigned) groups[key].allAssigned = false;
    groups[key].assets.push({ asset: a, assigned: assigned });
  });

  // Keys of stores that can still be added (not taken, not already fully assigned)
  var eligibleKeys = groupOrder.filter(function(k){ return !groups[k].takenBy && !groups[k].allAssigned; });
  var allShownSelected = eligibleKeys.length > 0 && eligibleKeys.every(function(k){ return pickerSel[k]; });

  // Multi-select action bar
  h += '<div class="card" style="position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px">';
  if (eligibleKeys.length) {
    h += '<button class="btn btn-o" style="width:auto;padding:8px 12px;font-size:13px" onclick="toggleSelectAllShown()">' + (allShownSelected ? ''+icon('check-square')+' Deselect shown' : ''+icon('square')+' Select all shown') + '</button>';
  }
  h += '<span style="font-size:13px;color:var(--dim)">' + selCount + ' selected</span>';
  if (selCount) {
    h += '<button class="btn btn-p" style="width:auto;padding:8px 14px;font-size:13px;margin-left:auto" onclick="assignSelectedStores()">'+icon('plus')+' Assign ' + selCount + ' store' + (selCount === 1 ? '' : 's') + '</button>';
    h += '<button class="btn btn-o" style="width:auto;padding:8px 12px;font-size:13px" onclick="pickerSel={};render()">Clear</button>';
  }
  h += '</div>';

  groupOrder.forEach(function(key) {
    var g = groups[key];
    var eligible = !g.takenBy && !g.allAssigned;
    var checked = !!pickerSel[key];
    var encKey = encodeURIComponent(key);
    h += '<div class="store-grp"' + (checked ? ' style="outline:2px solid var(--ac)"' : '') + '>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
    h += '<div style="display:flex;align-items:center;gap:10px;min-width:0">';
    if (eligible) {
      h += '<input type="checkbox" style="width:22px;height:22px;flex:none" onclick="togglePickStore(\'' + encKey + '\')"' + (checked ? ' checked' : '') + '>';
    }
    h += '<h4 style="margin:0;overflow:hidden;text-overflow:ellipsis">'+icon('map-pin')+' ' + esc(g.store) + ' — ' + esc(g.city) + '</h4>';
    h += '</div>';
    if (g.takenBy) {
      var owner = techProfiles.find(function(t) { return t.email === g.takenBy; });
      h += '<span style="color:var(--rd);font-size:12px;flex:none">'+icon('lock')+' ' + esc(owner ? (owner.name || owner.email) : g.takenBy) + '</span>';
    } else if (!g.allAssigned) {
      var ids = g.assets.filter(function(x) { return !x.assigned; }).map(function(x) { return x.asset.id; });
      h += '<button class="btn btn-p" style="width:auto;padding:6px 12px;font-size:12px;flex:none" onclick="addStoreToRoute([' + ids.join(',') + '])">+ Add</button>';
    } else {
      h += '<span style="color:var(--gn);font-size:12px;flex:none">✓ Assigned</span>';
    }
    h += '</div>';
    h += '<div style="font-size:12px;color:var(--dim);margin-bottom:4px;padding:0 4px">' + esc(g.address) + ' &bull; ' + g.assets.length + ' asset(s)</div>';
    h += '</div>';
  });

  return h;
}

function togglePickStore(enc) {
  var k = decodeURIComponent(enc);
  if (pickerSel[k]) delete pickerSel[k]; else pickerSel[k] = true;
  render();
}
function toggleSelectAllShown() {
  var s = (search || '').toLowerCase();
  var assignedTo = {};
  allAssignments.forEach(function(ra) { assignedTo[ra.asset_id] = ra.tech_email; });
  // Rebuild the eligible store keys currently shown
  var groups = {}, order = [];
  ASSETS.forEach(function(a) {
    if (s && a.store.toLowerCase().indexOf(s) < 0 && a.city.toLowerCase().indexOf(s) < 0 && a.address.toLowerCase().indexOf(s) < 0) return;
    var key = a.store + '|' + a.address + '|' + a.city;
    if (!groups[key]) { groups[key] = { taken: false, allAssigned: true }; order.push(key); }
    var owner = assignedTo[a.id];
    if (owner && owner !== adminSelectedTech) groups[key].taken = true;
    if (adminTechAssets.indexOf(a.id) < 0) groups[key].allAssigned = false;
  });
  var eligible = order.filter(function(k) { return !groups[k].taken && !groups[k].allAssigned; });
  var allSel = eligible.length > 0 && eligible.every(function(k) { return pickerSel[k]; });
  eligible.forEach(function(k) { if (allSel) delete pickerSel[k]; else pickerSel[k] = true; });
  render();
}
async function assignSelectedStores() {
  if (!adminSelectedTech) { showStatus('Choose a tech first', 'err'); return; }
  var keys = Object.keys(pickerSel).filter(function(k) { return pickerSel[k]; });
  if (!keys.length) { showStatus('No stores selected', 'err'); return; }
  var assignedTo = {};
  allAssignments.forEach(function(ra) { assignedTo[ra.asset_id] = ra.tech_email; });
  var ids = [];
  ASSETS.forEach(function(a) {
    var key = a.store + '|' + a.address + '|' + a.city;
    if (keys.indexOf(key) < 0) return;
    if (adminTechAssets.indexOf(a.id) > -1) return;                          // already this tech
    if (assignedTo[a.id] && assignedTo[a.id] !== adminSelectedTech) return;  // taken by another tech
    ids.push(a.id);
  });
  if (!ids.length) { showStatus('Selected stores are already assigned', 'info'); pickerSel = {}; render(); return; }
  var maxOrder = adminTechAssets.length;
  var inserts = ids.map(function(id, i) {
    return { tech_email: adminSelectedTech, asset_id: id, stop_order: maxOrder + i, route_name: 'Primary Route', active: true };
  });
  var { error } = await sb.from('route_assignments').insert(inserts);
  if (error) {
    if (error.code === '23505') { showStatus('One or more stores were just taken by another tech', 'err'); await loadAllAssignments(); }
    else { showStatus('Error: ' + error.message, 'err'); }
    render();
    return;
  }
  adminTechAssets = adminTechAssets.concat(ids);
  pickerSel = {};
  await loadAllAssignments();
  showStatus(keys.length + ' store(s) assigned (' + ids.length + ' assets)', 'ok');
  render();
}

async function addStoreToRoute(assetIds) {
  // Add assets that aren't already assigned
  var toAdd = assetIds.filter(function(id) { return adminTechAssets.indexOf(id) === -1; });
  if (toAdd.length === 0) { showStatus('Already assigned', 'info'); return; }

  var maxOrder = adminTechAssets.length > 0 ? adminTechAssets.length : 0;
  var inserts = toAdd.map(function(id, i) {
    return {
      tech_email: adminSelectedTech,
      asset_id: id,
      stop_order: maxOrder + i,
      route_name: 'Primary Route',
      active: true
    };
  });

  var { error } = await sb.from('route_assignments').insert(inserts);
  if (error) {
    if (error.code === '23505') {
      showStatus('Store is already assigned to another tech', 'err');
      await loadAllAssignments();
    } else {
      showStatus('Error: ' + error.message, 'err');
    }
    render();
    return;
  }

  adminTechAssets = adminTechAssets.concat(toAdd);
  await loadAllAssignments();
  showStatus(toAdd.length + ' asset(s) added to route', 'ok');
  render();
}

// ===== Event Binding =====
function bindEvents() {
  var si = document.getElementById('searchInput');
  if (si) {
    si.addEventListener('input', function() { search = this.value; render(); });
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  }
  var fsi = document.getElementById('feeSearchInput');
  if (fsi) {
    fsi.addEventListener('input', function() { feeSearch = this.value; render(); var el = document.getElementById('feeSearchInput'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
  }

  document.querySelectorAll('.asset-btn').forEach(function(btn) {
    if (btn.getAttribute('data-idx') !== null) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-idx'));
        startChecklist(idx);
      });
    }
  });

  if (sigModalKey) { initSigModalCanvas(); }

  if (screen === 'checklist') {
    document.querySelectorAll('input[name],textarea[name],select[name]').forEach(function(el) {
      var handler = function() {
        if (el.type === 'checkbox') {
          form[el.name] = el.checked;
          if (el.name === 'otherLoc') {
            var w = document.getElementById('otherLocWrap');
            if (w) w.style.display = el.checked ? 'block' : 'none';
          }
          if (el.name === 'noContact') {
            // A "no contact" report must not also carry a store signature.
            if (el.checked) { sigs.store = null; }
            saveProgress(); render(); return;
          }
          if (el.name === 'noSerialPlate') {
            // A report cannot both carry a plate photo and claim there is no
            // plate. Drop the plate shot so the two can never contradict.
            if (el.checked) { photos = photos.filter(function(p) { return normPhoto(p).kind !== 'plate'; }); }
            else { photos = photos.filter(function(p) { return normPhoto(p).kind !== 'interior'; }); }
            saveProgress(); render(); return;
          }
          if (el.name === 'noMeter') {
            // Ticking it clears any typed voltage so the two can't disagree.
            if (el.checked) { form.voltage = ''; }
            saveProgress(); render(); return;
          }
        } else {
          form[el.name] = el.value;
        }
        saveProgress();
      };
      el.addEventListener('change', handler);
      if (el.type !== 'checkbox') el.addEventListener('input', handler);
    });
  }
}

// Override render to include the admin asset picker.
//
// This used to re-declare the ENTIRE screen dispatch, so render() existed twice
// and only this copy ever ran — a change made to the original above was dead
// code with nothing to show for it (the audit tint was written there first and
// silently did nothing). It now handles its one extra screen and delegates, so
// there is one dispatch again and one place to add a screen.
var _origRender = render;
render = function() {
  if (screen === 'adminAssetPicker') {
    var el = document.getElementById('app');
    var html = '';
    if (statusMsg) { html += '<div class="status ' + statusType + '">' + esc(statusMsg) + '</div>'; }
    html += renderAdminAssetPicker();
    document.body.classList.remove('audit');
    document.body.classList.remove('exception');
    el.innerHTML = html;
    bindEvents();
    return;
  }
  return _origRender();
};

// ===== Theme (light/dark) =====
function applyTheme() {
  document.body.classList.toggle('dark', localStorage.getItem('fp_theme') === 'dark');
}
function toggleTheme() {
  localStorage.setItem('fp_theme', localStorage.getItem('fp_theme') === 'dark' ? 'light' : 'dark');
  applyTheme();
  render();
}
applyTheme();

// ===== Init =====
initAuth();
