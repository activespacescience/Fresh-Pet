<!DOCTYPE html>
<html lang="en">

<title>Freshpet PM Checklist</title>

<style>
/* Freshpet color system — matches the admin console + customer portal.
   Orange is the primary/interactive accent; green is reserved for
   done/success so "current" (orange) vs "completed" (green) stay distinct. */
:root{--bg:#FFF8F0;--sf:#FFFFFF;--sf2:#F6EEE3;--bd:#EEE0CF;--bd2:#DCC8AC;--tx:#2A2521;--tx2:#786B5E;--dim:#8A7A66;--ac:#E56A15;--ac2:#C85A0E;--gn:#2FA24C;--rd:#DB4A44;--or:#E56A15;--shadow:0 1px 2px rgba(42,37,33,.04),0 4px 16px rgba(191,120,58,.08);--font:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);font-size:17px;line-height:1.45;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* Accessibility: visible keyboard focus + honor reduced-motion */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* Inline SVG icons (Lucide-style) — inherit color + font-size, replace emoji */
.ic-svg{width:1.05em;height:1.05em;vertical-align:-.16em;stroke-width:2;flex:none}
.app{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:none;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.btn{display:block;width:100%;padding:17px;border:none;border-radius:14px;font-size:19px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;font-family:inherit}
.btn:active{opacity:.75;transform:scale(.985)}
.btn-p{background:var(--ac);color:#fff}
.btn-s{background:var(--ac);color:#fff}
.btn-d{background:var(--rd);color:#fff}
.btn-o{background:var(--sf);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--shadow)}
h1{font-size:30px;text-align:center;margin-bottom:4px;font-weight:700;letter-spacing:-.4px}
h2{font-size:22px;margin-bottom:12px;font-weight:700;letter-spacing:-.3px}
h3{font-size:15px;color:var(--dim);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.sub{text-align:center;color:var(--dim);font-size:16px;margin-bottom:16px}
input[type=text],input[type=date],input[type=number],input[type=email],textarea,select{width:100%;padding:14px;background:var(--sf2);border:1px solid transparent;border-radius:12px;color:var(--tx);font-size:18px;margin-bottom:8px;font-family:inherit;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:18px;color:var(--tx);cursor:pointer}
label input[type=checkbox]{width:26px;height:26px;accent-color:var(--ac)}
.search{position:sticky;top:0;z-index:10;padding:8px 0;background:var(--bg)}
.search input{margin-bottom:0;background:var(--sf);box-shadow:var(--shadow)}
.store-grp{margin-bottom:18px}
.store-grp h4{font-size:16px;color:var(--dim);margin-bottom:6px;padding:0 4px;font-weight:700}
.asset-btn{display:block;width:100%;text-align:left;padding:17px;background:var(--ac);border:none;border-radius:14px;color:#fff;font-size:19px;font-weight:700;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);font-family:inherit}
.asset-btn:active{opacity:.7}
.asset-btn .ser{color:rgba(255,255,255,.85);font-size:15px;font-weight:500}
.asset-btn.done{background:var(--gn)}
/* Asset sub-card, shown inside its store card on the route page. Model and
   serial ride on the face so a tech standing at the cooler can match the card
   to the machine without opening anything. */
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;
  background:var(--sf2);border:1px solid var(--bd);margin-top:8px;cursor:pointer;font-family:inherit;color:var(--tx)}
.unit:active{opacity:.7}
.unit.done{background:transparent;border-style:dashed}
.unit.rv{border-color:#8FC4EA;border-left:4px solid #155E9B;background:#E2EFF9}
body.dark .unit.rv{background:#152836}
.unit .mdl{font-size:21px;font-weight:800;line-height:1.2}
.unit .sn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;color:var(--tx);margin-top:3px;letter-spacing:.02em;overflow-wrap:anywhere}
.unit .go{flex:none;font-size:24px;color:var(--dim)}
.unit.done .mdl,.unit.done .sn{color:var(--dim);font-weight:600}
.unit.done .go{color:var(--gn)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.photo-grid div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.photo-grid .del{position:absolute;top:4px;right:4px;background:var(--rd);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:15px;cursor:pointer;line-height:26px;text-align:center}
.status{position:fixed;top:0;left:0;right:0;padding:16px;text-align:center;font-weight:600;z-index:100;font-size:15px}
.status.ok{background:var(--gn);color:#fff}
.status.err{background:var(--rd);color:#fff}
.status.info{background:#3a3a3c;color:#fff}
.hist-item{padding:14px;background:var(--sf);border-radius:14px;margin-bottom:8px;font-size:15px;box-shadow:var(--shadow)}
.hist-item .dt{color:var(--gn);font-weight:600}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;text-align:center}
.login-wrap h1{font-size:30px}
.login-wrap .logo{font-size:54px}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 30px;background:#fff;color:#1c1c1e;border:1px solid var(--bd);border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);font-family:inherit}
.login-btn:active{opacity:.7}
.login-btn svg{width:20px;height:20px}
.user-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--sf);border-radius:14px;margin-bottom:14px;font-size:14px;box-shadow:var(--shadow)}
.user-bar .email{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.user-bar button{background:var(--sf2);color:var(--tx);border:none;border-radius:10px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:5px;background:var(--sf2);border-radius:3px;margin:10px 0 4px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--ac);transition:width .3s;border-radius:3px}
/* Admin & Route styles */
.tab-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab-bar button{flex:1 1 30%;padding:11px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:var(--sf);color:var(--dim);box-shadow:var(--shadow);font-family:inherit}
.tab-bar button.active{background:var(--ac);color:#fff}
.stop-card{background:var(--sf);border-radius:16px;padding:15px;margin-bottom:10px;border-left:4px solid var(--bd);box-shadow:var(--shadow)}
.stop-card.current{border-left-color:var(--ac);background:#FDEFE0}
.stop-card.completed{border-left-color:var(--gn);opacity:.78}
.stop-num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:700;margin-right:8px}
.stop-num.current{background:var(--ac);color:#fff}
.stop-num.done{background:var(--gn);color:#fff}
.stop-num.pending{background:var(--sf2);color:var(--dim)}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:13px 19px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;margin-top:8px;font-family:inherit}
.nav-btn:active{opacity:.7}
.tech-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--sf);border-radius:14px;margin-bottom:8px;font-size:14px;box-shadow:var(--shadow)}
.tech-row .role{font-size:12px;padding:3px 10px;border-radius:8px;font-weight:700}
.tech-row .role.admin{background:var(--rd);color:#fff}
.tech-row .role.tech{background:var(--gn);color:#fff}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:700;background:var(--gn);color:#fff;margin-left:6px}
.asset-check{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sf);border-radius:14px;margin-bottom:8px;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.asset-check:active{opacity:.7}
.asset-check input{width:22px;height:22px;accent-color:var(--ac)}
.remove-btn{background:none;border:none;color:var(--rd);font-size:19px;cursor:pointer;padding:4px 8px}
.sig-canvas{display:block;width:100%;height:120px;background:#fff;border:1px solid var(--bd);border-radius:12px;touch-action:none;cursor:crosshair}
.sig-bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.sig-bar .hint{font-size:12px;color:var(--dim)}
.sig-bar button{background:var(--sf2);color:var(--tx);border:none;border-radius:10px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

.back-btn{width:auto !important;padding:12px 22px !important;background:var(--rd) !important;color:#fff !important;font-size:26px !important;font-weight:800;line-height:1;border-radius:14px}
.sig-modal{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));touch-action:none;overscroll-behavior:none}
.sig-modal-head{font-size:20px;font-weight:700;text-align:center;padding:8px 0 14px}
.sig-modal canvas{flex:1;width:100%;background:#fff;border:2px solid var(--bd);border-radius:16px;touch-action:none}
.sig-modal-btns{display:flex;gap:10px;padding-top:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:8px}
.brand .brand-img{max-height:70px;max-width:78%;object-fit:contain}
.brand .fp{font-size:36px;font-weight:800;color:var(--ac);letter-spacing:-1.2px;line-height:1}
.brand .ff{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.2px}
.brand .ff small{color:var(--dim);font-weight:600}
.brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
.brand-row .brand-img{max-height:40px}
.brand-row .fp{font-size:26px;font-weight:800;color:var(--ac);letter-spacing:-1px}
/* Dark mode */
/* Exception report \u2014 red paper on screen, matching the PDF. STORE CLOSED and
   MISSING ASSET are the two ways a stop ends with no service done. */
body.exception{--bg:#FBE9E7;--sf:#FFFFFF;--sf2:#F7D9D5;--bd:#EFBDB6;--bd2:#E08A80;--ac:#B3261E;--ac2:#8C1D18;--or:#B3261E;--dim:#96625C}
body.exception.dark{--bg:#2A1210;--sf:#3A1B18;--sf2:#4A2320;--bd:#5C2E29;--bd2:#7A403A;--ac:#F2857B;--ac2:#E0685C;--or:#F2857B}
/* Secondary visit audit \u2014 light blue paper on screen, matching the PDF. */
body.audit{--bg:#E2EFF9;--sf:#FFFFFF;--sf2:#D3E6F6;--bd:#B8D5EC;--bd2:#8FC4EA;--ac:#155E9B;--ac2:#0E4676;--or:#155E9B;--dim:#4E7FA6}
body.audit.dark{--bg:#0E1C28;--sf:#152836;--sf2:#1B3346;--bd:#254257;--bd2:#33607F;--ac:#67B2E8;--ac2:#4A93C9;--or:#67B2E8}
body.dark{--bg:#1A1613;--sf:#241E19;--sf2:#2E271F;--bd:#3A3128;--bd2:#4A4034;--tx:#F5EEE6;--tx2:#C4B5A5;--dim:#9A8B7B;--ac:#F2872F;--ac2:#E56A15;--gn:#4CC46B;--rd:#F26761;--or:#F2872F;--shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark input:focus,body.dark textarea:focus,body.dark select:focus{background:var(--sf2)}
body.dark .stop-card.current{background:#2E2016}
body.dark .login-btn{background:#fff;color:#1c1c1e}
body.dark .status.info{background:#5a5a5e}
</style>

<body>
<div class="app" id="app"></div>
<script>
// ===== Supabase Init =====
var SUPA_URL = 'https://mmkncrsaijexezmhfmiw.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ta25jcnNhaWpleGV6bWhmbWl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTkyMjUsImV4cCI6MjA5NjM3NTIyNX0.lx4J-YhlFFrQVJMqjeBXXHNmgZfRe23xYGKZMEL8dPM';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { flowType: 'implicit' }
});

// ===== State =====
var screen = 'loading';
var search = '';
var ASSETS = [];
var selectedAsset = null;
var selectedStoreIdx = -1;
var selectedAssetIdx = -1;
var form = {};
var photos = [];
var sigs = { store: null, tech: null }; // signature dataURLs
var completedPMs = [];
var statusMsg = '';
var statusType = 'ok';
var currentUser = null;
var submitting = false;
// Role & Admin state
var userRole = null; // 'admin' or 'tech'
var myRate = null; // flat per-PM rate for this tech (overrides asset fees)
var myName = null; // tech profile name
var mySig = null; // locked-in technician signature (auto-applied to PMs)
var reopenPmId = null; // editing an existing PM
var ticketFlag = false; // submit as service ticket (needs review)
var addedAssetFlag = false; // current checklist is a PM on a freshly field-added asset
var addAssetStop = null; // route stop we're adding a found asset to
var addingAsset = false; // asset insert in flight
var techProfiles = [];
var adminTab = 'techs'; // 'techs', 'routes', 'import', 'reports' or 'pay'
// Assignment & pay state
var allAssignments = []; // every tech's active assignments (for exclusivity)
var payouts = [];
var payWeekOffset = 0; // 0 = this week, -1 = last week...
var submittingPayout = false;
var feeSearch = '';
var showUnassigned = false; // Routes tab: show all unassigned stores
var unassignTech = ''; // tech to assign unassigned stores to
var adminPayWeekOffset = 0; // admin per-tech weekly pay week
var adminPayExpand = {}; // uid -> show line items
// Reports state (bulk PDF send)
var reportSel = {};
var reportFrom = new Date(Date.now() - 29 * 864e5).toISOString().split('T')[0];
var reportTo = new Date().toISOString().split('T')[0];
var sharingReports = false;
// Import state
var importPreview = null; // { rows, newCount, updateCount, deactivateSerials, skipped }
var importFileName = '';
var importing = false;
var importFullReplace = true;
var adminSelectedTech = '';
var adminTechAssets = []; // asset IDs assigned to selected tech
var pickerSel = {};       // multi-select in the Add-Stores picker: { storeKey: true }
// Route state (for tech view)
var myRoute = []; // route assignments + asset data
var assetCandidates = [];  // open 'there may be another unit here' rows, by store
var assetCandidates = [];  // open 'there may be another unit here' rows, by store
var currentStopIdx = 0;
// Finished work is hidden on the route screen, not deleted. A stop you have
// already done is not a stop — it competes for the eye with the one you are
// standing in front of, and on an audit route (where a store can hold a done
// unit and an owed unit at once) it is actively misleading. It stays one tap
// away under "Already done", because a tech does sometimes need to reopen a
// report they just filed.
var showDoneStops = false;
var doneUnitsOpen = {};   // { stop index: true } - show finished units on a part-done store
function toggleDoneStops(){ showDoneStops = !showDoneStops; render(); }
function toggleDoneUnits(i){ if(doneUnitsOpen[i]) delete doneUnitsOpen[i]; else doneUnitsOpen[i] = true; render(); }
var routeFromChecklist = false; // track if we came from route view
// How many photographs the last saved draft could not hold. Surfaced on the
// checklist — a silent loss is what makes a tech distrust the app.
var draftPhotosDropped = 0;

// ===== LocalStorage helpers =====
function saveProgress() {
  try {
    // The File handle is session-only — strip it rather than let JSON.stringify
    // quietly drop it and leave a half-shaped photo in the draft.
    var draftPhotos = photos.map(function(p){
      var n = normPhoto(p); return { d: n.d, kind: n.kind, hash: n.hash };
    });
    var base = { si: selectedStoreIdx, ai: selectedAssetIdx, serial: selectedAsset ? selectedAsset.serial : null, form: form, sigs: sigs, reopenId: reopenPmId, aa: addedAssetFlag };
    // Photographs can overflow localStorage. The old fallback threw ALL of them
    // away and said nothing, so a draft restored after the phone reloaded the
    // page came back with an empty photo strip — the tech retook shots he had
    // already taken, or worse, submitted thinking they were still attached.
    // Now: keep as many as fit, newest first (the one just taken is the one he
    // is thinking about), and RECORD how many had to go so the checklist can
    // say so out loud.
    for (var keep = draftPhotos.length; keep >= 0; keep--) {
      var d = { si: base.si, ai: base.ai, serial: base.serial, form: base.form, sigs: base.sigs,
                reopenId: base.reopenId, aa: base.aa,
                photos: draftPhotos.slice(draftPhotos.length - keep),
                dropped: draftPhotos.length - keep };
      try { localStorage.setItem('fp_progress', JSON.stringify(d)); return; }
      catch (e) { /* quota — go round again with one fewer photograph */ }
    }
  } catch(e) {}
}
function loadProgress() {
  try {
    var d = JSON.parse(localStorage.getItem('fp_progress'));
    if (d) {
      selectedStoreIdx = d.si;
      selectedAssetIdx = d.ai;
      form = d.form || {};
      sigs = d.sigs || { store: null, tech: null };
      photos = (d.photos || []).map(normPhoto);
      draftPhotosDropped = Number(d.dropped) || 0;
      reopenPmId = d.reopenId || null;
      addedAssetFlag = !!d.aa;
      // Resume strictly by serial. The saved numeric index is NOT trusted:
      // ASSETS reloads between sessions (ties in the city/store sort are
      // unordered, imports add/remove rows), so a stale index can silently
      // resolve to a different store's unit — a draft's form, photos and
      // signatures would then land on the wrong report.
      if (!d.serial) return false;
      var i = ASSETS.findIndex(function(a) { return a.serial === d.serial; });
      if (i === -1) return false;
      selectedAssetIdx = i;
      return true;
    }
  } catch(e) {}
  return false;
}
function clearProgress() {
  localStorage.removeItem('fp_progress');
  draftPhotosDropped = 0;
  photos = [];
  sigs = { store: null, tech: null };
  reopenPmId = null;
  addedAssetFlag = false;
}

// ===== Auth =====
async function initAuth() {
  var { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadAssets();
    await loadCompletedPMs();
    await loadAssetCandidates();
    await checkUserRole();
    screen = 'home';
    tryAutoResume(); // reopened mid-PM (e.g. iOS reloaded the page for the camera)
  } else {
    screen = 'login';
  }
  render();

  sb.auth.onAuthStateChange(async function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      // Supabase re-fires SIGNED_IN every time the app regains focus
      // (e.g. after the camera). Don't reset the UI mid-PM — only do the
      // full init when this is actually a new sign-in.
      if (currentUser && currentUser.id === session.user.id) {
        currentUser = session.user;
        return;
      }
      currentUser = session.user;
      await loadAssets();
      await loadCompletedPMs();
      await loadAssetCandidates();
      await checkUserRole();
      screen = 'home';
      tryAutoResume();
      render();
    } else if (event === 'TOKEN_REFRESHED' && session) {
      currentUser = session.user;
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      ASSETS = [];
      completedPMs = [];
      userRole = null;
      screen = 'login';
      render();
    }
  });
}

async function signInGoogle() {
  var { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if (error) { showStatus('Login failed: ' + error.message, 'err'); }
}

async function signOut() {
  await sb.auth.signOut();
}

// ===== Role Check =====
async function checkUserRole() {
  if (!currentUser) return;
  var email = currentUser.email;
  var { data } = await sb.from('tech_profiles').select('*').eq('email', email).single();
  if (data) {
    userRole = data.role;
    myName = data.name || null;
    mySig = data.signature || null;
    myRate = data.pm_rate != null && Number(data.pm_rate) > 0 ? Number(data.pm_rate) : null;
    // Backfill the auth user id so admin pay can map PMs to this profile/rate
    if (!data.user_id) { try { await sb.from('tech_profiles').update({ user_id: currentUser.id }).eq('email', email); } catch(e) {} }
  } else {
    // Auto-create tech profile for new users
    await sb.from('tech_profiles').insert({ email: email, name: currentUser.user_metadata?.full_name || email.split('@')[0], role: 'tech', user_id: currentUser.id });
    userRole = 'tech';
  }
}

// ===== Data Loading =====
async function loadAssets() {
  var { data, error } = await sb.from('assets').select('*').eq('active', true).order('city').order('store');
  if (error) { showStatus('Failed to load assets: ' + error.message, 'err'); return; }
  ASSETS = data || [];
}

function isCompleted(serial) {
  // A unit is done only when it has a report AND no report on it is carrying an
  // open re-visit. Testing "some report has no open re-visit" is not the same
  // thing and gets it wrong for a unit with more than one report on file — 16 of
  // the 160 units in the plate-photo re-shoot list have two — where an unflagged
  // older report would keep the stop closed and the tech would never be shown it.
  var mine = completedPMs.filter(function(pm) { return pm.serial === serial; });
  if (!mine.length) return false;
  return !mine.some(function(pm) { return pm.revisit_requested_at && !pm.revisit_done_at; });

  return completedPMs.some(function(pm) {
    return pm.serial === serial && pm.revisit_requested_at && !pm.revisit_done_at;

function initSigModalCanvas() {
  var c = document.getElementById('sigModalCanvas');
  if (!c) return;
  c.width = c.offsetWidth;
  c.height = c.offsetHeight;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var existingSig = sigModalKey === 'mySig' ? mySig : sigs[sigModalKey];
  if (existingSig) {
    var im = new Image();
    im.onload = function() { ctx.drawImage(im, 0, 0, c.width, c.height); };
    im.src = existingSig;
  }
  var drawing = false;
  function pos(e) { var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  c.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    drawing = true;
    try { c.setPointerCapture(e.pointerId); } catch(err) {}
    var p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(p[0] + 0.1, p[1] + 0.1);
    ctx.stroke();
  });
  c.addEventListener('pointermove', function(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pos(e);
    ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  });
  function end() { drawing = false; }
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
}

// ===== Route Optimization (Nearest-Neighbor) =====
function haversine(lat1, lng1, lat2, lng2) {
  var R = 3959; // miles
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function optimizeRoute(assetIds) {
  // Group assets by unique location (lat/lng)
  var stops = [];
  var seenAddr = {};
  assetIds.forEach(function(id) {
    var a = ASSETS.find(function(x) { return x.id === id; });
    if (!a) return;
    var key = (a.address || '') + '|' + (a.city || '');
    if (!seenAddr[key]) {
      seenAddr[key] = { lat: a.lat, lng: a.lng, ids: [id], addr: key };
      stops.push(seenAddr[key]);
    } else {
      seenAddr[key].ids.push(id);
    }
  });
  if (stops.length <= 1) {
    var flat = [];
    stops.forEach(function(s, i) { s.ids.forEach(function(id) { flat.push({ id: id, order: i }); }); });
    return flat;
  }
  // Nearest-neighbor from first stop
  var ordered = [stops[0]];
  var remaining = stops.slice(1);
  while (remaining.length > 0) {
    var last = ordered[ordered.length - 1];
    var nearIdx = 0, nearDist = Infinity;
    for (var i = 0; i < remaining.length; i++) {
      var d = haversine(last.lat, last.lng, remaining[i].lat, remaining[i].lng);
      if (d < nearDist) { nearDist = d; nearIdx = i; }
    }
    ordered.push(remaining[nearIdx]);
    remaining.splice(nearIdx, 1);
  }
  var flat = [];
  ordered.forEach(function(s, i) { s.ids.forEach(function(id) { flat.push({ id: id, order: i }); }); });
  return flat;
}

// ===== Photo Handling =====
// The compressed copy is what the REPORT carries — 1000px / q0.5, about 65 KB,
// so a full route uploads on a store's bad signal. The ORIGINAL is kept in
// memory alongside it purely so "save to my phone" can hand back the real
// photograph rather than the shrunken one; a backup you cannot read is not a
// backup. It is a reference to the file the picker already gave us, so it costs
// nothing, and it deliberately does NOT go into the saved draft (localStorage
// cannot hold it, and the draft already overflows on the compressed copies).
function compressImg(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var c = document.createElement('canvas');
      var max = 1000;
      var w = img.width, h = img.height;
      if (w > max || h > max) { var r = Math.min(max/w, max/h); w *= r; h *= r; }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.5));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Photos are tagged: 'plate' (the unit's serial plate — REQUIRED to submit a
// PM), 'unit' (the equipment in place), 'site' (storefront, exception visits),
// 'other' (supplemental). Plate/unit/site photos come from the camera capture
// input only — no gallery picker — and every photo is fingerprinted (SHA-256)
// and refused if the same image bytes already back another report. Both
// controls exist because invoice #172825 shipped 43 reports carrying 17
// gallery images reused across stores; a plate photo must be an image of THIS
// unit's plate, taken here, now.
var PHOTO_KINDS = { unit: 'Full pic of unit', plate: 'Serial plate', bottom: 'Bottom of unit', interior: 'Inside of cooler (no serial plate)', site: 'Storefront / site', other: 'Other' };
// The three shots every PM must carry, in the order they are asked for. 'site'
// belongs to exception reports and 'other' is supplemental — neither is part of
// the required set. Older reports carry 'other' photos from before the tags
// existed; PHOTO_KINDS still labels them so history keeps reading correctly.
var REQUIRED_PHOTOS = [
  { kind: 'unit',   label: 'Full pic of unit', hint: 'the whole cabinet where it stands' },
  { kind: 'plate',  label: 'Serial plate',     hint: 'close enough to read the serial' },
  { kind: 'bottom', label: 'Bottom of unit',   hint: 'underneath — condenser and floor' }
];
// When there is no plate to photograph, the shot that replaces it is the inside
// of the cooler. The count stays at three: a unit we cannot identify needs MORE
// evidence of what was actually serviced, not less.
var NO_PLATE_SHOT = { kind: 'interior', label: 'Inside of cooler', hint: 'shelves and interior — this stands in for the plate' };
function requiredPhotos() {
  if (!form || !form.noSerialPlate) return REQUIRED_PHOTOS;
  return REQUIRED_PHOTOS.map(function(r) { return r.kind === 'plate' ? NO_PLATE_SHOT : r; });
}

function normPhoto(p) { // back-compat: old drafts stored bare dataURL strings
  return (typeof p === 'string') ? { d: p, kind: 'other', hash: null } : p;
}
function photoCount(kind) {
  return photos.filter(function(p) { return normPhoto(p).kind === kind; }).length;
}
function platePhotoCount() { return photoCount('plate'); }
// Which of the three required shots are still missing, in ask order.
function missingPhotos() {
  return requiredPhotos().filter(function(r) { return !photoCount(r.kind); });
}

// hash -> earliest {store, pm_date} that already uses that exact image
function photoHashIndex() {
  var idx = {};
  completedPMs.forEach(function(pm) {
    (pm.photo_hashes || []).forEach(function(h) {
      if (h && !idx[h]) idx[h] = { store: pm.store, pm_date: pm.pm_date, id: pm.id };
    });
  });
  return idx;
}

function sha256Hex(str) {
  var bytes = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', bytes).then(function(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
}

// The phone asks: Take Photo, or Photo Library. It used to force the camera
// with capture='environment', and that one attribute caused most of the grief
// in the field:
//   * iOS opens the camera INSIDE the browser, so the shot never reaches the
//     camera roll — the tech has no copy of his own work;
//   * coming back from that in-browser camera can RELOAD the page, which is how
//     a half-finished re-shoot ends up restored from a draft;
//   * and a photo already taken on the phone (a clear plate shot from two
//     minutes earlier) could not be used at all — the tech had to re-stage it.
// Integrity does not rest on this attribute and never did: handlePhotos
// fingerprints every image and refuses one that is already on ANY report, on
// this phone or anyone else's, which is the control that actually caught the
// re-used plates.
function takePhoto(kind) {
  var i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*';
  i.onchange = function() { handlePhotos(i, kind || 'other'); };
  i.click();
}

function uploadPhoto() {
  var i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
  i.onchange = function() { handlePhotos(i, 'other'); };
  i.click();
}

function handlePhotos(input, kind) {
  var files = input.files;
  for (var j = 0; j < files.length; j++) {
    (function(f) {
      compressImg(f, function(d) {
        sha256Hex(d).then(function(hash) {
          var dupHere = photos.some(function(p) { return normPhoto(p).hash === hash; });
          if (dupHere) { showStatus('That photo is already attached to this report', 'err'); render(); return; }
          var prior = photoHashIndex()[hash];
          if (prior && prior.id !== reopenPmId) {
            showStatus('Duplicate photo refused — this exact image is already on the ' + (prior.store || 'another') + ' report from ' + (prior.pm_date || '') + '. Take a new photo of THIS unit.', 'err');
            render();
            return;
          }
          photos.push({ d: d, kind: kind || 'other', hash: hash, file: f });
          saveProgress(); render();
        }).catch(function() {
          // hashing unavailable (non-secure context) — attach without a
          // fingerprint rather than lose the photo; server keeps the record
          photos.push({ d: d, kind: kind || 'other', hash: null, file: f });
          saveProgress(); render();
        });
      });
    })(files[j]);
  }
}

// ── Saving the photos to the phone's own camera roll ────────────────────────
//
// This is not a nicety. A photo taken through the in-app file picker does not
// reach the camera roll — on iOS "Take Photo" from a web page hands the image
// straight to the page and keeps nothing. So the manual's "keep the photos on
// your phone just in case" was advice the app gave no way to follow. Now it
// does. (Choosing an existing shot from the library is the one case where he
// already has his own copy.)
//
// navigator.share({files}) is the path that actually lands in Photos: iOS
// offers "Save N Images" and Android "Save to Photos". An <a download> per file
// is the desktop fallback and lands in the Downloads folder, which is fine
// there and useless on a phone — so the share sheet is tried first and the
// fallback says which one you got.
//
// It must run from a real tap. Every await in submitForm breaks the user
// gesture on iOS, which is why this is a button the tech presses AFTER the
// submit rather than something the submit does for them.
var savedPhotoSet = null;   // { files, store, serial } offered after a submit
var savingPhotos = false;

function photoFilesFor(list, base){
  var files = [];
  for (var i = 0; i < list.length; i++) {
    var p = normPhoto(list[i]);
    var name = base + '-' + (i + 1) + '-' + (p.kind || 'photo') + '.jpg';
    // The original when we still have it, the compressed copy when we do not
    // (a draft restored from localStorage, or a photo taken in an earlier
    // session). Saving the small one beats saving nothing.
    if (p.file) files.push(new File([p.file], name, { type: p.file.type || 'image/jpeg' }));
    else if (p.d) { try { files.push(new File([dataURLtoBlob(p.d)], name, { type: 'image/jpeg' })); } catch(e) {} }
  }
  return files;
}

async function savePhotosToPhone(){
  if (savingPhotos) return;
  var set = savedPhotoSet;
  if (!set || !set.files.length) { showStatus('No photos to save', 'err'); render(); return; }
  savingPhotos = true; render();
  try {
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: set.files }))) {
      await navigator.share({ files: set.files, title: set.store || 'PM photos' });
      showStatus(set.files.length + ' photo' + (set.files.length === 1 ? '' : 's') + ' handed to your phone — choose Save Image', 'ok');
    } else {
      set.files.forEach(function(f, idx){
        setTimeout(function(){
          var a = document.createElement('a');
          a.href = URL.createObjectURL(f);
          a.download = f.name;
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
        }, idx * 300);
      });
      showStatus('Downloading ' + set.files.length + ' photo' + (set.files.length === 1 ? '' : 's') + ' — check your Downloads', 'info');
    }
    savedPhotoSet = null;
  } catch (err) {
    // Closing the share sheet is not a failure — it is a choice, and it must
    // leave the offer on screen so it can be taken again.
    if (err && err.name === 'AbortError') { savingPhotos = false; render(); return; }
    showStatus('Could not save the photos: ' + (err && err.message ? err.message : 'unknown error'), 'err');
  }
  savingPhotos = false;
  render();
}
function dismissPhotoSave(){ savedPhotoSet = null; render(); }

    + '<div style="font-size:14px;color:var(--dim);margin-bottom:10px">'
    + esc(savedPhotoSet.store || '') + (savedPhotoSet.serial ? ' &middot; S/N ' + esc(savedPhotoSet.serial) : '')
    + ' &mdash; the report is filed. Photos taken in the app do <strong>not</strong> reach your camera roll on their own.</div>'
    + '<button class="btn btn-s" style="margin:0 0 8px" onclick="savePhotosToPhone()"' + (savingPhotos ? ' disabled' : '') + '>'
    + (savingPhotos ? 'Saving…' : icon('camera') + ' Save to my phone') + '</button>'

    + '</div>';

// Does the note on this submission need a person to read it?
// A blank note does not. A note identical to the one already on file does not
// either — that is an edit to something else, and re-raising it would undo a
// clearing somebody has already made.
function noteRaisesIssue(f, prev){
  var note = String((f && f.comments) || '').trim();
  if (!note) return false;
  var before = String((prev && prev.form_data && prev.form_data.comments) || '').trim();
  return note !== before;
}

function removePhoto(i) {
  photos.splice(i, 1);

// ===== Render Router =====
function render() {
  var el = document.getElementById('app');
  var html = '';
  if (statusMsg) {
    html += '<div class="status ' + statusType + '">' + esc(statusMsg) + '</div>';
  }
  // The offer of a camera-roll copy rides on whichever screen the submit landed
  // on (route or home), directly under the confirmation, rather than adding a
  // screen between the tech and the next stop.
  html += photoSaveCard();
  if (screen === 'loading') { html += renderLoading(); }
  else if (screen === 'login') { html += renderLogin(); }
  else if (screen === 'home') { html += renderHome(); }
  else if (screen === 'select') { html += renderSelect(); }
  else if (screen === 'checklist') { html += renderChecklist(); }
  else if (screen === 'history') { html += renderHistory(); }
  else if (screen === 'pay') { html += renderPay(); }
  else if (screen === 'admin') { html += renderAdmin(); }
  else if (screen === 'route') { html += renderRoute(); }
  else if (screen === 'addAsset') { html += renderAddAsset(); }
  else if (screen === 'exception') { html += renderException(); }
  if (sigModalKey) { html += renderSigModal(); }
  // The paper is light blue and so is the screen. A tech filling this in should
  // know from across the van that they are on an audit form and not an ordinary
  // PM \u2014 the ask behind this whole re-shoot list was documentation nobody
  // realised was any different from an ordinary day's.
  document.body.classList.toggle('audit',
    screen === 'checklist' && !!(form && form.reshoot_of_pm_id));
  document.body.classList.toggle('exception', screen === 'exception');
  el.innerHTML = html;
  bindEvents();
  // Coming back from a PM, put the store you were at back under your thumb
  // instead of at the top of a twenty-stop list.
  if (scrollToStopIdx != null && screen === 'route') {
    var target = document.getElementById('stop' + scrollToStopIdx);
    if (target) target.scrollIntoView({ block: 'start' });
    scrollToStopIdx = null;
  }
}

// ===== Weekly Pay (tech) =====
function fmtD(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function weekRangeFor(offset) {
  var ws = new Date();
  ws.setHours(0, 0, 0, 0);
  ws.setDate(ws.getDate() - ((ws.getDay() + 6) % 7) + offset * 7); // Monday
  var we = new Date(ws);
  we.setDate(we.getDate() + 6); // Sunday
  return { start: fmtD(ws), end: fmtD(we) };
}
function payWeekRange() { return weekRangeFor(payWeekOffset); }
function fee$(n) { return '$' + Number(n || 0).toFixed(2); }

// Each PM a tech completed in the given week = one paid line item (per asset)
function weekItemsFor(userId, rate, range) {
  return completedPMs.filter(function(pm) {
    return pm.tech_user_id === userId && !pm.prev_comp && pm.pm_date >= range.start && pm.pm_date <= range.end;
  }).map(function(pm) {
    var a = ASSETS.find(function(x) { return x.id === pm.asset_id; });
    return {
      pm_date: pm.pm_date,
      store: pm.store,
      city: a ? a.city : '',
      serial: pm.serial,
      model: a ? a.model : '',
      fee: rate != null ? rate : (a ? Number(a.pm_fee || 0) : 0)
    };
  });
}
function myWeekItems(range) { return weekItemsFor(currentUser.id, myRate, range); }

function groupItemsByStore(items) {
  var groups = {}, order = [];
  items.forEach(function(it) {
    var key = it.store + '|' + it.city;
    if (!groups[key]) { groups[key] = { store: it.store, city: it.city, items: [] }; order.push(key); }
    groups[key].items.push(it);
  });
  return order.map(function(k) { return groups[k]; });
}

}

function renderPay() {

  h += '<div class="card" style="text-align:center">';

    '<button class="btn btn-o" style="width:auto;padding:8px 14px" onclick="payWeekOffset--;render()">\u2190</button>' +

  h += '<div style="color:var(--dim);font-size:13px">' + items.length + ' asset' + (items.length === 1 ? '' : 's') + ' at ' + groups.length + ' store' + (groups.length === 1 ? '' : 's') + '</div>';
  if (myRate != null) {
    h += '<div style="color:var(--gn);font-size:12px;margin-top:4px">Your rate: ' + fee$(myRate) + ' per PM</div>';
  }
  h += '</div>';

  groups.forEach(function(g) {
    var sub = g.items.reduce(function(s, x) { return s + x.fee; }, 0);
    h += '<div class="hist-item">';
    h += '<div style="display:flex;justify-content:space-between"><strong>' + esc(g.store) + '</strong><span style="font-weight:700;color:var(--gn)">' + fee$(sub) + '</span></div>';
    g.items.forEach(function(it) {
      h += '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:2px 0 0 8px">' +
        '<span>' + esc(it.model || 'Unit') + ' \u2022 S/N ' + esc(it.serial) + ' \u2022 ' + esc(it.pm_date) + '</span>' +
        '<span>' + fee$(it.fee) + '</span>' +
      '</div>';
    });
    h += '</div>';
  });
  if (!items.length) {
    h += '<p style="text-align:center;color:var(--dim);padding:20px 0">No completed PMs this week</p>';
  }

  if (existing) {
    h += '<div class="card" style="text-align:center;border-color:var(--gn)">' +
      (existing.status === 'paid' ? '\u2705 Payout PAID \u2014 ' : '\ud83d\udce8 Payout submitted \u2014 ') +
      fee$(existing.amount) + ' for ' + (Array.isArray(existing.details) ? existing.details.length : existing.store_count) + ' asset PM(s)' +
    '</div>';
    h += '<button class="btn btn-p" style="margin-top:8px" onclick="printPayout(' + existing.id + ')">\ud83d\udda8\ufe0f Print Payout Form (PDF)</button>';
  } else if (items.length > 0) {
    if (submittingPayout) {
      h += '<div class="card" style="text-align:center"><span class="spinner"></span> Submitting...</div>';
    } else {
      h += '<button class="btn btn-s" style="margin-top:10px" onclick="submitPayout()">\ud83d\udce8 Submit Weekly Payout (' + fee$(total) + ')</button>';
      h += '<button class="btn btn-o" style="margin-top:8px" onclick="printPayout(null)">\ud83d\udda8\ufe0f Print Payout Form (PDF)</button>';
    }
  }
  return h;
}

async function submitPayout() {
  if (submittingPayout) return;
  var range = payWeekRange();
  var items = myWeekItems(range);
  if (!items.length) return;
  var total = items.reduce(function(s, x) { return s + x.fee; }, 0);
  var storeCount = groupItemsByStore(items).length;
  if (!confirm('Submit payout of ' + fee$(total) + ' for ' + items.length + ' asset PM(s) at ' + storeCount + ' store(s), week ' + range.start + ' \u2013 ' + range.end + '?')) return;

  submittingPayout = true;
  render();
  var { error } = await sb.from('payouts').insert({
    tech_email: currentUser.email,
    week_start: range.start,
    week_end: range.end,
    store_count: storeCount,
    amount: total,
    details: items
  });
  submittingPayout = false;
  if (error) {
    if (error.code === '23505') { showStatus('Payout already submitted for this week', 'err'); }
    else { showStatus('Error: ' + error.message, 'err'); }
  } else {
    showStatus('Payout submitted!', 'ok');
  }
  await loadPayouts();
  render();
}

function printPayout(payoutId) {
  var range = payWeekRange();

    if (!p) return;
    info = { techName: myTechName(), techEmail: p.tech_email, weekStart: p.week_start, weekEnd: p.week_end,
             items: Array.isArray(p.details) ? p.details : [], amount: Number(p.amount), status: p.status, submitted: p.created_at };

             items: items, amount: items.reduce(function(s, x) { return s + x.fee; }, 0), status: 'draft', submitted: null };
  }
  generatePayoutPDF(info);
}

function printTechWeek(email, offset) {
  var prof = techProfiles.find(function(t) { return t.email === email; });
  if (!prof || !prof.user_id) { showStatus('This tech has not signed in since rates were added — ask them to open the app once', 'err'); return; }
  var range = weekRangeFor(offset);
  var rate = prof.pm_rate != null && Number(prof.pm_rate) > 0 ? Number(prof.pm_rate) : null;
  var items = weekItemsFor(prof.user_id, rate, range);
  if (!items.length) { showStatus('No PMs for this tech that week', 'err'); return; }
  var payout = payouts.find(function(p) { return p.tech_email === email && p.week_start === range.start; });
  generatePayoutPDF({
    techName: prof.name || prof.email, techEmail: prof.email,
    weekStart: range.start, weekEnd: range.end, items: items,
    amount: items.reduce(function(s, x) { return s + x.fee; }, 0),
    status: payout ? payout.status : 'unsubmitted', submitted: payout ? payout.created_at : null
  });
}

function printAdminPayout(payoutId) {
  var p = payouts.find(function(x) { return x.id === payoutId; });
  if (!p) return;
  var tech = techProfiles.find(function(t) { return t.email === p.tech_email; });
  generatePayoutPDF({ techName: tech ? (tech.name || tech.email) : p.tech_email, techEmail: p.tech_email,
    weekStart: p.week_start, weekEnd: p.week_end, items: Array.isArray(p.details) ? p.details : [],
    amount: Number(p.amount), status: p.status, submitted: p.created_at });
}

function generatePayoutPDF(info) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'letter' });
  var W = 612, LM = 48, RM = W - 48, COL2 = 330;
  var y = 52;

  function header() {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
    doc.text('TECHNICIAN PAYOUT INVOICE', W / 2, y, { align: 'center' }); y += 26;
    doc.setFontSize(10);
    doc.text('BILL TO:', LM, y); doc.text('FROM (TECHNICIAN):', COL2, y); y += 14;
    doc.setFont('helvetica', 'normal');
    doc.text('Brixpense', LM, y); doc.text(info.techName, COL2, y); y += 13;
    doc.text('Brix Beverage', LM, y); doc.text(info.techEmail, COL2, y); y += 20;
    doc.setFont('helvetica', 'bold');
    doc.text('Pay Period:', LM, y); doc.setFont('helvetica', 'normal');
    doc.text(info.weekStart + '  through  ' + info.weekEnd, LM + 70, y);
    doc.setFont('helvetica', 'bold');
    doc.text('Status:', COL2, y); doc.setFont('helvetica', 'normal');
    doc.text((info.status || 'draft').toUpperCase() + (info.submitted ? '  (' + String(info.submitted).split('T')[0] + ')' : ''), COL2 + 45, y);
    y += 16;
    doc.setLineWidth(1); doc.line(LM, y, RM, y); y += 16;
    tableHead();
  }

  function tableHead() {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('Date', LM, y);
    doc.text('Store', LM + 70, y);
    doc.text('Serial #', LM + 290, y);
    doc.text('Fee', RM, y, { align: 'right' });
    y += 6; doc.setLineWidth(.5); doc.line(LM, y, RM, y); y += 13;
    doc.setFont('helvetica', 'normal');
  }

  header();
  info.items.forEach(function(it) {
    if (y > 700) { doc.addPage(); y = 52; tableHead(); }
    doc.setFontSize(9);
    doc.text(String(it.pm_date || ''), LM, y);
    doc.text(String(it.store || '').substring(0, 42), LM + 70, y);
    doc.text(String(it.serial || ''), LM + 290, y);
    doc.text(fee$(it.fee), RM, y, { align: 'right' });
    y += 14;
  });

  y += 4; doc.setLineWidth(1); doc.line(LM, y, RM, y); y += 18;
  if (y > 690) { doc.addPage(); y = 52; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
  doc.text('TOTAL DUE: ' + fee$(info.amount), RM, y, { align: 'right' });
  doc.setFontSize(9);
  doc.text(info.items.length + ' asset PM(s)', LM, y);
  y += 44;
  if (y > 720) { doc.addPage(); y = 80; }
  doc.setLineWidth(.5);
  doc.line(LM, y, LM + 200, y); doc.line(COL2, y, COL2 + 180, y); y += 12;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
  doc.text('Technician Signature / Date', LM, y);
  doc.text('Approved By (Brixpense) / Date', COL2, y);

  doc.save('Payout_' + info.techEmail.split('@')[0] + '_' + info.weekStart + '.pdf');
}

// ===== Share PDF (email/text to Freshpet) =====
async function sharePDF(path) {
  var url = SUPA_URL + '/storage/v1/object/public/fp-pdfs/' + path;
  try {
    if (navigator.share) {
      var resp = await fetch(url);
      var blob = await resp.blob();
      var file = new File([blob], path.split('/').pop(), { type: 'application/pdf' });
      if (!navigator.canShare || navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Freshpet PM Report' });
        return;
      }
    }
  } catch(e) {
    if (e.name === 'AbortError') return; // user closed the share sheet
  }
  window.open(url, '_blank');
}

    h += renderAdminRoutes();
  } else if (adminTab === 'import') {
    h += renderAdminImport();
  } else if (adminTab === 'reports') {
    h += renderAdminReports();
  } else if (adminTab === 'pay') {
    h += renderAdminPay();
  } else {
    h += renderAdminReview();
  }
  return h;
}

// ===== ADMIN PAY (fees & payout requests) =====
function renderAdminPay() {
  var h = '';

  // ---- Weekly Pay by Technician ----
  var range = weekRangeFor(adminPayWeekOffset);
  h += '<div class="card">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<button class="btn btn-o" style="width:auto;padding:8px 14px" onclick="adminPayWeekOffset--;render()">←</button>' +
    '<div style="text-align:center"><div style="font-size:13px;color:var(--dim)">Pay week</div><strong>' + range.start + ' – ' + range.end + '</strong></div>' +
    '<button class="btn btn-o" style="width:auto;padding:8px 14px;opacity:' + (adminPayWeekOffset >= 0 ? '.3' : '1') + '" onclick="if(adminPayWeekOffset<0){adminPayWeekOffset++;render()}">→</button>' +
  '</div></div>';

  // Group all completed PMs in the week by technician (auth user id)
  var byTech = {}, techOrder = [];
  completedPMs.forEach(function(pm) {
    if (pm.prev_comp) return;
    if (pm.pm_date < range.start || pm.pm_date > range.end) return;
    var uid = pm.tech_user_id || ('name:' + (pm.tech_name || '?'));
    if (!byTech[uid]) { byTech[uid] = { uid: pm.tech_user_id, name: pm.tech_name || '(unknown)', count: 0 }; techOrder.push(uid); }
    byTech[uid].count++;
  });

  var grand = 0;
  if (!techOrder.length) {
    h += '<p style="text-align:center;color:var(--dim);padding:16px 0">No PMs completed this week</p>';
  }
  techOrder.forEach(function(uid) {
    var g = byTech[uid];
    var prof = techProfiles.find(function(t) { return g.uid && t.user_id === g.uid; });
    var rate = prof && prof.pm_rate != null && Number(prof.pm_rate) > 0 ? Number(prof.pm_rate) : null;
    var items = g.uid ? weekItemsFor(g.uid, rate, range) : [];
    var total = items.reduce(function(s, x) { return s + x.fee; }, 0);
    grand += total;
    var payout = payouts.find(function(p) { return prof && p.tech_email === prof.email && p.week_start === range.start; });

    h += '<div class="hist-item">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
    h += '<span style="flex:1;cursor:pointer" onclick="adminPayExpand[\'' + uid + '\']=!adminPayExpand[\'' + uid + '\'];render()">' +
      '<strong style="font-size:16px">' + esc(prof ? (prof.name || prof.email) : g.name) + '</strong>' +
      (rate != null ? ' <span class="badge" style="background:var(--dim)">' + fee$(rate) + '/PM</span>' : '') +
      (payout ? (payout.status === 'paid' ? ' <span class="badge" style="background:var(--gn)">PAID</span>' : ' <span class="badge">SUBMITTED</span>') : '') +
      '<br><span style="color:var(--dim);font-size:13px">' + g.count + ' PM' + (g.count === 1 ? '' : 's') + ' &bull; tap to ' + (adminPayExpand[uid] ? 'hide' : 'view') + '</span></span>';
    h += '<span style="font-weight:700;font-size:18px;color:var(--gn)">' + fee$(total) + '</span>';
    h += '</div>';
    if (adminPayExpand[uid]) {
      groupItemsByStore(items).forEach(function(grp) {
        var sub = grp.items.reduce(function(s, x) { return s + x.fee; }, 0);
        h += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><strong>' + esc(grp.store) + '</strong><span>' + fee$(sub) + '</span></div>';
        grp.items.forEach(function(it) {
          h += '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding-left:8px">' +
            '<span>' + esc(it.serial) + ' &bull; ' + esc(it.pm_date) + '</span><span>' + fee$(it.fee) + '</span></div>';
        });
      });
      if (prof) {
        h += '<button class="btn btn-o" style="margin-top:8px;padding:8px;font-size:13px" onclick="printTechWeek(\'' + esc(prof.email).replace(/'/g, "\\'") + '\',' + adminPayWeekOffset + ')">'+icon('printer')+' Print Payout Invoice</button>';
        if (payout && payout.status !== 'paid') {
          h += '<button class="btn btn-s" style="margin-top:6px;padding:8px;font-size:13px" onclick="markPayoutPaid(' + payout.id + ')">✓ Mark Paid</button>';

      '<strong>Week Total</strong><strong style="font-size:20px;color:var(--gn)">' + fee$(grand) + '</strong></div>';

  h += '<h3 style="margin:18px 0 10px">Payout Requests</h3>';
  if (!payouts.length) {
    h += '<p style="color:var(--dim);font-size:13px;margin-bottom:14px">No payouts submitted yet.</p>';
  }
  payouts.forEach(function(p) {
    var tech = techProfiles.find(function(t) { return t.email === p.tech_email; });
    var nAssets = Array.isArray(p.details) ? p.details.length : 0;
    h += '<div class="hist-item">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
    h += '<span style="flex:1"><strong>' + esc(tech ? (tech.name || tech.email) : p.tech_email) + '</strong> \u2022 ' + fee$(p.amount) +
      '<br><span style="color:var(--dim);font-size:11px">' + esc(p.week_start) + ' \u2013 ' + esc(p.week_end) + ' \u2022 ' + nAssets + ' asset PM' + (nAssets === 1 ? '' : 's') + ' / ' + p.store_count + ' store' + (p.store_count === 1 ? '' : 's') + '</span></span>';
    if (p.status === 'paid') {
      h += '<span class="badge" style="background:var(--gn)">PAID</span>';
    } else {
      h += '<button class="btn btn-s" style="width:auto;padding:8px 14px;font-size:12px" onclick="markPayoutPaid(' + p.id + ')">Mark Paid</button>';
    }
    h += '<button class="btn btn-o" style="width:auto;padding:8px 10px;font-size:12px" onclick="printAdminPayout(' + p.id + ')">\ud83d\udda8\ufe0f</button>';
    h += '</div></div>';
  });

  h += '<h3 style="margin:16px 0 10px">Tech Rates (per PM)</h3>';
  h += '<p style="font-size:12px;color:var(--dim);margin-bottom:8px">A tech with a rate gets that flat amount for every PM they complete. Leave at 0 to pay the per-asset fees below instead.</p>';

    h += '<input type="number" id="rate_' + ti + '" value="' + (t.pm_rate != null ? Number(t.pm_rate).toFixed(2) : '0.00') + '" step="0.01" min="0" style="width:80px;margin-bottom:0;text-align:right">';
    h += '<button class="btn btn-o" style="width:auto;padding:8px 12px;font-size:12px" onclick="saveTechRate(' + ti + ',\'' + esc(t.email).replace(/'/g, "\\'") + '\')">Save</button>';
    h += '</div>';
  });

  // Per-asset PM fees
  h += '<h3 style="margin:16px 0 10px">PM Fees (per asset)</h3>';

  h += '<div style="display:flex;gap:8px;align-items:center">';

  h += '</div>';
  h += '<p style="font-size:11px;color:var(--dim);margin-top:6px">Sets every asset to this fee. Then adjust per store or per asset below.</p>';
  h += '</div>';
  h += '<div class="search"><input type="text" id="feeSearchInput" placeholder="Search store, city, serial..." value="' + esc(feeSearch) + '"></div>';

  var groups = {}, order = [];
  ASSETS.forEach(function(a) {
    if (feeSearch) {
      var s = feeSearch.toLowerCase();
      if (a.store.toLowerCase().indexOf(s) === -1 && a.city.toLowerCase().indexOf(s) === -1 && a.serial.toLowerCase().indexOf(s) === -1) return;
    }
    var key = a.store + '|' + a.address;
    if (!groups[key]) { groups[key] = { store: a.store, address: a.address, city: a.city, assets: [] }; order.push(key); }
    groups[key].assets.push(a);

  if (feeSearch && !order.length) {
    h += '<p style="text-align:center;color:var(--dim);padding:20px 0">No stores found</p>';
  }
  var shown = feeSearch ? order.slice(0, 40) : order.slice(0, 15);
  shown.forEach(function(key, gi) {
    var g = groups[key];
    h += '<div class="store-grp">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">';
    h += '<h4 style="flex:1;margin:0">\ud83d\udccd ' + esc(g.store) + ' \u2014 ' + esc(g.city) + '</h4>';
    h += '<input type="number" id="storefee_' + gi + '" placeholder="$" step="0.01" min="0" style="width:70px;margin-bottom:0;text-align:right">';

      h += '<input type="number" id="fee_' + a.id + '" value="' + Number(a.pm_fee || 0).toFixed(2) + '" step="0.01" min="0" style="width:80px;margin-bottom:0;text-align:right">';
      h += '<button class="btn btn-o" style="width:auto;padding:8px 12px;font-size:12px" onclick="saveAssetFee(' + a.id + ')">Save</button>';
      h += '</div>';
    });
    h += '</div>';
  });
  if (order.length > shown.length) {
    h += '<p style="text-align:center;color:var(--dim);font-size:12px;padding:10px 0">Showing ' + shown.length + ' of ' + order.length + ' stores \u2014 search to find others</p>';
  }
  return h;
}

async function saveTechRate(ti, email) {
  var el = document.getElementById('rate_' + ti);
  var f = parseFloat(el && el.value);
  if (isNaN(f) || f < 0) { showStatus('Enter a valid rate', 'err'); return; }
  var rate = f > 0 ? f : null;
  var { error } = await sb.from('tech_profiles').update({ pm_rate: rate }).eq('email', email);
  if (error) { showStatus('Error: ' + error.message, 'err'); return; }
  var t = techProfiles.find(function(x) { return x.email === email; });
  if (t) t.pm_rate = rate;
  if (currentUser && currentUser.email === email) { myRate = rate; }
  showStatus(rate ? ('Rate set to ' + fee$(rate) + ' per PM') : 'Rate cleared — per-asset fees apply', 'ok');
}

async function markPayoutPaid(id) {
  var { error } = await sb.from('payouts').update({ status: 'paid' }).eq('id', id);
  if (error) { showStatus('Error: ' + error.message, 'err'); return; }
  showStatus('Payout marked paid', 'ok');
  await loadPayouts();
  render();
}

async function saveAssetFee(assetId) {
  var el = document.getElementById('fee_' + assetId);
  var f = parseFloat(el && el.value);
  if (isNaN(f) || f < 0) { showStatus('Enter a valid fee', 'err'); return; }
  var { error } = await sb.from('assets').update({ pm_fee: f }).eq('id', assetId);
  if (error) { showStatus('Error: ' + error.message, 'err'); return; }
  var a = ASSETS.find(function(x) { return x.id === assetId; });
  if (a) a.pm_fee = f;
  showStatus('Fee set to ' + fee$(f), 'ok');
}

async function saveStoreFee(gi, store, address) {
  var el = document.getElementById('storefee_' + gi);
  var f = parseFloat(el && el.value);
  if (isNaN(f) || f < 0) { showStatus('Enter a fee in the store box first', 'err'); return; }
  var { error } = await sb.from('assets').update({ pm_fee: f }).eq('store', store).eq('address', address);
  if (error) { showStatus('Error: ' + error.message, 'err'); return; }
  ASSETS.forEach(function(a) { if (a.store === store && a.address === address) a.pm_fee = f; });
  showStatus(store + ': all assets set to ' + fee$(f), 'ok');
  render();
}

async function setAllFees() {
  var el = document.getElementById('bulkFee');
  var f = parseFloat(el && el.value);
  if (isNaN(f) || f < 0) { showStatus('Enter a valid fee', 'err'); return; }
  if (!confirm('Set the PM fee for ALL ' + ASSETS.length + ' assets to ' + fee$(f) + '?')) return;
  var { error } = await sb.from('assets').update({ pm_fee: f }).eq('active', true);
  if (error) { showStatus('Error: ' + error.message, 'err'); return; }
  ASSETS.forEach(function(a) { a.pm_fee = f; });
  showStatus('All assets set to ' + fee$(f), 'ok');
  render();
}

// ===== ADMIN REPORTS (bulk PDF send) =====
function getReportList() {
  return completedPMs.filter(function(pm) {
    if (!pm.pdf_path) return false;
    if (reportFrom && pm.pm_date < reportFrom) return false;
    if (reportTo && pm.pm_date > reportTo) return false;
    return true;
  });
}

function renderAdminReports() {
  var h = '<div class="card">';
  h += '<h3>Send PM Reports</h3>';
  h += '<p style="font-size:12px;color:var(--dim);margin-bottom:8px">Select completed PMs and send all their PDFs to Freshpet in one go.</p>';
  h += '<div style="display:flex;gap:8px">' +
    '<div style="flex:1">' + lbl('From') + '<input type="date" value="' + esc(reportFrom) + '" onchange="reportFrom=this.value;render()"></div>' +
    '<div style="flex:1">' + lbl('To') + '<input type="date" value="' + esc(reportTo) + '" onchange="reportTo=this.value;render()"></div>' +
  '</div>';
  h += '</div>';

  var list = getReportList();
  var selCount = list.filter(function(pm) { return reportSel[pm.id]; }).length;

  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  h += '<h3 style="margin:0">' + list.length + ' Report' + (list.length === 1 ? '' : 's') + '</h3>';
  if (list.length) {
    h += '<button class="btn btn-o" style="width:auto;padding:6px 12px;font-size:12px" onclick="toggleAllReports()">' +
      (selCount === list.length ? 'Select None' : 'Select All') + '</button>';
  }
  h += '</div>';

  if (sharingReports) {
    h += '<div class="card" style="text-align:center"><span class="spinner"></span> Preparing ' + selCount + ' PDF' + (selCount === 1 ? '' : 's') + '...</div>';
  } else if (selCount > 0) {
    h += '<button class="btn btn-s" style="margin-bottom:10px" onclick="shareSelectedReports()">'+icon('upload')+' Send ' + selCount + ' PDF' + (selCount === 1 ? '' : 's') + '</button>';
  }

  list.forEach(function(pm) {
    h += '<label class="asset-check"><input type="checkbox" onchange="reportSel[' + pm.id + ']=this.checked;render()"' + (reportSel[pm.id] ? ' checked' : '') + '>';
    h += '<span style="flex:1"><strong>' + esc(pm.store) + '</strong> &bull; <span style="color:var(--gn)">' + esc(pm.pm_date) + '</span>' +
      '<br><span style="color:var(--dim);font-size:11px">S/N ' + esc(pm.serial) + (pm.tech_name ? ' &bull; ' + esc(pm.tech_name) : '') + '</span></span></label>';
  });
  if (!list.length) {
    h += '<p style="text-align:center;color:var(--dim);padding:20px 0">No PM reports in this date range</p>';
  }
  return h;
}

function toggleAllReports() {
  var list = getReportList();
  var allSelected = list.length > 0 && list.every(function(pm) { return reportSel[pm.id]; });
  list.forEach(function(pm) { reportSel[pm.id] = !allSelected; });
  render();
}

async function shareSelectedReports() {
  if (sharingReports) return;
  var list = getReportList().filter(function(pm) { return reportSel[pm.id]; });
  if (!list.length) return;
  sharingReports = true;
  render();

  try {
    var files = [];
    for (var i = 0; i < list.length; i++) {
      var url = SUPA_URL + '/storage/v1/object/public/fp-pdfs/' + list[i].pdf_path;
      var resp = await fetch(url);
      if (!resp.ok) { throw new Error('Could not fetch PDF for ' + list[i].store + ' (' + list[i].pm_date + ')'); }
      var blob = await resp.blob();
      files.push(new File([blob], list[i].pdf_path.split('/').pop(), { type: 'application/pdf' }));
    }
    sharingReports = false;

    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: files }))) {
      await navigator.share({ files: files, title: 'Freshpet PM Reports' });
      showStatus(files.length + ' PDF' + (files.length === 1 ? '' : 's') + ' sent', 'ok');
    } else {
      // No share sheet (desktop browsers): download each file instead
      files.forEach(function(f, idx) {
        setTimeout(function() {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(f);
          a.download = f.name;
          a.click();
          setTimeout(function() { URL.revokeObjectURL(a.href); }, 10000);
        }, idx * 300);
      });
      showStatus('Share sheet not available — downloading ' + files.length + ' PDF' + (files.length === 1 ? '' : 's'), 'info');
    }
    render();
  } catch (err) {
    sharingReports = false;
    if (err.name === 'AbortError') { render(); return; } // user closed the share sheet
    showStatus('Error: ' + err.message, 'err');
    render();
  }
}

function renderUnassignedStores() {
  var assignedIds = {};
  allAssignments.forEach(function(ra) { assignedIds[ra.asset_id] = true; });
  // Group active assets by store; a store is unassigned if NONE of its assets are assigned
  var groups = {}, order = [];
  ASSETS.forEach(function(a) {
    var key = a.store + '|' + a.address;
    if (!groups[key]) { groups[key] = { store: a.store, address: a.address, city: a.city, assets: [], anyAssigned: false }; order.push(key); }
    groups[key].assets.push(a);
    if (assignedIds[a.id]) groups[key].anyAssigned = true;
  });
  var unassigned = order.map(function(k) { return groups[k]; }).filter(function(g) { return !g.anyAssigned; });
  unassigned.sort(function(a, b) { return (a.city + a.store).localeCompare(b.city + b.store); });

  var h = '<h3 style="margin-bottom:10px">Unassigned Stores (' + unassigned.length + ')</h3>';
  if (!unassigned.length) {
    h += '<div class="card" style="text-align:center;color:var(--dim)">Every store is assigned 🎉</div>';
    return h;
  }
  // Pick a tech, then assign stores straight from here
  h += '<div class="card"><h3 style="margin-top:0">Assign to</h3>';
  h += '<select id="unassignTechSelect" onchange="unassignTech=this.value;render()">';
  h += '<option value="">-- Choose Technician --</option>';
  techProfiles.forEach(function(t) {
    h += '<option value="' + esc(t.email) + '"' + (unassignTech === t.email ? ' selected' : '') + '>' + esc(t.name || t.email) + '</option>';
  });
  h += '</select></div>';

function parseCSV(text) {
  var rows = [], row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else { inQ = false; } }
      else { cur += c; }
    }
    else if (c === '"') { inQ = true; }
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); cur = ''; if (row.some(function(x){ return x.trim() !== ''; })) rows.push(row); row = []; }
    else if (c !== '\r') { cur += c; }
  }
  row.push(cur);
  if (row.some(function(x){ return x.trim() !== ''; })) rows.push(row);
  return rows;
}

// Maps Freshpet export headers (and simple ones) to asset fields
var CSV_COLMAP = {
  store: ['account name', 'store', 'store name'],
  address: ['shipping address line 1', 'address', 'shipping street'],
  city: ['shipping city', 'city'],
  state: ['shipping state/province', 'state', 'state/province'],
  zip: ['shipping zip/postal code', 'zip', 'zip/postal code', 'zip code', 'postal code'],
  phone: ['phone'],
  manufacturer: ['manufacturer'],
  model: ['model'],
  serial: ['asset: serial number', 'serial number', 'serial'],
  warranty: ['warranty status', 'warranty']
};

function mapCSVHeader(headerRow) {
  var idx = {};
  headerRow.forEach(function(cell, i) {
    var n = cell.trim().toLowerCase().replace(/^location:\s*/, '');
    for (var field in CSV_COLMAP) {
      if (idx[field] === undefined && CSV_COLMAP[field].indexOf(n) > -1) { idx[field] = i; }
    }
  });
  return idx;
}

function handleCSVFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  importFileName = file.name;
  var reader = new FileReader();
  reader.onload = function(e) { buildImportPreview(e.target.result); };
  reader.readAsText(file);
}

async function buildImportPreview(text) {
  var raw = parseCSV(text);
  if (raw.length < 2) { showStatus('CSV file appears to be empty', 'err'); return; }

  var idx = mapCSVHeader(raw[0]);
  var required = ['store', 'address', 'city', 'zip', 'serial'];
  var missing = required.filter(function(f) { return idx[f] === undefined; });
  if (missing.length) {
    showStatus('CSV is missing columns: ' + missing.join(', '), 'err');
    return;
  }

  var rows = [], skipped = [], seen = {};
  for (var i = 1; i < raw.length; i++) {
    var r = raw[i];
    var get = function(f) { return idx[f] !== undefined && r[idx[f]] !== undefined ? r[idx[f]].trim() : ''; };
    var rec = {
      store: get('store'), address: get('address'), city: get('city'),
      state: get('state') || 'CA', zip: get('zip'), phone: get('phone'),
      manufacturer: get('manufacturer'), model: get('model'),
      serial: get('serial'), warranty: get('warranty')
    };
    // Some Freshpet exports have a second section where City is inserted
    // before State, shifting city->state, state->zip, zip->city, and phone
    // ends up one column to the right.
    if (!/^\d{5}/.test(rec.zip) && /^[A-Z]{2}$/i.test(rec.zip) && /^\d{5}/.test(rec.city)) {
      var shifted = { city: rec.state, state: rec.zip, zip: rec.city };
      if (idx.phone !== undefined && r[idx.phone + 1] !== undefined && /^USA$/i.test(rec.phone)) {
        shifted.phone = r[idx.phone + 1].trim();
      }
      rec.city = shifted.city; rec.state = shifted.state; rec.zip = shifted.zip;
      if (shifted.phone) rec.phone = shifted.phone;
    }
    // Skip repeated header rows, broken serials, and rows without a usable zip
    if (/serial/i.test(rec.serial) || /header/i.test(rec.serial)) { continue; }
    if (!rec.serial || rec.serial === '#REF!' || /^:?-+:?$/.test(rec.serial)) {
      skipped.push('Row ' + (i + 1) + ': missing/invalid serial (' + (rec.store || '?') + ' ' + rec.model + ')');
      continue;
    }
    if (!/^\d{5}/.test(rec.zip)) {
      skipped.push('Row ' + (i + 1) + ': invalid zip "' + rec.zip + '" (' + rec.store + ', S/N ' + rec.serial + ')');
      continue;
    }
    var key = rec.serial.toUpperCase();
    if (seen[key]) { skipped.push('Row ' + (i + 1) + ': duplicate serial ' + rec.serial + ' (' + rec.store + ')'); continue; }
    seen[key] = true;
    rec.zip = rec.zip.substring(0, 5);
    rows.push(rec);
  }

  if (rows.length === 0) { showStatus('No valid asset rows found in file', 'err'); return; }

  // Compare against ALL assets in DB (including deactivated ones)
  var { data: existing, error } = await sb.from('assets').select('id,serial,zip,lat,lng,active,source,reported');
  if (error) { showStatus('Failed to read current assets: ' + error.message, 'err'); return; }
  var bySerial = {};
  (existing || []).forEach(function(a) { bySerial[(a.serial || '').toUpperCase()] = a; });

  var newCount = 0, updateCount = 0;
  rows.forEach(function(rec) {
    if (bySerial[rec.serial.toUpperCase()]) { updateCount++; } else { newCount++; }
  });
  var fileSerials = {};
  rows.forEach(function(rec) { fileSerials[rec.serial.toUpperCase()] = true; });
  // Field-added assets Freshpet hasn't been told about yet can never be in
  // their export — keep them instead of deactivating them on a full replace.
  var keptField = 0;
  var deactivateSerials = (existing || []).filter(function(a) {
    if (!a.active || fileSerials[(a.serial || '').toUpperCase()]) return false;
    if (a.source === 'field' && a.reported === false) { keptField++; return false; }
    return true;
  }).map(function(a) { return a.serial; });

  importPreview = { rows: rows, newCount: newCount, updateCount: updateCount, deactivateSerials: deactivateSerials, keptField: keptField, skipped: skipped, existingBySerial: bySerial };
  render();
}

async function geocodeZip(zip, cache) {
  if (cache[zip] !== undefined) return cache[zip];
  try {
    var resp = await fetch('https://api.zippopotam.us/us/' + zip);
    if (resp.ok) {
      var d = await resp.json();
      var p = d.places && d.places[0];
      cache[zip] = p ? { lat: parseFloat(p.latitude), lng: parseFloat(p.longitude) } : null;
    } else { cache[zip] = null; }
  } catch (e) { cache[zip] = null; }
  return cache[zip];
}

async function runImport() {
  if (!importPreview || importing) return;
  importing = true;
  render();

  try {
    var p = importPreview;
    var bySerial = p.existingBySerial;

    // lat/lng: keep existing coordinates; for new assets reuse coordinates of
    // another asset in the same zip, otherwise geocode the zip
    var zipLL = {};
    for (var s in bySerial) {
      var a = bySerial[s];
      if (a.lat != null && zipLL[a.zip] === undefined) { zipLL[a.zip] = { lat: a.lat, lng: a.lng }; }
    }
    var geoCache = {};
    var upserts = [];
    for (var i = 0; i < p.rows.length; i++) {
      var rec = p.rows[i];
      var existing = bySerial[rec.serial.toUpperCase()];
      var ll = existing && existing.lat != null ? { lat: existing.lat, lng: existing.lng }
        : (zipLL[rec.zip] || await geocodeZip(rec.zip, geoCache));
      upserts.push({
        store: rec.store, address: rec.address, city: rec.city, state: rec.state,
        zip: rec.zip, phone: rec.phone, manufacturer: rec.manufacturer, model: rec.model,
        serial: existing ? existing.serial : rec.serial, warranty: rec.warranty,
        active: true, lat: ll ? ll.lat : null, lng: ll ? ll.lng : null,
        updated_at: new Date().toISOString()
      });
    }

    for (var j = 0; j < upserts.length; j += 100) {
      var { error: upErr } = await sb.from('assets').upsert(upserts.slice(j, j + 100), { onConflict: 'serial' });
      if (upErr) { throw new Error('Import failed at row ' + (j + 1) + ': ' + upErr.message); }
    }

    var deactivated = 0;
    if (importFullReplace && p.deactivateSerials.length) {
      for (var k = 0; k < p.deactivateSerials.length; k += 100) {
        var chunk = p.deactivateSerials.slice(k, k + 100);
        var { error: deErr } = await sb.from('assets').update({ active: false, updated_at: new Date().toISOString() }).in('serial', chunk);
        if (deErr) { throw new Error('Deactivation failed: ' + deErr.message); }
        deactivated += chunk.length;
      }
    }

    await loadAssets();
    importing = false;
    var msg = 'Import complete: ' + p.newCount + ' added, ' + p.updateCount + ' updated';
    if (deactivated) { msg += ', ' + deactivated + ' removed'; }
    importPreview = null;
    showStatus(msg, 'ok');
  } catch (err) {
    importing = false;
    showStatus('Error: ' + err.message, 'err');
    render();
  }
}
